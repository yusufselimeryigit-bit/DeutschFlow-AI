<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DeutschFlow AI</title>
<meta name="description" content="A1'den C2'ye oyunlaştırılmış, yapay zeka destekli Almanca öğrenme uygulaması">
<meta name="theme-color" content="#58CC02">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.tailwindcss.com/3.4.3"></script>
<script>tailwind.config = { darkMode: 'class', corePlugins: { preflight: false } };</script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
/* ============ TASARIM DEĞİŞKENLERİ ============ */
:root {
  --bg: #F3F6FB; --bg2: #FFFFFF; --card: rgba(255,255,255,.74); --card2: rgba(255,255,255,.92);
  --stroke: rgba(15,23,42,.08); --text: #0F172A; --muted: #64748B; --soft: rgba(15,23,42,.05);
  --a1: #58CC02; --a1d: #46A302; --a2: #1CB0F6; --a2d: #1899D6; --b1: #A560F0; --b1d: #8549BA;
  --b2: #FF9600; --b2d: #CC7800; --c1: #FFC800; --c1d: #D9A800; --c2: #E5A400; --c2d: #B8860B;
  --red: #FF4B4B; --redd: #D33131; --green: #58CC02; --greend: #46A302;
  --lv: var(--a1); --lvd: var(--a1d);
  --shadow: 0 12px 34px -14px rgba(15,23,42,.22); --r: 22px;
  --nav-h: 74px;
}
.dark {
  --bg: #0A0F1F; --bg2: #111833; --card: rgba(22,29,56,.68); --card2: rgba(26,34,64,.94);
  --stroke: rgba(255,255,255,.08); --text: #E8ECF8; --muted: #94A3B8; --soft: rgba(255,255,255,.06);
  --shadow: 0 14px 40px -16px rgba(0,0,0,.6);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body { font-family: 'Nunito', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; transition: background .3s, color .3s; }
body::before { content: ''; position: fixed; inset: -20%; z-index: -1; pointer-events: none;
  background: radial-gradient(40% 35% at 12% 10%, rgba(88,204,2,.18), transparent 70%), radial-gradient(35% 30% at 88% 18%, rgba(28,176,246,.16), transparent 70%), radial-gradient(40% 40% at 70% 90%, rgba(165,96,240,.14), transparent 70%); }
h1, h2, h3, .font-display { font-family: 'Outfit', 'Nunito', sans-serif; letter-spacing: -.01em; margin: 0; }
button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
input, textarea, select { font-family: inherit; color: var(--text); }
a { color: inherit; }
::selection { background: rgba(88,204,2,.3); }

/* ============ CAM KARTLAR ============ */
.glass { background: var(--card); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); border: 1px solid var(--stroke); border-radius: var(--r); box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.35); }
.dark .glass { box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.05); }
.card { padding: 20px; }
.muted { color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; font-weight: 800; font-size: 13px; background: var(--soft); }
.lvl-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 38px; height: 26px; padding: 0 10px; border-radius: 999px; font-weight: 900; font-size: 13px; color: #fff; background: var(--lv); }
.pill-input { width: 100%; padding: 13px 16px; border-radius: 16px; border: 2px solid var(--stroke); background: var(--card2); font-size: 16px; outline: none; transition: border-color .2s; }
.pill-input:focus { border-color: var(--lv); }
textarea.pill-input { resize: vertical; min-height: 90px; }

/* ============ DUOLINGO TARZI 3D DÜĞMELER ============ */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 20px; border-radius: 16px; font-weight: 900; font-size: 15px; letter-spacing: .01em; background: var(--lv); color: #fff; box-shadow: 0 4px 0 var(--lvd); transition: transform .08s, box-shadow .08s, filter .2s; user-select: none; }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--lvd); }
.btn:disabled { filter: grayscale(.9) opacity(.55); cursor: not-allowed; transform: none; }
.btn-ghost { background: var(--card2); color: var(--text); box-shadow: 0 4px 0 var(--stroke), inset 0 0 0 2px var(--stroke); }
.btn-ghost:active { box-shadow: inset 0 0 0 2px var(--stroke); }
.btn-red { background: var(--red); box-shadow: 0 4px 0 var(--redd); }
.btn-sm { padding: 8px 14px; font-size: 13px; border-radius: 12px; }
.btn-block { width: 100%; }
.icon-btn { width: 42px; height: 42px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; background: var(--soft); transition: transform .15s, background .2s; }
.icon-btn:hover { background: var(--stroke); }
.icon-btn:active { transform: scale(.9); }
.press { transition: transform .12s cubic-bezier(.34,1.56,.64,1); }
.press:active { transform: scale(.95); }

/* ============ DÜZEN ============ */
#app { display: grid; grid-template-columns: 270px 1fr; min-height: 100vh; }
#sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 22px 14px; border-right: 1px solid var(--stroke); background: var(--card); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
.brand-logo { width: 42px; height: 42px; border-radius: 13px; background: linear-gradient(135deg, var(--a1), var(--a2)); display: flex; align-items: center; justify-content: center; color: #fff; font-family: 'Outfit'; font-weight: 800; font-size: 20px; box-shadow: 0 6px 16px -6px rgba(88,204,2,.7); }
.brand b { font-family: 'Outfit'; font-size: 21px; }
.brand small { display: block; font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: .12em; }
.nav-group { font-size: 11px; font-weight: 900; letter-spacing: .14em; color: var(--muted); padding: 14px 12px 6px; text-transform: uppercase; }
.nav-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; font-weight: 800; font-size: 15px; color: var(--text); text-align: left; transition: background .2s, color .2s; }
.nav-item i { width: 22px; text-align: center; font-size: 17px; color: var(--muted); }
.nav-item:hover { background: var(--soft); }
.nav-item.active { background: rgba(88,204,2,.14); color: var(--a1d); }
.nav-item.active i { color: var(--a1); }
.dark .nav-item.active { color: #8EE04A; }
#main { padding: 26px 28px 120px; max-width: 1180px; width: 100%; margin: 0 auto; }
#topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
.stat-pill { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px; font-weight: 900; font-size: 15px; background: var(--card); border: 1px solid var(--stroke); }
#bottomNav { display: none; }
.conj-grid { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
@media (max-width: 760px) { .conj-grid { grid-template-columns: 1fr; } }
.grid-2 > *, .grid-3 > *, .grid-4 > *, .conj-grid > *, .box-grid > * { min-width: 0; }
.verb-row b { flex-shrink: 0; }
.verb-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.box-grid { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 12px; }
@media (max-width: 620px) { .box-grid { grid-template-columns: repeat(3, minmax(0,1fr)); } }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; }
.stack > * + * { margin-top: 16px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.page-title { font-size: 30px; font-weight: 800; }
.page-sub { color: var(--muted); font-weight: 700; margin: 4px 0 20px; }
.section-title { font-size: 19px; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
.ro-banner { display: none; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 14px; margin-bottom: 16px; font-weight: 800; background: rgba(28,176,246,.14); color: var(--a2d); }
body.readonly .ro-banner { display: flex; }

@media (max-width: 960px) {
  #app { grid-template-columns: 1fr; }
  #sidebar { display: none; }
  #main { padding: 16px 16px calc(var(--nav-h) + 90px + env(safe-area-inset-bottom)); }
  #topbar { padding-top: env(safe-area-inset-top); }
  #bottomNav { display: flex; position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); height: var(--nav-h); z-index: 60; justify-content: space-around; align-items: center; padding: 0 6px; border-radius: 26px; }
  .bn-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 900; color: var(--muted); padding: 8px 0; border-radius: 18px; }
  .bn-item i { font-size: 20px; }
  .bn-item.active { color: var(--a1); }
  .grid-3, .grid-4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .page-title { font-size: 25px; }
}
@media (max-width: 620px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } .grid-4 { grid-template-columns: repeat(2, minmax(0,1fr)); } }

/* ============ ÖĞRENME YOLU (DUOLINGO PATİKASI) ============ */
.level-block { margin-bottom: 34px; }
.level-head { display: flex; align-items: center; gap: 14px; padding: 18px 20px; border-radius: 22px; color: #fff; background: var(--lv); box-shadow: 0 6px 0 var(--lvd); margin-bottom: 26px; }
.level-head h2 { font-size: 22px; }
.level-head p { margin: 2px 0 0; font-weight: 700; opacity: .9; font-size: 14px; }
.level-head .lh-ic { width: 52px; height: 52px; border-radius: 16px; background: rgba(255,255,255,.22); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
.level-head.locked { filter: grayscale(.85) opacity(.7); }
.path { display: flex; flex-direction: column; align-items: center; gap: 22px; }
.node-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.node { position: relative; width: 76px; height: 76px; border-radius: 50%; background: var(--lv); color: #fff; font-size: 28px; display: flex; align-items: center; justify-content: center; box-shadow: 0 7px 0 var(--lvd), 0 12px 24px -10px var(--lv); transition: transform .12s; }
.node:active { transform: translateY(6px); box-shadow: 0 1px 0 var(--lvd); }
.node.locked { background: #CBD5E1; box-shadow: 0 7px 0 #94A3B8; color: #F8FAFC; cursor: not-allowed; }
.dark .node.locked { background: #334155; box-shadow: 0 7px 0 #1E293B; color: #64748B; }
.node.done::after { content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900; position: absolute; right: -4px; top: -4px; width: 28px; height: 28px; border-radius: 50%; background: #FFC800; color: #fff; font-size: 13px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 #D9A800; }
.node.current { animation: nodePulse 1.8s ease-in-out infinite; }
@keyframes nodePulse { 0%,100% { box-shadow: 0 7px 0 var(--lvd), 0 0 0 0 color-mix(in srgb, var(--lv) 55%, transparent); } 50% { box-shadow: 0 7px 0 var(--lvd), 0 0 0 14px transparent; } }
.node.boss { width: 92px; height: 92px; border-radius: 28px; font-size: 34px; }
.node-label { font-weight: 800; font-size: 14px; max-width: 170px; text-align: center; }

/* ============ MODAL / SHEET ============ */
.overlay { position: fixed; inset: 0; z-index: 350; background: rgba(2,6,23,.5); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 16px; animation: fadeIn .2s ease; }
.sheet { width: 100%; max-width: 720px; max-height: 92vh; overflow-y: auto; background: var(--card2); border-radius: 28px; border: 1px solid var(--stroke); box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); animation: sheetIn .35s cubic-bezier(.22,1,.36,1); }
.sheet-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 20px; background: var(--card2); border-bottom: 1px solid var(--stroke); }
.sheet-body { padding: 20px; }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes sheetIn { from { opacity: 0; transform: translateY(30px) scale(.97); } }
.tabs { display: flex; gap: 6px; padding: 4px; border-radius: 16px; background: var(--soft); margin-bottom: 16px; overflow-x: auto; }
.tab { flex: 1; white-space: nowrap; padding: 9px 14px; border-radius: 12px; font-weight: 800; font-size: 14px; color: var(--muted); }
.tab.active { background: var(--card2); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,.08); }

/* ============ DERS / ETKİNLİK MOTORU ============ */
#lesson { position: fixed; inset: 0; z-index: 120; background: var(--bg); display: flex; flex-direction: column; }
.ls-top { display: flex; align-items: center; gap: 14px; padding: calc(14px + env(safe-area-inset-top)) 20px 14px; max-width: 900px; width: 100%; margin: 0 auto; }
.progress { flex: 1; height: 16px; border-radius: 999px; background: var(--soft); overflow: hidden; }
.progress > div { height: 100%; border-radius: 999px; background: var(--lv); box-shadow: inset 0 -4px 0 rgba(0,0,0,.12), inset 0 4px 0 rgba(255,255,255,.25); transition: width .5s cubic-bezier(.22,1,.36,1); }
.ls-body { flex: 1; overflow-y: auto; padding: 10px 20px 30px; max-width: 760px; width: 100%; margin: 0 auto; }
.ls-kind { font-weight: 900; font-size: 13px; letter-spacing: .1em; color: var(--lv); text-transform: uppercase; margin-bottom: 8px; }
.ls-q { font-family: 'Outfit'; font-size: 26px; font-weight: 700; margin: 0 0 22px; line-height: 1.3; }
.opt { width: 100%; text-align: left; padding: 16px 18px; border-radius: 18px; border: 2px solid var(--stroke); background: var(--card2); font-weight: 800; font-size: 17px; box-shadow: 0 4px 0 var(--stroke); margin-bottom: 12px; transition: transform .08s, border-color .15s, background .15s; display: flex; align-items: center; gap: 12px; }
.opt:active { transform: translateY(3px); box-shadow: none; }
.opt .k { width: 30px; height: 30px; border-radius: 10px; border: 2px solid var(--stroke); display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--muted); flex-shrink: 0; }
.opt.sel { border-color: var(--a2); background: rgba(28,176,246,.1); box-shadow: 0 4px 0 var(--a2d); }
.opt.ok { border-color: var(--green); background: rgba(88,204,2,.12); }
.opt.bad { border-color: var(--red); background: rgba(255,75,75,.1); }
.tf-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tf-row .opt { justify-content: center; font-size: 19px; }
.bank, .answer-line { display: flex; flex-wrap: wrap; gap: 10px; min-height: 58px; padding: 10px; border-radius: 18px; }
.answer-line { border-bottom: 2px solid var(--stroke); border-radius: 0; margin-bottom: 18px; }
.tok { padding: 10px 15px; border-radius: 14px; border: 2px solid var(--stroke); background: var(--card2); font-weight: 800; font-size: 17px; box-shadow: 0 3px 0 var(--stroke); }
.tok.used { visibility: hidden; }
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.match-grid .opt { justify-content: center; text-align: center; margin: 0; }
.match-grid .opt.gone { opacity: .25; pointer-events: none; border-color: var(--green); }
.ls-foot { border-top: 2px solid var(--stroke); padding: 18px 20px calc(18px + env(safe-area-inset-bottom)); background: var(--bg); transition: background .2s; }
.ls-foot-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.ls-foot.ok { background: rgba(88,204,2,.14); }
.ls-foot.bad { background: rgba(255,75,75,.12); }
.fb-title { font-family: 'Outfit'; font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
.ls-foot.ok .fb-title { color: var(--greend); }
.ls-foot.bad .fb-title { color: var(--redd); }
.dark .ls-foot.ok .fb-title { color: #8EE04A; }
.dark .ls-foot.bad .fb-title { color: #FF8080; }
.fb-text { font-weight: 700; margin-top: 4px; max-width: 520px; }
.ai-box { margin-top: 10px; padding: 12px 14px; border-radius: 14px; background: var(--card2); border: 1px solid var(--stroke); font-weight: 600; font-size: 15px; line-height: 1.5; max-width: 560px; }
.diff span { padding: 1px 2px; border-radius: 4px; }
.diff .d-ok { color: var(--greend); }
.diff .d-bad { background: rgba(255,75,75,.22); color: var(--redd); text-decoration: line-through; }
.diff .d-miss { background: rgba(255,200,0,.3); color: #B45309; }
.dark .diff .d-ok { color: #8EE04A; } .dark .diff .d-bad { color: #FF8080; } .dark .diff .d-miss { color: #FFD666; }

/* ============ GRAMMATIK KARTLARI / TABLOLAR ============ */
.guide h4 { font-family: 'Outfit'; font-size: 18px; margin: 18px 0 8px; }
.guide p { line-height: 1.6; font-weight: 600; margin: 8px 0; }
.guide ul { margin: 8px 0; padding-left: 20px; line-height: 1.7; font-weight: 600; }
.guide .tip { padding: 12px 14px; border-radius: 14px; background: rgba(255,200,0,.14); border-left: 4px solid #FFC800; font-weight: 700; margin: 12px 0; }
.guide .ex { padding: 10px 14px; border-radius: 14px; background: var(--soft); margin: 8px 0; font-weight: 700; }
.guide .ex i { color: var(--muted); font-style: normal; font-weight: 600; display: block; font-size: 14px; }
table.gt { width: 100%; border-collapse: separate; border-spacing: 0; margin: 10px 0; border-radius: 14px; overflow: hidden; border: 1px solid var(--stroke); font-size: 15px; }
table.gt th { background: var(--lv); color: #fff; padding: 9px 12px; text-align: left; font-weight: 900; }
table.gt td { padding: 9px 12px; border-top: 1px solid var(--stroke); font-weight: 700; background: var(--card2); }
table.gt tr:nth-child(even) td { background: var(--soft); }
.hl-m { color: #1C7FD6; font-weight: 900; } .hl-f { color: #E0365F; font-weight: 900; } .hl-n { color: #2E9E2E; font-weight: 900; } .hl-p { color: #A560F0; font-weight: 900; } .hl { background: rgba(255,200,0,.35); border-radius: 4px; padding: 0 3px; }
.dark .hl-m { color: #6CB8FF; } .dark .hl-f { color: #FF7A9C; } .dark .hl-n { color: #6FDB6F; }
.tbl-wrap { overflow-x: auto; }

/* ============ KARTLAR / ÇEŞİTLİ ============ */
.quest { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
.quest + .quest { border-top: 1px solid var(--stroke); }
.quest .q-ic { width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; flex-shrink: 0; }
.bar { height: 12px; border-radius: 999px; background: var(--soft); overflow: hidden; }
.bar > div { height: 100%; border-radius: 999px; background: var(--lv); transition: width .6s cubic-bezier(.22,1,.36,1); }
.idiom { background: linear-gradient(135deg, #FF9600, #FFC800); color: #fff; border: 0; }
.idiom .muted { color: rgba(255,255,255,.85); }
.flash { perspective: 1200px; height: 230px; cursor: pointer; }
.flash-in { position: relative; width: 100%; height: 100%; transition: transform .6s cubic-bezier(.22,1,.36,1); transform-style: preserve-3d; }
.flash.flip .flash-in { transform: rotateY(180deg); }
.flash-f, .flash-b { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
.flash-f { background: var(--card2); border: 2px solid var(--stroke); box-shadow: 0 6px 0 var(--stroke); }
.flash-b { background: var(--lv); color: #fff; transform: rotateY(180deg); box-shadow: 0 6px 0 var(--lvd); }
.flash .big { font-family: 'Outfit'; font-size: 32px; font-weight: 800; }
.box-col { text-align: center; padding: 14px 6px; border-radius: 18px; background: var(--soft); }
.box-col b { display: block; font-family: 'Outfit'; font-size: 28px; }
.story-w { cursor: pointer; border-radius: 6px; padding: 0 1px; transition: background .15s; }
.story-w:hover { background: rgba(28,176,246,.18); }
.story-s { font-size: 20px; line-height: 1.8; font-weight: 700; margin: 0 0 6px; }
.story-tr { font-size: 15px; color: var(--muted); font-weight: 700; margin: 0 0 16px; display: none; }
.show-tr .story-tr { display: block; }
#wordPop { position: fixed; z-index: 360; max-width: 280px; padding: 14px; border-radius: 18px; background: var(--card2); border: 1px solid var(--stroke); box-shadow: 0 18px 40px -12px rgba(0,0,0,.4); animation: sheetIn .2s ease; }

.msg.ai { align-self: flex-start; background: var(--card2); border: 1px solid var(--stroke); border-bottom-left-radius: 6px; }

.typing i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin: 0 2px; animation: typing 1s infinite; }

#tutorFab { position: fixed; right: 22px; bottom: 22px; z-index: 70; width: 62px; height: 62px; border-radius: 22px; background: linear-gradient(135deg, var(--b1), var(--a2)); color: #fff; font-size: 24px; box-shadow: 0 6px 0 var(--b1d), 0 16px 30px -10px rgba(165,96,240,.7); }
#tutorPanel { position: fixed; right: 22px; bottom: 98px; z-index: 75; width: min(400px, calc(100vw - 24px)); height: min(560px, calc(100vh - 140px)); display: flex; flex-direction: column; overflow: hidden; animation: sheetIn .3s cubic-bezier(.22,1,.36,1); }
.tutor-top { display: none; }
@media (max-width: 960px) { #tutorFab { display: none !important; } .tutor-top { display: inline-flex; } #tutorPanel { left: 12px; right: 12px; width: auto; top: calc(12px + env(safe-area-inset-top)); bottom: calc(var(--nav-h) + 22px + env(safe-area-inset-bottom)); height: auto; z-index: 90; } }
.mic-btn { width: 120px; height: 120px; border-radius: 50%; font-size: 44px; color: #fff; background: linear-gradient(135deg, var(--b1), var(--a2)); box-shadow: 0 8px 0 var(--b1d), 0 20px 40px -12px rgba(165,96,240,.6); transition: transform .15s; }

@keyframes micPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
.pring { position: relative; width: 220px; height: 220px; margin: 0 auto; }
.pring svg { transform: rotate(-90deg); }
.pring .rt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.pring .rt b { font-family: 'Outfit'; font-size: 46px; font-variant-numeric: tabular-nums; }
.badge { text-align: center; padding: 18px 10px; }
.badge .b-ic { width: 70px; height: 70px; margin: 0 auto 10px; border-radius: 22px; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.18); }
.badge.locked .b-ic { background: #CBD5E1 !important; color: #F1F5F9; box-shadow: 0 5px 0 #94A3B8; }
.dark .badge.locked .b-ic { background: #334155 !important; box-shadow: 0 5px 0 #1E293B; color: #64748B; }

#toast { position: fixed; left: 50%; top: calc(18px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 400; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { padding: 12px 18px; border-radius: 16px; font-weight: 800; background: var(--card2); border: 1px solid var(--stroke); box-shadow: 0 14px 30px -12px rgba(0,0,0,.35); animation: sheetIn .3s ease; display: flex; align-items: center; gap: 10px; }
.xp-float { position: fixed; z-index: 410; pointer-events: none; font-family: 'Outfit'; font-weight: 800; font-size: 26px; color: var(--c1); text-shadow: 0 3px 0 var(--c1d); }

.empty i { font-size: 40px; margin-bottom: 10px; display: block; opacity: .6; }
.kbd { display: inline-block; padding: 1px 7px; border-radius: 6px; border: 1px solid var(--stroke); background: var(--soft); font-size: 12px; font-weight: 800; }

/* ============ PROFİL / PIN EKRANI ============ */
#gate { position: fixed; inset: 0; z-index: 300; display: flex; align-items: center; justify-content: center; padding: 20px; background: var(--bg); overflow-y: auto; }
.prof { width: 132px; padding: 18px 10px; border-radius: 24px; text-align: center; }
.prof .av { width: 76px; height: 76px; margin: 0 auto 10px; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-family: 'Outfit'; font-size: 32px; font-weight: 800; color: #fff; box-shadow: 0 6px 0 rgba(0,0,0,.18); }
.pin-dots { display: flex; gap: 14px; justify-content: center; margin: 18px 0; }
.pin-dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--muted); transition: background .15s, transform .15s; }
.pin-dots i.on { background: var(--a1); border-color: var(--a1); transform: scale(1.15); }
.pin-pad { display: grid; grid-template-columns: repeat(3, 72px); gap: 14px; justify-content: center; }
.pin-pad button { height: 72px; border-radius: 50%; font-size: 26px; font-weight: 800; background: var(--card2); border: 1px solid var(--stroke); box-shadow: 0 4px 0 var(--stroke); }
.pin-pad button:active { transform: translateY(3px); box-shadow: none; }
.shake { animation: shake .4s; }
@keyframes shake { 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }

/* ============ ÇİZİM KATMANI ============ */
#drawLayer { position: fixed; inset: 0; z-index: 380; touch-action: none; }
#drawLayer canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
#drawBar { position: fixed; z-index: 385; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 22px; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 24px); }
.swatch { width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent; box-shadow: 0 0 0 1px var(--stroke); }
.swatch.on { border-color: var(--text); }
#drawBar .icon-btn.on { background: var(--a2); color: #fff; }

/* Üstte yüzen paneller: arkadaki içerik okunmasın */
#tutorPanel, #wordPop { background: var(--bg2) !important; }
#bottomNav, #drawBar { background: color-mix(in srgb, var(--bg2) 92%, transparent) !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>

  { id: 'a1u1', t: 'Begrüßung & Zahlen', ic: 'fa-hand', g: `
    <h4>Selamlaşma (Begrüßung)</h4>

    q: [['mc', 'Akşam biriyle karşılaşınca ne dersin?', ['Guten Morgen', 'Guten Abend', 'Gute Nacht'], 1, '“Guten Abend” akşam karşılaşınca, “Gute Nacht” yatmadan önce söylenir.'],

  { id: 'a1u2', t: 'Artikel: der, die, das', ic: 'fa-tag', g: `
    <p>Almancada her ismin bir cinsiyeti (Genus) vardır ve isim bir <b>artikel</b> ile öğrenilir.</p>

  { id: 'a1u3', t: 'Personalpronomen, sein & haben', ic: 'fa-user', g: `

  { id: 'b2u2', t: 'Partizip I & II als Adjektiv', ic: 'fa-chart-line', g: `

function pinPad(p, onOk, title) {
  let buf = '';
  modal(`<div class="sheet-body" style="text-align:center;padding:30px 20px">
    <div class="av" style="width:70px;height:70px;margin:0 auto 10px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-family:Outfit;font-size:30px;font-weight:800;color:#fff;background:${p.color}">${esc(p.name.charAt(0).toUpperCase())}</div>

    <div class="pin-pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, 'x', 0, '⌫'].map(k => k === 'x' ? '<span></span>' : `<button data-k="${k}">${k}</button>`).join('')}</div>
    <button class="btn btn-ghost btn-sm" style="margin-top:18px" onclick="closeModal()">Vazgeç</button></div>`, true, 420);
  const dots = () => document.querySelectorAll('#pinDots i').forEach((d, i) => d.classList.toggle('on', i < buf.length));
  const press = async k => {
    if (k === '⌫') buf = buf.slice(0, -1); else if (buf.length < 4) buf += k;
    dots();
    if (buf.length === 4) {
      if (await sha(buf) === p.pin) { closeModal(); onOk(); }
      else { const el = $('#pinDots'); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); sfxBad(); buf = ''; setTimeout(dots, 300); }

  document.querySelectorAll('.pin-pad button').forEach(b => b.onclick = () => press(b.dataset.k));
  const keyH = e => { if (!$('#pinDots')) { removeEventListener('keydown', keyH); return; } if (/^\d$/.test(e.key)) press(e.key); if (e.key === 'Backspace') press('⌫'); };
  addEventListener('keydown', keyH);
}

/* ---------- Verb-Konjugator ---------- */
const PERS = ['ich', 'du', 'er/sie/es', 'wir', 'ihr', 'sie/Sie'];
function conj(v) {
  const inf = v.i, stem = inf.endsWith('en') ? inf.slice(0, -2) : inf.slice(0, -1), needE = /[td]$/.test(stem) || /[^aeiouäöülrh][mn]$/.test(stem), sz = /[sßxz]$/.test(stem);
  const p = v.p || [stem + 'e', stem + (needE ? 'est' : sz ? 't' : 'st'), stem + (needE ? 'et' : 't'), inf, stem + (needE ? 'et' : 't'), inf];
  const base = stem + (needE ? 'ete' : 'te'), pr = v.pr || [base, base + 'st', base, base + 'n', base + 't', base + 'n'];
  const p2 = v.p2 || (/ieren$/.test(inf) ? stem + 't' : /^(be|ver|er|ent|emp|ge|zer|miss)/.test(inf) ? stem + (needE ? 'et' : 't') : 'ge' + stem + (needE ? 'et' : 't'));
  const aux = v.a === 'sein' ? ['bin', 'bist', 'ist', 'sind', 'seid', 'sind'] : ['habe', 'hast', 'hat', 'haben', 'habt', 'haben'];
  const K2 = { sein: 'wär', haben: 'hätt', werden: 'würd', können: 'könnt', müssen: 'müsst', wollen: 'wollt', dürfen: 'dürft', sollen: 'sollt', mögen: 'möcht', wissen: 'wüsst' };

    <div class="grid-3" style="margin:12px 0">${[['ok', 'Doğru', 'a1'], ['bad', 'Yanlış', 'red'], ['empty', 'Boş', 'a2']].map(([k, t, c]) => `<button class="btn" style="${c === 'red' ? '--lv:var(--red);--lvd:var(--redd)' : lvStyle(c)}" onclick="swMark('${k}')">${t} <b>${SW.c[k]}</b></button>`).join('')}</div>
    <div class="row"><button class="btn btn-ghost btn-sm" onclick="swToggle()"><i class="fa-solid ${SW.running ? 'fa-pause' : 'fa-play'}"></i> ${SW.running ? 'Durdur' : 'Başlat'}</button><button class="btn btn-ghost btn-sm" onclick="swReset()"><i class="fa-solid fa-rotate-left"></i> Sıfırla</button>${SW.laps.length ? `<span class="chip" style="margin-left:auto">Ortalama: ${fmt(SW.laps.reduce((a, l) => a + l.s, 0) / SW.laps.length)}</span>` : ''}</div>
    <div style="max-height:260px;overflow-y:auto;margin-top:12px">${SW.laps.map((l, i) => `<div class="between" style="padding:7px 0;border-bottom:1px solid var(--stroke);font-weight:800"><span>${SW.laps.length - i}. soru</span><span style="color:${l.k === 'ok' ? 'var(--a1)' : l.k === 'bad' ? 'var(--red)' : 'var(--a2)'}">${{ ok: 'Doğru', bad: 'Yanlış', empty: 'Boş' }[l.k]}</span><span class="muted">${fmt(l.s)}</span></div>`).join('') || '<div class="empty" style="padding:16px">Başlat, her soruyu çözünce sonucunu işaretle.</div>'}</div></div></div>`;
};
function pomoMode(m) { POMO.mode = m; POMO.left = POMO.len[m]; if (PAGE === 'focus') go('focus'); }
function pomoToggle() {
  POMO.running = !POMO.running; clearInterval(POMO.t);
  if (POMO.running) POMO.t = setInterval(() => { POMO.left--; if (POMO.left <= 0) pomoDone(); pomoPaint(); }, 1000);
  if (PAGE === 'focus') go('focus');
}
function pomoPaint() { const t = $('#pomoT'), a = $('#pomoArc'); if (t) t.textContent = fmt(POMO.left); if (a) { const C = 2 * Math.PI * 96; a.setAttribute('stroke-dashoffset', C * (POMO.left / POMO.len[POMO.mode])); } document.title = POMO.running ? fmt(POMO.left) + ' · DeutschFlow' : 'DeutschFlow AI'; }
function pomoReset() { clearInterval(POMO.t); POMO.running = false; POMO.left = POMO.len[POMO.mode]; document.title = 'DeutschFlow AI'; if (PAGE === 'focus') go('focus'); }
function pomoDone(skip) {
  clearInterval(POMO.t); POMO.running = false; beep(880, .3); setTimeout(() => beep(660, .3), 350);
  if (POMO.mode === 'work' && !skip && D && !RO) { D.stats.pomo++; D.stats.focusMin += 25; dayRec().min += 25; addXP(10); checkBadges(); save(); toast('🍅 Pomodoro bitti! 5 dakika mola.'); confettiBurst(); }
  else if (POMO.mode === 'break' && !skip) toast('☕ Mola bitti, hadi devam!');
  pomoMode(POMO.mode === 'work' ? 'break' : 'work');
}
const swElapsed = () => (SW.acc + (SW.running ? Date.now() - SW.start : 0)) / 1000;
function swToggle() { if (SW.running) { SW.acc += Date.now() - SW.start; SW.running = false; clearInterval(SW.t); } else { SW.start = Date.now(); SW.running = true; SW.t = setInterval(() => { const e = $('#swT'); if (e) e.textContent = fmt(swElapsed()); }, 250); } if (PAGE === 'focus') go('focus'); }
function swMark(k) { if (!SW.running) swToggle(); const now = swElapsed(); SW.laps.unshift({ k, s: now - SW.last }); SW.last = now; SW.c[k]++; beep(k === 'ok' ? 880 : k === 'bad' ? 260 : 520, .08); if (PAGE === 'focus') go('focus'); }
function swReset() { clearInterval(SW.t); Object.assign(SW, { running: false, start: 0, acc: 0, last: 0, laps: [], c: { ok: 0, bad: 0, empty: 0 } }); if (PAGE === 'focus') go('focus'); }

/* ---------- Gelişim raporu ---------- */
VIEWS.report = () => {
  const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(Date.now() - (6 - i) * DAY), k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); return { k, n: d.toLocaleDateString('tr-TR', { weekday: 'short' }), r: D.days[k] || { xp: 0, lessons: 0, answers: 0, correct: 0, min: 0 } }; });
  const max = Math.max(20, ...days.map(d => d.r.xp)), wk = days.reduce((a, d) => ({ xp: a.xp + d.r.xp, lessons: a.lessons + d.r.lessons, answers: a.answers + d.r.answers, correct: a.correct + d.r.correct, min: a.min + d.r.min }), { xp: 0, lessons: 0, answers: 0, correct: 0, min: 0 });
  const acc = wk.answers ? Math.round(wk.correct / wk.answers * 100) : null;
  const weak = Object.entries(D.wrong.reduce((m, w) => { const u = w.item.unit; if (u) m[u] = (m[u] || 0) + 1; return m; }, {})).sort((a, b) => b[1] - a[1]).slice(0, 4);
  return `<div class="grid-4">${[['Bu hafta XP', wk.xp, 'fa-bolt', 'var(--c1)'], ['Ders', wk.lessons, 'fa-graduation-cap', 'var(--a1)'], ['Doğruluk', acc == null ? '—' : '%' + acc, 'fa-bullseye', 'var(--a2)'], ['Çalışma', wk.min + ' dk', 'fa-clock', 'var(--b1)']].map(([t, v, ic, c]) => `<div class="glass card" style="padding:16px"><i class="fa-solid ${ic}" style="color:${c};font-size:20px"></i><div class="font-display" style="font-size:28px;font-weight:800;margin-top:6px">${v}</div><div class="muted" style="font-weight:800;font-size:13px">${t}</div></div>`).join('')}</div>
  <div class="grid-2" style="margin-top:16px"><div class="glass card"><div class="section-title"><i class="fa-solid fa-chart-column" style="color:var(--a1)"></i> Son 7 gün (XP)</div>
    <div style="display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:10px">${days.map(d => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end"><b style="font-size:13px">${d.r.xp || ''}</b><div style="width:100%;max-width:42px;height:${Math.max(4, d.r.xp / max * 140)}px;border-radius:10px 10px 4px 4px;background:${d.k === today() ? 'var(--a1)' : 'color-mix(in srgb,var(--a1) 45%,transparent)'};transition:height .6s"></div><span class="muted" style="font-size:12px;font-weight:800">${d.n}</span></div>`).join('')}</div></div>
  <div class="glass card"><div class="section-title"><i class="fa-solid fa-triangle-exclamation" style="color:var(--b2)"></i> Dikkat gereken konular</div>
    ${weak.length ? weak.map(([u, n]) => { const f = findUnit(u); return f ? `<button class="between nav-item" onclick="openUnit('${u}')"><span><span class="lvl-badge" style="${lvStyle(f.L.color)}">${f.L.id}</span> ${esc(f.u.t)}</span><span class="chip">${n} yanlış</span></button>` : ''; }).join('') : '<div class="empty" style="padding:16px">Henüz zayıf konu yok 🎯</div>'}
    <div class="muted" style="font-weight:700;margin-top:10px">Toplam: ${D.stats.answers} cevap · %${D.stats.answers ? Math.round(D.stats.correct / D.stats.answers * 100) : 0} doğruluk · ${lessonsDone(D)} ünite · ${D.cards.length} kart</div></div></div>
  <div class="glass card" style="margin-top:16px"><div class="between"><div class="section-title" style="margin:0"><i class="fa-solid fa-robot" style="color:var(--b1)"></i> Haftalık AI Gelişim Raporu</div><button class="btn btn-sm" onclick="aiReport()"><i class="fa-solid fa-wand-magic-sparkles"></i> ${D.report ? 'Yenile' : 'Oluştur'}</button></div>
    <div id="repOut" style="margin-top:12px;font-weight:600;line-height:1.6">${D.report ? `<div class="muted" style="font-size:13px;font-weight:800">${esc(D.report.date)}</div>${md(D.report.text)}` : '<span class="muted">Gemini haftalık verilerini analiz edip sana özel bir motivasyon ve çalışma planı hazırlasın.</span>'}</div></div>`;
};
async function aiReport() {
  if (!canEdit()) return; const o = $('#repOut'); o.innerHTML = '<span class="typing"><i></i><i></i><i></i></span> Rapor hazırlanıyor…';
  const days = Object.entries(D.days).sort().slice(-7), weak = D.wrong.slice(0, 15).map(w => (findUnit(w.item.unit) || { u: { t: '?' } }).u.t);
  const summary = { seviye: levelName(), toplamXP: D.xp, seri: displayStreak(), tamamlananUnite: lessonsDone(D), bossGecilen: Object.keys(D.boss), sonGunler: days, kartlar: D.cards.length, kutuDagilimi: [1, 2, 3, 4, 5].map(b => D.cards.filter(c => c.box === b).length), zayifKonular: weak, pomodoro: D.stats.pomo, telaffuz: D.stats.pron, dikte: D.stats.dict };
  try { const t = await aiText(`Öğrencinin son haftalık verileri (JSON): ${JSON.stringify(summary)}\nTürkçe, samimi ve motive edici bir “Haftalık Gelişim Raporu” yaz: 1) Genel değerlendirme 2) Güçlü yönler 3) Gelişim alanları (konu adlarıyla) 4) Gelecek hafta için günlük mini plan (7 madde) 5) Almanca motivasyon cümlesi + Türkçesi.`, tutorSys());
    D.report = { date: new Date().toLocaleString('tr-TR'), text: t }; save(); o.innerHTML = `<div class="muted" style="font-size:13px;font-weight:800">${esc(D.report.date)}</div>` + md(t); }
  catch (e) { o.innerHTML = aiErr(e); }
}

/* ---------- Rozetler ---------- */
VIEWS.badges = () => `<p class="page-sub">${Object.keys(D.badges).length}/${BADGES.length} rozet kazanıldı.</p><div class="grid-4">${BADGES.map(b => `<div class="glass badge ${D.badges[b.id] ? '' : 'locked'}"><div class="b-ic" style="background:${b.c}"><i class="fa-solid ${b.ic}"></i></div><b>${b.t}</b><div class="muted" style="font-size:13px;font-weight:700;margin-top:4px">${b.d}</div>${D.badges[b.id] ? `<div style="font-size:12px;font-weight:800;color:var(--a1);margin-top:6px">✓ ${new Date(D.badges[b.id]).toLocaleDateString('tr-TR')}</div>` : ''}</div>`).join('')}</div>`;

/* ---------- Ayarlar ---------- */
VIEWS.settings = () => {
  const p = PROFILES.find(x => x.id === PID), voices = ('speechSynthesis' in window ? speechSynthesis.getVoices() : []).filter(v => /^de/i.test(v.lang));
  return `<div class="grid-2" style="align-items:start"><div class="stack">
  <div class="glass card"><div class="section-title"><i class="fa-solid fa-user"></i> Profil</div>
    <input id="stName" class="pill-input" value="${esc(p.name)}" ${RO ? 'disabled' : ''}><div class="row" style="margin-top:10px"><button class="btn btn-sm" onclick="renameProfile()">Kaydet</button><button class="btn btn-sm btn-ghost" onclick="changePin()"><i class="fa-solid fa-key"></i> ${p.pin ? 'PIN değiştir / kaldır' : 'PIN ekle'}</button><button class="btn btn-sm btn-ghost" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Çıkış</button></div></div>
  <div class="glass card"><div class="section-title"><i class="fa-solid fa-palette"></i> Görünüm & Ses</div>
    <div class="between"><b>Koyu tema</b><input type="checkbox" ${document.documentElement.classList.contains('dark') ? 'checked' : ''} onchange="CFG.theme=this.checked?'dark':'light';saveCfg();applyTheme();renderTopbar()"></div>
    <div style="margin-top:14px"><b>Okuma hızı: <span id="rateV">${CFG.rate || .95}</span></b><input type="range" min=".5" max="1.3" step=".05" value="${CFG.rate || .95}" style="width:100%" oninput="CFG.rate=+this.value;document.getElementById('rateV').textContent=this.value;saveCfg()"></div>
    <div style="margin-top:10px"><b>Almanca ses</b><select class="pill-input" onchange="CFG.voice=this.value;saveCfg();pickVoice();say('Hallo! Ich bin deine Stimme.')"><option value="">Otomatik</option>${voices.map(v => `<option ${CFG.voice === v.name ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}</select>${voices.length ? '' : '<div class="muted" style="font-size:13px;font-weight:700">Cihazında Almanca ses bulunamadı; sistem ayarlarından indirebilirsin.</div>'}</div>
    <button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="say('Guten Tag! Willkommen bei DeutschFlow.')"><i class="fa-solid fa-volume-high"></i> Sesi dene</button></div>
  <div class="glass card"><div class="section-title"><i class="fa-solid fa-database"></i> Veri</div>
    <div class="row"><button class="btn btn-sm" onclick="exportData()"><i class="fa-solid fa-download"></i> Yedeği indir (JSON)</button><label class="btn btn-sm btn-ghost" style="cursor:pointer"><i class="fa-solid fa-upload"></i> Yedekten yükle<input type="file" accept=".json" hidden onchange="importData(this)"></label></div>
    <button class="btn btn-sm btn-red" style="margin-top:12px" onclick="resetProgress()"><i class="fa-solid fa-triangle-exclamation"></i> İlerlemeyi sıfırla</button>
    <button class="btn btn-sm btn-ghost" style="margin-top:12px" onclick="deleteProfile()"><i class="fa-solid fa-user-xmark"></i> Profili sil</button></div></div>
  <div class="stack"><div class="glass card"><div class="section-title"><i class="fa-solid fa-robot"></i> Yapay Zeka (Gemini)</div>
    <label class="muted" style="font-weight:800">API anahtarı</label><input id="stKey" class="pill-input" type="password" value="${esc(CFG.apiKey || '')}" placeholder="Boş = uygulamadaki varsayılan anahtar">
    <label class="muted" style="font-weight:800;margin-top:10px;display:block">Model</label><input id="stModel" class="pill-input" value="${esc(CFG.model || DEFAULT_MODEL)}">
    <div class="muted" style="font-size:13px;font-weight:700;margin-top:6px;word-break:break-all">Uç nokta: generativelanguage.googleapis.com/v1beta/models/<b>{model}</b>:generateContent</div>
    <div class="row" style="margin-top:10px"><button class="btn btn-sm" onclick="CFG.apiKey=$('#stKey').value.trim();CFG.model=$('#stModel').value.trim()||DEFAULT_MODEL;saveCfg();toast('Kaydedildi')">Kaydet</button><button class="btn btn-sm btn-ghost" onclick="testAI()"><i class="fa-solid fa-plug"></i> Bağlantıyı test et</button></div><div id="aiTest" style="margin-top:10px"></div></div>
  <div class="glass card"><div class="section-title"><i class="fa-solid fa-fire-flame-curved" style="color:var(--b2)"></i> Firebase Senkronizasyonu (isteğe bağlı)</div>
    <p class="muted" style="font-weight:700;margin-top:0;font-size:14px">Firebase konsolundaki web uygulaması yapılandırmanı (databaseURL içeren JSON) yapıştır. Profiller ve ilerleme Realtime Database'de <code>deutschflow/</code> altında senkronize edilir; yoksa her şey bu cihazda (LocalStorage) saklanır.</p>
    <textarea id="stFb" class="pill-input" rows="6" placeholder='{"apiKey":"…","authDomain":"…","databaseURL":"https://…firebaseio.com","projectId":"…"}'>${esc(typeof CFG.fbConfig === 'string' ? CFG.fbConfig : CFG.fbConfig ? JSON.stringify(CFG.fbConfig, null, 1) : '')}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn btn-sm" onclick="saveFb()">Bağlan & kaydet</button>${CFG.fbConfig ? `<button class="btn btn-sm btn-ghost" onclick="CFG.fbConfig=null;saveCfg();toast('Firebase kapatıldı (yeniden yükle)');go('settings')">Bağlantıyı kaldır</button><span class="chip"><i class="fa-solid fa-circle" style="color:${fb ? 'var(--a1)' : 'var(--b2)'};font-size:9px"></i>${fb ? 'Bağlı' : 'Ayarlı'}</span>` : ''}</div></div>
  <div class="glass card"><div class="section-title"><i class="fa-solid fa-mobile-screen"></i> Uygulama (PWA)</div><p class="muted" style="font-weight:700;margin:0;font-size:14px">Bir web sunucusunda (https) açtığında “Ana Ekrana Ekle” ile uygulama gibi kurulur ve çevrimdışı da açılır. Durum: <b>${navigator.serviceWorker && navigator.serviceWorker.controller ? 'çevrimdışı hazır ✓' : location.protocol.startsWith('http') ? 'kuruluyor…' : 'dosyadan açıldı (çevrimdışı önbellek için sunucu gerekir)'}</b></p></div></div></div>`;
};
async function testAI() { const o = $('#aiTest'); o.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>'; CFG.apiKey = $('#stKey').value.trim(); CFG.model = $('#stModel').value.trim() || DEFAULT_MODEL; saveCfg(); try { const t = await aiText('Sag in einem kurzen Satz Hallo auf Deutsch.'); o.innerHTML = `<span style="color:var(--a1);font-weight:800">✓ Çalışıyor:</span> ${esc(t.trim())}`; } catch (e) { o.innerHTML = aiErr(e); } }
async function saveFb() { const v = $('#stFb').value.trim(); if (!v) return; try { JSON.parse(v); } catch (e) { toast('Geçerli bir JSON değil', 'err'); return; } CFG.fbConfig = v; saveCfg(); fb = null; const db = await fbInit(); if (db) { toast('Firebase bağlandı'); fbPushProfiles(); save(); } go('settings'); }
function renameProfile() { if (!canEdit()) return; const p = PROFILES.find(x => x.id === PID), n = $('#stName').value.trim(); if (!n) return; p.name = n; p.updatedAt = Date.now(); saveProfiles(); toast('Ad güncellendi'); renderTopbar(); }
function changePin() {
  if (!canEdit()) return; const p = PROFILES.find(x => x.id === PID);
  const ask = () => { const n = prompt('Yeni 4 haneli PIN (kaldırmak için boş bırak):'); if (n === null) return; if (n && !/^\d{4}$/.test(n)) { toast('PIN 4 rakam olmalı', 'warn'); return; } (n ? sha(n) : Promise.resolve(null)).then(h => { p.pin = h; p.updatedAt = Date.now(); saveProfiles(); toast(h ? 'PIN ayarlandı' : 'PIN kaldırıldı'); go('settings'); }); };
  if (p.pin) pinPad(p, ask, 'Mevcut PIN'); else ask();
}
function exportData() { const b = new Blob([JSON.stringify({ app: 'DeutschFlow', v: 1, profile: PROFILES.find(x => x.id === PID), data: D }, null, 1)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'deutschflow-' + (PROFILES.find(x => x.id === PID) || {}).name + '-' + today() + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
function importData(inp) { if (!canEdit()) return; const f = inp.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const j = JSON.parse(r.result); if (!j.data) throw 0; if (!confirm('Bu profilin verisi yedekle değiştirilsin mi?')) return; D = migrate(j.data); save(); toast('Yedek yüklendi'); go('home'); } catch (e) { toast('Geçersiz yedek dosyası', 'err'); } }; r.readAsText(f); }
function resetProgress() { if (!canEdit()) return; const p = PROFILES.find(x => x.id === PID); const go2 = () => { if (!confirm('Tüm ilerleme silinecek. Emin misin?')) return; D = defaultData(); save(); toast('Sıfırlandı'); go('home'); }; if (p.pin) pinPad(p, go2, 'Sıfırlamak için PIN'); else go2(); }
function deleteProfile() { if (!canEdit()) return; const p = PROFILES.find(x => x.id === PID); const del = () => { if (!confirm(p.name + ' profili ve tüm verisi silinsin mi?')) return; PROFILES = PROFILES.filter(x => x.id !== PID); saveProfiles(); localStorage.removeItem('df_data_' + PID); if (fb) fb.ref('deutschflow/data/' + PID).remove(); logout(); }; if (p.pin) pinPad(p, del, 'Silmek için PIN'); else del(); }

/* ---------- Başlat ---------- */
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!CFG.theme) applyTheme(); });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
document.addEventListener('visibilitychange', () => { if (!document.hidden && D && PAGE === 'home') go('home'); });
renderGate();
</script>
</body>
</html>
