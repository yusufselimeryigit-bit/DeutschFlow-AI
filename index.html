  html.fx #topbar .page-title { font-size: 22px; }
  html.fx #bottomNav, html.fx.dark #bottomNav { background: var(--fx-glass) !important; -webkit-backdrop-filter: saturate(1.6) blur(20px); backdrop-filter: saturate(1.6) blur(20px); border: 1px solid color-mix(in srgb, var(--border) 80%, transparent); box-shadow: 0 10px 30px -12px rgba(17, 17, 24, .28); border-radius: 24px; }
  html.fx .bn-item { color: var(--faint); font-weight: 600; }
  html.fx .bn-item.active, html.fx.dark .bn-item.active { color: var(--ink); }
  html.fx .bn-item.active i { color: var(--ink); }
  html.fx .bn-item::before { background: var(--ink); }
}

/* ---------- Akış: tam ekran slaytlar, dikey yapışarak kayar ---------- */
.fx-feed { position: relative; overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; display: grid; grid-auto-rows: calc(100% - 30px); gap: 10px; border-radius: 26px; scrollbar-width: none; -webkit-overflow-scrolling: touch; outline: none; }
.fx-feed::-webkit-scrollbar { display: none; }
.fx-slide { position: relative; scroll-snap-align: start; scroll-snap-stop: always; border-radius: 26px; overflow: hidden; min-height: 0; isolation: isolate; }
/* Renk alanı: seviyenin rengi, ünitenin kendi kelimeleri dev harflerle doku olur */
.fx-field { background: var(--f); color: var(--fi); }
.fx-field::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(120% 70% at 85% 0%, rgba(255, 255, 255, .22), transparent 60%), linear-gradient(to top, rgba(0, 0, 0, var(--scrim, .26)), transparent 58%); }
.fx-words { position: absolute; inset: 22px 18px auto 22px; z-index: -1; font: 800 clamp(30px, 8.4vw, 46px)/.95 var(--display); letter-spacing: -.04em; color: var(--fi); opacity: .13; overflow: hidden; max-height: 54%; overflow-wrap: anywhere; pointer-events: none; }
.fx-words span { display: block; white-space: nowrap; }
.fx-cap { position: absolute; left: 20px; right: 84px; bottom: 20px; }
.fx-author { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font: 600 13px/1.2 var(--sans); margin-top: 14px; }
.fx-lv { font: 800 13px/1 var(--display); padding: 6px 8px; border-radius: 8px; background: var(--fi); color: var(--f); letter-spacing: 0; }
.fx-title { font: 800 clamp(40px, 11.5vw, 72px)/.94 var(--display); letter-spacing: -.04em; margin: 0 0 10px; color: var(--fi); text-wrap: balance; overflow-wrap: break-word; -webkit-hyphens: auto; hyphens: auto; }
.fx-sub { font-size: 15px; line-height: 1.4; margin: 0; opacity: .92; }
.fx-segs { display: flex; gap: 4px; margin-top: 12px; }
.fx-segs i { flex: 1; height: 4px; border-radius: 4px; background: color-mix(in srgb, var(--fi) 28%, transparent); }
.fx-segs i.on { background: var(--fi); }
.fx-segs i.cur { background: color-mix(in srgb, var(--fi) 62%, transparent); }
.fx-go { margin-top: 16px; width: 100%; height: 52px; border-radius: 16px; border: 0; background: var(--fi); color: var(--fd2, var(--f)); font: 700 16px var(--sans); display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; transition: transform .14s var(--ease-out); }
.fx-go:active { transform: scale(.97); }
.fx-rail { position: absolute; right: 12px; bottom: 96px; display: flex; flex-direction: column; gap: 14px; }
.fx-rb { display: flex; flex-direction: column; align-items: center; gap: 5px; border: 0; background: none; color: var(--fi); font: 600 11px/1 var(--sans); cursor: pointer; padding: 0; }
.fx-rb i { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; background: color-mix(in srgb, var(--fi) 18%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); transition: transform .16s var(--ease-out), background-color .16s, color .16s; }
.fx-rb:active i, .fx-rb.on i { transform: scale(.92); background: var(--fi); color: var(--f); }
.fx-slide.lock { --f: var(--fs) !important; --fi: var(--fdk) !important; --fd2: var(--fs); --scrim: 0; }
.fx-slide.lock .fx-words { opacity: .07; }
.fx-slide.lock .fx-title { color: var(--fdk); }
.fx-new { display: inline-flex; align-items: center; gap: 6px; font: 700 12px/1 var(--sans); padding: 6px 10px; border-radius: 99px; background: var(--fi); color: var(--f); }
.fx-hint { position: absolute; left: 0; right: 0; top: 14px; text-align: center; font: 600 12px var(--sans); color: var(--fi); opacity: .8; }
/* Açık slayt: içerik ağırlıklı (tekrar, deyim, görevler, yolculuk) */
.fx-plain { background: var(--surface); border: 1px solid var(--border); color: var(--ink); padding: 26px 22px 22px; display: flex; flex-direction: column; }
.fx-plain h2 { font: 800 clamp(30px, 8vw, 40px)/1 var(--display); letter-spacing: -.035em; margin: 0; }
.fx-plain .fx-lead { color: var(--muted); font-size: 15px; line-height: 1.45; margin: 8px 0 0; max-width: 40ch; }
.fx-plain .fx-foot { margin-top: auto; display: flex; gap: 8px; }
.fx-plain .fx-foot .btn { flex: 1; }
.fx-stack { margin: 22px 0 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.fx-stack li { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.fx-stack b { font: 700 24px/1.1 var(--display); letter-spacing: -.02em; }
.fx-stack span { color: var(--muted); font-size: 14px; text-align: right; }
.fx-tint { background: var(--c2s); border-color: transparent; }
.fx-idiom { font: 800 clamp(34px, 9.5vw, 50px)/1.02 var(--display); letter-spacing: -.035em; margin: 22px 0 10px; color: var(--c2d); text-wrap: balance; }
.fx-q { display: grid; grid-template-columns: minmax(0, 1fr) 90px auto; gap: 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--rule); font-weight: 500; }
.fx-q .bar { height: 6px; }
.fx-q.done { color: var(--faint); }
.fx-q .q-n { font: 500 13px var(--mono); color: var(--muted); }

/* ---------- Yolculuk: A1 → C2 seviye rayı ---------- */
.fx-jour { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.fx-jl { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; grid-template-rows: auto auto; column-gap: 12px; row-gap: 8px; align-items: center; width: 100%; text-align: left; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); cursor: pointer; transition: border-color .2s, background-color .2s; }
.fx-jl:hover { border-color: var(--f); }
.fx-jl .fx-jb { grid-row: span 2; width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; background: var(--f); color: var(--fi); font: 800 17px/1 var(--display); }
.fx-jl .fx-jt { font-weight: 600; font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fx-jl .fx-jn { font: 500 13px var(--mono); color: var(--muted); }
.fx-jl .fx-jbar { grid-column: 2 / 4; height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.fx-jl .fx-jbar i { display: block; height: 100%; border-radius: 6px; background: var(--f); }
.fx-jl.locked .fx-jb { background: var(--fs); color: var(--fdk); }
.fx-jl.on { border-color: var(--f); box-shadow: inset 0 0 0 1px var(--f); }
.fx-total { display: flex; align-items: baseline; gap: 10px; margin: 18px 0 14px; }
.fx-total b { font: 800 44px/1 var(--display); letter-spacing: -.04em; }
.fx-total span { color: var(--muted); font-size: 14px; }

/* ---------- Ana sayfa ve Öğren düzeni ---------- */
.fx-home, .fx-learn { display: grid; gap: 28px; }
.fx-side h2 { font: 800 26px/1.05 var(--display); letter-spacing: -.03em; margin: 0; }
.fx-side .fx-lead { color: var(--muted); margin: 6px 0 0; }
.fx-side section + section { margin-top: 30px; }
.fx-greet { font: 800 clamp(34px, 3.4vw, 48px)/1 var(--display); letter-spacing: -.04em; margin: 0 0 6px; }
@media (min-width: 961px) {
  .fx-home { grid-template-columns: minmax(360px, 440px) minmax(0, 1fr); align-items: start; gap: 44px; }
  .fx-learn { grid-template-columns: minmax(240px, 300px) minmax(360px, 460px); justify-content: center; align-items: start; gap: 40px; }
  .fx-learn .fx-jour { position: sticky; top: 30px; }
  .fx-slide.m-only { display: none; }
  .fx-home .fx-feed, .fx-learn .fx-feed { order: 0; }
}
@media (max-width: 960px) {
  .fx-home .fx-side { display: none; }
  .fx-home, .fx-learn { gap: 12px; grid-template-columns: minmax(0, 1fr); }
  .fx-home > *, .fx-learn > * { min-width: 0; }
  .fx-learn .fx-jour { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; scroll-snap-type: x proximity; }
  .fx-learn .fx-jour::-webkit-scrollbar { display: none; }
  .fx-learn .fx-jl { display: flex; flex-direction: column; align-items: stretch; gap: 6px; width: auto; flex: 0 0 auto; min-width: 74px; padding: 8px 10px; border-radius: 14px; scroll-snap-align: start; }
  .fx-learn .fx-jl .fx-jb { width: auto; height: auto; background: none; color: var(--ink); font-size: 17px; place-items: start; }
  .fx-learn .fx-jl.locked .fx-jb { color: var(--fdk); }
  .fx-learn .fx-jl .fx-jb { color: var(--fdk); }
  .fx-learn .fx-jl .fx-jbar { background: var(--fs); }
  .fx-learn .fx-jl .fx-jt { display: none; }
  .fx-learn .fx-jl .fx-jn { font-size: 11.5px; }
  .fx-learn .fx-jl .fx-jbar { height: 4px; }
  .fx-learn .fx-total { display: none; }
  .fx-feed { margin: 0 -4px; }
}
@media (prefers-reduced-motion: reduce) {
  .fx-feed { scroll-behavior: auto; }
  .fx-go, .fx-rb i, html.fx .btn { transition: none; }
}

.ds-pick.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 560px) { .ds-pick.four { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.ds-prev.fxp { background: #f4f4f7; gap: 6px; }
.ds-prev.fxp i { display: block; width: 14px; height: 30px; border-radius: 5px; }

/* Ünite penceresi: başlık alanı seviyenin rengini taşır (akıştaki kartın devamı) */
html.fx .us-head { background: var(--lv); color: var(--lvi, #fff); border-bottom: 0; }
html.fx .us-top .smallcaps { color: inherit; font: 800 13px/1 var(--display); letter-spacing: 0; text-transform: none; padding: 7px 9px; border-radius: 9px; background: color-mix(in srgb, var(--lvi, #fff) 18%, transparent); }
html.fx .us-x { background: color-mix(in srgb, var(--lvi, #fff) 18%, transparent); color: inherit; }
html.fx .us-de { font: 800 clamp(30px, 4.4vw, 42px)/1 var(--display); letter-spacing: -.035em; color: inherit; margin-top: 14px; }
html.fx .us-tr, html.fx .us-meta, html.fx .us-meta i { color: inherit; opacity: .9; }
html.fx .us-tabs { background: color-mix(in srgb, var(--lvi, #fff) 16%, transparent); }
html.fx .us-tabs .tab { color: inherit; }
html.fx .us-tabs .tab.active { background: var(--lvi, #fff); color: var(--lvd2, var(--lv)); box-shadow: none; }
html.fx .us-ai { background: var(--lvs); border-radius: 18px; }
html.fx .us-ai-t { color: var(--lvd); }
html.fx .us-s { border-radius: 16px; }
html.fx .us-s-de, html.fx .us-w-de { font-family: var(--display); font-weight: 700; letter-spacing: -.02em; }
html.fx .us-pc > i:first-child { background: var(--lvs); color: var(--lvd); border-radius: 12px; }
html.fx .us-skip { color: var(--ink); }
html.fx .guide .tip { border-left: 0; border-radius: 16px; background: var(--b1s); color: var(--ink); font-weight: 500; padding: 14px 16px; }
html.fx .guide .ex { border-radius: 16px; }

/* ---------- İnceleme düzeltmeleri ---------- */
html.fx { accent-color: var(--c1); }
.fx-feed { height: calc(var(--vvh, 100dvh) - 200px); }
@media (min-width: 961px) {
  /* Yolculuk: altı seviye tek kesintisiz renkli ray; dolu kısım ilerleme, şu anki seviye büyük */
  .fx-jour { gap: 0; }
  .fx-jl { border: 0; border-radius: 0; background: none; padding: 10px 0 10px 30px; min-height: calc(var(--n) * 13px); position: relative; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto; align-items: start; align-content: start; row-gap: 2px; }
  .fx-jl::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 12px; background: linear-gradient(to bottom, var(--f) var(--p), var(--fs) var(--p)); }
  .fx-jl:first-child::before { border-radius: 8px 8px 0 0; } .fx-jl:last-child::before { border-radius: 0 0 8px 8px; }
  .fx-jl:hover { border-color: transparent; background: none; }
  .fx-jl:hover .fx-jt { text-decoration: underline; text-underline-offset: 3px; }
  .fx-jl .fx-jb { grid-row: auto; width: auto; height: auto; background: none !important; color: var(--fdk); font-size: 15px; place-items: start; grid-column: 1; }
  .fx-jl .fx-jt { grid-column: 1; font-size: 14px; color: var(--muted); font-weight: 500; margin-top: -4px; }
  .fx-jl .fx-jn { grid-column: 2; grid-row: 1; }
  .fx-jl .fx-jbar { display: none; }
  .fx-jl.now .fx-jb { font-size: 34px; letter-spacing: -.03em; color: var(--f); }
  .fx-jl.now .fx-jt { color: var(--ink); font-size: 16px; font-weight: 600; }
  .fx-jl.on { box-shadow: none; }
  .fx-jl.on .fx-jb { color: var(--f); }
  .fx-side { padding-bottom: 96px; }
}
/* Ders: üst şerit seviyenin renk alanı; etkinlik türü şeridin içinde küçük bir etiket */
html.fx #lesson .ls-top { background: var(--lv); color: var(--lvi, #fff); padding-top: max(12px, env(safe-area-inset-top)); padding-bottom: 12px; }
html.fx #lesson .ls-top .icon-btn { background: color-mix(in srgb, var(--lvi, #fff) 18%, transparent); color: inherit; border: 0; }
html.fx #lesson .ls-top #lsCount { color: inherit; opacity: .9; font-family: var(--mono); font-weight: 500; }
html.fx #lesson .progress { background: color-mix(in srgb, var(--lvi, #fff) 26%, transparent); }
html.fx #lesson .progress > div { background: var(--lvi, #fff); }
html.fx #lesson .ls-body .ls-kind { display: none; }
.fx-kind { font: 600 12px/1 var(--sans); padding: 7px 10px; border-radius: 99px; background: color-mix(in srgb, var(--lvi, #fff) 18%, transparent); white-space: nowrap; }
html.fx #lesson .ls-q { font-size: clamp(24px, 3vw, 32px); letter-spacing: -.03em; }
/* Ünite penceresi: seviye etiketi başlığın üstünden meta satırına */
html.fx .us-top { justify-content: flex-end; }
html.fx .us-top .smallcaps { display: none; }
html.fx .us-meta .fx-lvm { font: 800 12px/1 var(--display); padding: 5px 7px; border-radius: 7px; background: var(--lvi, #fff); color: var(--lvd2, var(--lv)); }
html.fx .guide .hl { padding: 0; margin: 0; }
html.fx .guide .tip i.fa-solid, html.fx .guide th i.fa-solid { color: var(--b1d); margin-right: 6px; }
/* Ayarlar: tasarım seçenekleri kartın içinde ikinci kart olmasın */
html.fx .ds-opt { border: 0; background: var(--surface-2); border-radius: 16px; }
html.fx .ds-opt.on { background: var(--surface); box-shadow: inset 0 0 0 2px var(--ink); }

/* ---------- İnceleme düzeltmeleri (2. tur) ---------- */
html.fx #lesson { background: var(--lvs, var(--ground)); }
html.fx #lesson .ls-foot:not(.ok):not(.bad) { background: var(--lvs, var(--ground)); border-top-color: color-mix(in srgb, var(--lv) 18%, transparent); }
html.fx #lesson .ls-q { font: 800 clamp(28px, 7.6vw, 40px)/1.05 var(--display); letter-spacing: -.035em; }
html.fx #lesson .wx-src { font: 700 clamp(20px, 5.4vw, 26px)/1.25 var(--display); letter-spacing: -.02em; color: var(--lvd); }
html.fx input[type=checkbox], html.fx input[type=radio], html.fx input[type=range] { accent-color: var(--c1); }

.fx-slide.lock::before { display: none; }
html.fx-fp #main { padding-bottom: 0 !important; }

/* =====================================================================
   APPLE TARZI TASARIM (html.am) — kullanıcının isteği: Apple Music ve Apple uygulamaları gibi.
   Büyük kalın başlıklar, kapak rafları, albüm sayfası gibi ünite listesi, cam alt menü ve mini oynatıcı,
   SF yazı tipi, iOS gruplu listeler. Briefmarke'nin düz bileşen katmanının (html.bm) üstüne kurulur.
   ===================================================================== */
html.am {
  --ground: #ffffff; --surface: #f2f2f7; --surface-2: #e9e9ef; --raised: #ffffff;
  --border: #e5e5ea; --rule: #e5e5ea; --control: #d1d1d6;
  --ink: #000000; --muted: #6c6c70; --faint: #8e8e93;
  --accent: #fa2d48; --accent-ink: #ffffff; --accent-soft: #feecef; --accd: #d01b35;
  --track: #e5e5ea; --grey: #8e8e93;
  --positive: #248a3d; --negative: #d70015; --pos-bg: #e8f8ec; --neg-bg: #ffebee;
  --btn-ink: #ffffff;
  --sf: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif;
  --display: var(--sf); --sans: var(--sf); --serif: var(--sf);
  --a1: #ff3b30; --a1d: #c4261c; --a1s: #ffeceb;
  --a2: #ff9500; --a2d: #b86b00; --a2s: #fff4e5;
  --b1: #ffcc00; --b1d: #8f6f00; --b1s: #fff9db;
  --b2: #34c759; --b2d: #1f8a3b; --b2s: #e8f8ec;
  --c1: #007aff; --c1d: #0058c4; --c1s: #e6f1ff;
  --c2: #af52de; --c2d: #8338ad; --c2s: #f6ecfb;
  --st1: #f2f2f7; --st2: #e5e5ea; --st3: #c7c7cc; --st4: #8e8e93; --st5: #fa2d48;
  --am-glass: rgba(249, 249, 251, .72);
  --am-spring: cubic-bezier(.32, .72, 0, 1);
  accent-color: var(--accent);
}
html.am.dark {
  --ground: #000000; --surface: #1c1c1e; --surface-2: #2c2c2e; --raised: #1c1c1e;
  --border: #38383a; --rule: #2c2c2e; --control: #48484a;
  --ink: #ffffff; --muted: #98989f; --faint: #8d8d93;
  --accent: #ff375f; --accent-ink: #ffffff; --accent-soft: #3a1520; --accd: #ff6482;
  --track: #38383a; --positive: #30d158; --negative: #ff453a; --pos-bg: #0f2e18; --neg-bg: #3a1311;
  --a1: #ff453a; --a2: #ff9f0a; --b1: #ffd60a; --b2: #30d158; --c1: #0a84ff; --c2: #bf5af2;
  --a1d: #ff8079; --a1s: #3a1311; --a2d: #ffbf5c; --a2s: #3a2606; --b1d: #ffe066; --b1s: #362c03;
  --b2d: #6ce38a; --b2s: #0f2e18; --c1d: #66b0ff; --c1s: #0a2340; --c2d: #d79bf7; --c2s: #2c1438;
  --st1: #1c1c1e; --st2: #2c2c2e; --st3: #48484a; --st4: #8d8d93; --st5: #ff375f;
  --am-glass: rgba(28, 28, 30, .72);
}

/* ---------- Kapaklar: her ünitenin seviye renginden albüm kapağı ---------- */
.am-cv { position: relative; display: block; aspect-ratio: 1; border-radius: 10px; overflow: hidden; color: #fff; isolation: isolate; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 22px -12px rgba(0,0,0,.35); }

.am-cv-t { position: absolute; left: 10px; right: 10px; bottom: 10px; font: 700 17px/1.08 var(--sf); letter-spacing: -.025em; overflow-wrap: break-word; -webkit-hyphens: auto; hyphens: auto; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.am-cv i.fa-solid { position: absolute; right: 10px; top: 10px; font-size: 16px; opacity: .9; }
.am-cv.xl { border-radius: 14px; box-shadow: 0 2px 4px rgba(0,0,0,.06), 0 24px 50px -24px rgba(0,0,0,.45); }

/* ---------- Ana sayfa: öne çıkan + raflar ---------- */
.am-home { display: grid; gap: 30px; }
.am-hero { position: relative; display: block; width: 100%; min-height: 300px; border-radius: 16px; overflow: hidden; color: #fff; text-align: left; padding: 22px; border: 0; cursor: pointer; isolation: isolate; box-shadow: 0 30px 60px -36px rgba(0,0,0,.55); transition: transform .35s var(--am-spring); }
.am-hero::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(to top, rgba(0,0,0,.4), transparent 62%); }
.am-hero:active { transform: scale(.985); }
.am-hero .am-hw { position: absolute; inset: 18px 18px auto 22px; z-index: -1; font: 800 clamp(40px, 9vw, 76px)/.9 var(--sf); letter-spacing: -.05em; opacity: .16; overflow: hidden; max-height: 55%; }
.am-hero h2 { position: absolute; left: 22px; right: 22px; bottom: 92px; font: 800 clamp(32px, 6vw, 46px)/1 var(--sf); letter-spacing: -.035em; margin: 0; text-wrap: balance; }
.am-hero p { position: absolute; left: 22px; right: 22px; bottom: 66px; margin: 0; font-size: 15px; font-weight: 500; opacity: .9; }

.am-sh { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 12px; }
.am-sh h2 { font: 700 22px/1.15 var(--sf); letter-spacing: -.022em; margin: 0; display: flex; align-items: center; gap: 6px; }
.am-sh h2 i { font-size: 14px; color: var(--faint); }
.am-sh button { border: 0; background: none; color: var(--accent); font: 500 16px var(--sf); cursor: pointer; padding: 4px 0; }
.am-row { display: grid; grid-auto-flow: column; grid-auto-columns: 160px; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 6px; scroll-padding: 0 16px; }
.am-row::-webkit-scrollbar { display: none; }
.am-it { scroll-snap-align: start; display: block; text-align: left; border: 0; background: none; padding: 0; color: var(--ink); cursor: pointer; min-width: 0; }
.am-it:active .am-cv { transform: scale(.97); }

.am-it b { display: block; font: 500 14px/1.25 var(--sf); margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; }

.am-mix { display: block; aspect-ratio: 1; border-radius: 10px; position: relative; overflow: hidden; color: #fff; padding: 12px; box-shadow: 0 8px 22px -12px rgba(0,0,0,.35); }
.am-mix b { position: absolute; left: 12px; right: 12px; bottom: 12px; font: 800 22px/1 var(--sf); letter-spacing: -.035em; }

/* iOS gruplu liste */
.am-list { background: var(--surface); border-radius: 12px; overflow: hidden; }
.am-li { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 16px; border: 0; background: none; color: var(--ink); text-align: left; font: 400 16px var(--sf); position: relative; cursor: pointer; }
.am-li + .am-li::before { content: ""; position: absolute; left: 60px; right: 0; top: 0; height: 1px; background: var(--rule); }

.am-eq i:nth-child(2) { animation-delay: -.4s; } .am-eq i:nth-child(3) { animation-delay: -.75s; }

@media (min-width: 961px) {
  .am-album { grid-template-columns: 300px minmax(0, 1fr); align-items: start; gap: 40px; }

  { id: 'a2u1', t: 'Dativ', ic: 'fa-gift', g: `

  { id: 'a2u2', t: 'Trennbare Verben & Tagesroutine', ic: 'fa-sun', g: `

  { id: 'a2u3', t: 'Modalverben', ic: 'fa-sliders', g: `

  { id: 'a2u4', t: 'Perfekt', ic: 'fa-clock-rotate-left', g: `

  { id: 'b1u2', t: 'Nebensätze: dass, weil, wenn, ob', ic: 'fa-code-branch', g: `

  { id: 'b1u3', t: 'Reflexive Verben & Gesundheit', ic: 'fa-heart-pulse', g: `

  { id: 'b1u4', t: 'Passiv & Bildung', ic: 'fa-graduation-cap', g: `

  { id: 'b1u5', t: 'Genitiv & Schule', ic: 'fa-school', g: `

  { id: 'b1u6', t: 'Relativsätze', ic: 'fa-link', g: `

  { id: 'b2u1', t: 'Konjunktiv II & Umwelt', ic: 'fa-earth-europe', g: `

  { id: 'b2u2', t: 'Partizip I & II als Adjektiv', ic: 'fa-chart-line', g: `

  { id: 'b2u3', t: 'Komplexe Präpositionen & Kunst', ic: 'fa-palette', g: `

  { id: 'b2u4', t: 'Indirekte Rede', ic: 'fa-quote-left', g: `
    <p>Başkasının sözünü tarafsız aktarmak için <b>Konjunktiv I</b> kullanılır.</p>
    <div class="tbl-wrap"><table class="gt"><tr><th>Doğrudan</th><th>Dolaylı</th></tr>
    <tr><td>Er sagt: „Ich bin krank."</td><td>Er sagt, er <b>sei</b> krank.</td></tr>
    <tr><td>Sie sagt: „Ich habe Zeit."</td><td>Sie sagt, sie <b>habe</b> Zeit.</td></tr>
    <tr><td>„Wir haben Hunger."</td><td>Sie sagen, sie <b>hätten</b> Hunger. (KI = Indikativ → KII)</td></tr>
    <tr><td>„Kommst du?"</td><td>Er fragt, <b>ob</b> ich komme.</td></tr>
    <tr><td>„Warte!"</td><td>Er sagt, ich <b>solle</b> warten.</td></tr></table></div>
    <div class="tip">💡 Konjunktiv I formu şimdiki zamanla aynıysa (ör. sie haben) Konjunktiv II'ye geçilir (sie hätten). Zamirleri de değiştirmeyi unutma!</div>`,
    v: [['behaupten', 'iddia etmek'], ['berichten', 'haber vermek'], ['erklären', 'açıklamak'], ['die Nachricht', 'haber'], ['laut', '-e göre'], ['angeblich', 'iddiaya göre'], ['der Bericht', 'rapor'], ['die Aussage', 'ifade']],
    s: [['Er sagt, er sei krank.', 'Hasta olduğunu söylüyor.'], ['Sie behauptet, sie habe nichts gewusst.', 'Hiçbir şey bilmediğini iddia ediyor.'], ['Der Minister erklärte, die Lage sei stabil.', 'Bakan durumun istikrarlı olduğunu açıkladı.']],
    q: [['mc', 'Er sagt: „Ich habe Zeit." → Er sagt, er ___ Zeit.', ['hat', 'habe', 'hätte'], 1, 'Konjunktiv I: er habe.'],
        ['mc', 'Sie sagen: „Wir haben Hunger." → Sie sagen, sie ___ Hunger.', ['haben', 'habe', 'hätten'], 2, 'KI (haben) = Indikativ → KII: hätten.'],
        ['fill', 'Sie sagt, sie ___ morgen. (kommen, KI)', 'komme', 'kommen → sie komme.'],
        ['tf', 'Dolaylı anlatımda soru cümleleri “ob” veya soru kelimesiyle bağlanır.', true, 'Er fragt, wo ich wohne.']] },
  { id: 'b2u5', t: 'Diskutieren & Argumentieren', ic: 'fa-comments', g: `

    q: [['mc', '“der Nachteil” ne demek?', ['avantaj', 'dezavantaj', 'sonuç'], 1, 'Vorteil = avantaj, Nachteil = dezavantaj.'],

let fb = null, fbTimer = null;
function loadScript(src) { return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
async function fbInit() {
  if (fb) return fb; if (!CFG.fbConfig) return null;
  try {
    const conf = typeof CFG.fbConfig === 'string' ? JSON.parse(CFG.fbConfig) : CFG.fbConfig;
    if (!window.firebase) { await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js'); await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js'); }

}
// Silinen profiller "deleted" altında tutulur; başka cihazda kalmış kopyası buluta geri yazılmaz
let DELETED = LS.get('df_deleted', {}), fbProfilesOk = false;
async function fbPullProfiles() {
  const db = await fbInit(); if (!db) return;
  try {
    const [snap, del] = await Promise.all([db.ref('deutschflow/profiles').get(), db.ref('deutschflow/deleted').get()]);
    const remote = snap.val() || {}; Object.assign(DELETED, del.val() || {}); LS.set('df_deleted', DELETED);
    Object.values(remote).forEach(p => { if (!p || !p.id || DELETED[p.id]) return; const i = PROFILES.findIndex(x => x.id === p.id); if (i < 0) PROFILES.push(p); else if ((p.updatedAt || 0) > (PROFILES[i].updatedAt || 0)) PROFILES[i] = p; });
    PROFILES.filter(p => DELETED[p.id]).forEach(p => localStorage.removeItem('df_data_' + p.id));
    PROFILES = PROFILES.filter(p => !DELETED[p.id]); LS.set('df_profiles', PROFILES); fbProfilesOk = true;
    // Bu cihazda olup bulutta olmayan profiller (çevrimdışı oluşturulmuş) buluta eklenir
    if (PROFILES.some(p => !remote[p.id])) fbPushProfiles();
  } catch (e) { console.warn('fb profiles', e); }
}
async function fbPushProfiles() {
  const db = await fbInit(); if (!db) return; const o = {};
  PROFILES.forEach(p => { if (!DELETED[p.id]) o[p.id] = p; });
  if (Object.keys(o).length) db.ref('deutschflow/profiles').update(o).catch(e => console.warn(e));   // update: diğer cihazların profillerini silmez
}
async function fbPull(id) {
  const db = await fbInit(); if (!db) return null;
  try { const snap = await db.ref('deutschflow/data/' + id).get(); return snap.val(); } catch (e) { console.warn(e); return null; }
}
function fbPushLater() { if (!CFG.fbConfig || RO) return; clearTimeout(fbTimer); fbTimer = setTimeout(async () => { const db = await fbInit(); if (db && D) db.ref('deutschflow/data/' + PID).set(JSON.parse(JSON.stringify(D))).catch(e => toast('Senkronizasyon hatası: ' + e.message, 'err')); }, 1500); }

function normalizeAiItem(x) {

  if (x.k === 'fill' && x.a) return { k: 'fill', q: x.q, a: [].concat(x.a).map(String), e: x.e || '', id: 'ai:' + hashStr(x.q) };

    if (q[0] === 'fill') return { k: 'fill', q: q[1], a: [].concat(q[2]), e: q[3], id, unit: u.id };

}
function buildUnitItems(u, L) {
  const lvVocab = L.units.flatMap(x => x.v), items = qItems(u);
  pick(u.v, 2).forEach(v => { const wrong = pick(lvVocab.filter(w => w[1] !== v[1]), 2).map(w => w[1]); const o = shuffle([v[1]].concat(wrong)); items.push({ k: 'mc', q: `“${v[0]}” ne demek?`, say: v[0], o, a: o.indexOf(v[1]), e: `${v[0]} = ${v[1]}`, id: u.id + ':v:' + v[0], unit: u.id, card: v }); });
  items.push({ k: 'match', pairs: pick(u.v, 4), id: u.id + ':match', unit: u.id });

  const ds = u.s[Math.floor(Math.random() * u.s.length)]; items.push({ k: 'dict', a: ds[0], tr: ds[1], id: u.id + ':d:' + hashStr(ds[0]), unit: u.id });

}

function readAll(id) { const s = STORIES.find(x => x.id === id); let i = 0; const next = () => { document.querySelectorAll('.story-s').forEach(p => p.style.background = ''); if (i >= s.s.length || !$('#storyBody')) return; const p = document.getElementById('ss' + i); if (p) { p.style.background = 'rgba(28,176,246,.12)'; p.style.borderRadius = '10px'; } speak(s.s[i][0], { onend: () => { i++; next(); } }); }; next(); }
function lookupWord(storyId, raw) {

function wordPop(ev, storyId, raw) {

};
AFTER.dictation = () => { if (DX) renderDict(); };
function newDict(lv) {

}
function speakWords() { const ws = DX.s[0].split(' '); let i = 0; const n = () => { if (i < ws.length) speak(ws[i++], { rate: .7, onend: () => setTimeout(n, 250) }); }; n(); }
function checkDict() {
  if (!canEdit()) return; const t = $('#dictIn').value; if (!t.trim()) { toast('Önce yaz', 'warn'); return; }
  const sim = similarity(t, DX.s[0]), ok = sim >= .95;
  $('#dictRes').innerHTML = `<div class="glass card" style="padding:16px"><div class="fb-title" style="color:${ok ? 'var(--a1)' : sim > .75 ? 'var(--b2)' : 'var(--red)'}">${ok ? '🎉 Mükemmel!' : sim > .75 ? '👍 Çok yakın!' : '🎧 Tekrar dinle'} · %${Math.round(sim * 100)}</div>
    <div style="margin-top:10px;font-size:18px;font-weight:700">${charDiff(t, DX.s[0])}</div>
    <div style="margin-top:10px;font-weight:800">Doğrusu: ${esc(DX.s[0])}</div><div class="muted" style="font-weight:700">${esc(DX.s[1])}</div>

  if (!DX.done) { DX.done = true; D.stats.dict++; questProgress('dict', 1); if (sim >= .8) addXP(ok ? 8 : 4); checkBadges(); save(); }
}

let RP = null;
VIEWS.roleplay = () => RP ? rpChatView() : `<p class="page-sub">Gerçek hayattan senaryolar. Yapay zeka karşı rolü oynar, hatalarını nazikçe düzeltir.</p>

function rpSys() { const s = RP.sc; return `Du spielst die Rolle: ${s.role}. Das ist ein Rollenspiel zum Deutschlernen. Niveau des Lernenden: ${s.lv}. Ziel des Lernenden: ${s.goal}
Regeln: Antworte immer zuerst kurz (1–3 Sätze) auf Deutsch, passend zum Niveau ${s.lv}, und bleib in der Rolle. Danach in einer neuen Zeile: "🇹🇷 " + kurze türkische Übersetzung deiner Antwort. Wenn der Lernende einen Fehler gemacht hat, füge eine weitere Zeile hinzu: "✏️ Düzeltme: " + korrigierter Satz + kurze türkische Erklärung. Stelle Fragen, damit das Gespräch weitergeht.`; }
function rpChatView() {

}
const rpMsgHtml = m => m.role === 'user' ? `<div class="msg me">${esc(m.text)}</div>` : `<div class="msg ai">${md(m.text)} <button class="speak" data-say="${esc(m.text.split('\n')[0])}" onclick="say(this.dataset.say)"><i class="fa-solid fa-volume-high"></i></button></div>`;

async function rpSend(textArg) {

const PERS = ['ich', 'du', 'er/sie/es', 'wir', 'ihr', 'sie/Sie'];
function conj(v) {
  const inf = v.i, stem = inf.endsWith('en') ? inf.slice(0, -2) : inf.slice(0, -1), needE = /[td]$/.test(stem) || /[^aeiouäöülrh][mn]$/.test(stem), sz = /[sßxz]$/.test(stem);
  const p = v.p || [stem + 'e', stem + (needE ? 'est' : sz ? 't' : 'st'), stem + (needE ? 'et' : 't'), inf, stem + (needE ? 'et' : 't'), inf];
  const base = stem + (needE ? 'ete' : 'te'), pr = v.pr || [base, base + 'st', base, base + 'n', base + 't', base + 'n'];
  const p2 = v.p2 || (/ieren$/.test(inf) ? stem + 't' : /^(be|ver|er|ent|emp|ge|zer|miss)/.test(inf) ? stem + (needE ? 'et' : 't') : 'ge' + stem + (needE ? 'et' : 't'));
  const aux = v.a === 'sein' ? ['bin', 'bist', 'ist', 'sind', 'seid', 'sind'] : ['habe', 'hast', 'hat', 'haben', 'habt', 'haben'];
  const K2 = { sein: 'wär', haben: 'hätt', werden: 'würd', können: 'könnt', müssen: 'müsst', wollen: 'wollt', dürfen: 'dürft', sollen: 'sollt', mögen: 'möcht', wissen: 'wüsst' };
  const k2 = K2[inf] ? ['e', 'est', 'e', 'en', 'et', 'en'].map(e => K2[inf] + e) : ['würde', 'würdest', 'würde', 'würden', 'würdet', 'würden'].map(w => w + ' ' + inf);
  const fut = ['werde', 'wirst', 'wird', 'werden', 'werdet', 'werden'].map(w => w + ' ' + inf);
  return { p, pr, perf: aux.map(a => a + ' ' + p2), fut, k2, p2, guess: !v.p && !v.pr && !v.p2 };
}

/* ---------- Odak araçları: Pomodoro + soru başına süre ---------- */
const POMO = { mode: 'work', left: 25 * 60, running: false, t: null, len: { work: 25 * 60, break: 5 * 60 } };
const SW = { running: false, start: 0, acc: 0, last: 0, laps: [], c: { ok: 0, bad: 0, empty: 0 }, t: null };
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0');
VIEWS.focus = () => {
  const C = 2 * Math.PI * 96, prog = 1 - POMO.left / POMO.len[POMO.mode];
  return `<div class="grid-2"><div class="glass card" style="text-align:center;${lvStyle(POMO.mode === 'work' ? 'b2' : 'a1')}"><div class="section-title" style="justify-content:center"><i class="fa-solid fa-hourglass-half" style="color:var(--lv)"></i> Pomodoro</div>
    <div class="tabs" style="max-width:320px;margin:0 auto 16px"><button class="tab ${POMO.mode === 'work' ? 'active' : ''}" onclick="pomoMode('work')">25 dk Çalışma</button><button class="tab ${POMO.mode === 'break' ? 'active' : ''}" onclick="pomoMode('break')">5 dk Mola</button></div>
    <div class="pring"><svg width="220" height="220"><circle cx="110" cy="110" r="96" stroke="var(--soft)" stroke-width="16" fill="none"/><circle id="pomoArc" cx="110" cy="110" r="96" stroke="var(--lv)" stroke-width="16" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - prog)}" style="transition:stroke-dashoffset 1s linear"/></svg><div class="rt"><b id="pomoT">${fmt(POMO.left)}</b><span class="muted" style="font-weight:800">${POMO.mode === 'work' ? 'odaklan 🎯' : 'dinlen ☕'}</span></div></div>
    <div class="row" style="justify-content:center;margin-top:16px"><button class="btn" onclick="pomoToggle()" id="pomoBtn"><i class="fa-solid ${POMO.running ? 'fa-pause' : 'fa-play'}"></i> ${POMO.running ? 'Duraklat' : 'Başlat'}</button><button class="btn btn-ghost" onclick="pomoReset()"><i class="fa-solid fa-rotate-left"></i></button><button class="btn btn-ghost" onclick="pomoDone(true)"><i class="fa-solid fa-forward"></i></button></div>
    <p class="muted" style="font-weight:700;margin-bottom:0">Bugün: ${dayRec().min} dk · Toplam pomodoro: ${D.stats.pomo}</p></div>
  <div class="glass card"><div class="section-title"><i class="fa-solid fa-stopwatch" style="color:var(--a2)"></i> Soru Başına Süre Antrenmanı</div>
    <div class="font-display" id="swT" style="font-size:52px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums">${fmt(swElapsed())}</div>
    <div class="grid-3" style="margin:12px 0">${[['ok', 'Doğru', 'a1'], ['bad', 'Yanlış', 'red'], ['empty', 'Boş', 'a2']].map(([k, t, c]) => `<button class="btn" style="${c === 'red' ? '--lv:var(--red);--lvd:var(--redd)' : lvStyle(c)}" onclick="swMark('${k}')">${t} <b>${SW.c[k]}</b></button>`).join('')}</div>
    <div class="row"><button class="btn btn-ghost btn-sm" onclick="swToggle()"><i class="fa-solid ${SW.running ? 'fa-pause' : 'fa-play'}"></i> ${SW.running ? 'Durdur' : 'Başlat'}</button><button class="btn btn-ghost btn-sm" onclick="swReset()"><i class="fa-solid fa-rotate-left"></i> Sıfırla</button>${SW.laps.length ? `<span class="chip" style="margin-left:auto">Ortalama: ${fmt(SW.laps.reduce((a, l) => a + l.s, 0) / SW.laps.length)}</span>` : ''}</div>
    <div style="max-height:260px;overflow-y:auto;margin-top:12px">${SW.laps.map((l, i) => `<div class="between" style="padding:7px 0;border-bottom:1px solid var(--stroke);font-weight:800"><span>${SW.laps.length - i}. soru</span><span style="color:${l.k === 'ok' ? 'var(--a1)' : l.k === 'bad' ? 'var(--red)' : 'var(--a2)'}">${{ ok: 'Doğru', bad: 'Yanlış', empty: 'Boş' }[l.k]}</span><span class="muted">${fmt(l.s)}</span></div>`).join('') || '<div class="empty" style="padding:16px">Başlat, her soruyu çözünce sonucunu işaretle.</div>'}</div></div></div>`;
};
function pomoMode(m) { POMO.mode = m; POMO.left = POMO.len[m]; if (PAGE === 'focus') go('focus'); }
function pomoToggle() {
  POMO.running = !POMO.running; clearInterval(POMO.t);
  if (POMO.running) POMO.t = setInterval(() => { POMO.left--; if (POMO.left <= 0) pomoDone(); pomoPaint(); }, 1000);
  if (PAGE === 'focus') go('focus');
}
function pomoPaint() { const t = $('#pomoT'), a = $('#pomoArc'); if (t) t.textContent = fmt(POMO.left); if (a) { const C = 2 * Math.PI * 96; a.setAttribute('stroke-dashoffset', C * (POMO.left / POMO.len[POMO.mode])); } document.title = POMO.running ? fmt(POMO.left) + ' · DeutschFlow' : 'DeutschFlow AI'; }
function pomoReset() { clearInterval(POMO.t); POMO.running = false; POMO.left = POMO.len[POMO.mode]; document.title = 'DeutschFlow AI'; if (PAGE === 'focus') go('focus'); }
function pomoDone(skip) {
  clearInterval(POMO.t); POMO.running = false; beep(880, .3); setTimeout(() => beep(660, .3), 350);
  if (POMO.mode === 'work' && !skip && D && !RO) { D.stats.pomo++; D.stats.focusMin += 25; dayRec().min += 25; addXP(10); checkBadges(); save(); toast('🍅 Pomodoro bitti! 5 dakika mola.'); confettiBurst(); }
  else if (POMO.mode === 'break' && !skip) toast('☕ Mola bitti, hadi devam!');
  pomoMode(POMO.mode === 'work' ? 'break' : 'work');
}
const swElapsed = () => (SW.acc + (SW.running ? Date.now() - SW.start : 0)) / 1000;
function swToggle() { if (SW.running) { SW.acc += Date.now() - SW.start; SW.running = false; clearInterval(SW.t); } else { SW.start = Date.now(); SW.running = true; SW.t = setInterval(() => { const e = $('#swT'); if (e) e.textContent = fmt(swElapsed()); }, 250); } if (PAGE === 'focus') go('focus'); }
function swMark(k) { if (!SW.running) swToggle(); const now = swElapsed(); SW.laps.unshift({ k, s: now - SW.last }); SW.last = now; SW.c[k]++; beep(k === 'ok' ? 880 : k === 'bad' ? 260 : 520, .08); if (PAGE === 'focus') go('focus'); }
function swReset() { clearInterval(SW.t); Object.assign(SW, { running: false, start: 0, acc: 0, last: 0, laps: [], c: { ok: 0, bad: 0, empty: 0 } }); if (PAGE === 'focus') go('focus'); }

VIEWS.report = () => {

  const acc = wk.answers ? Math.round(wk.correct / wk.answers * 100) : null;
  const weak = Object.entries(D.wrong.reduce((m, w) => { const u = w.item.unit; if (u) m[u] = (m[u] || 0) + 1; return m; }, {})).sort((a, b) => b[1] - a[1]).slice(0, 4);

    ${weak.length ? weak.map(([u, n]) => { const f = findUnit(u); return f ? `<button class="between nav-item" onclick="openUnit('${u}')"><span><span class="lvl-badge" style="${lvStyle(f.L.color)}">${f.L.id}</span> ${esc(f.u.t)}</span><span class="chip">${n} yanlış</span></button>` : ''; }).join('') : '<div class="empty" style="padding:16px">Henüz zayıf konu yok 🎯</div>'}
    <div class="muted" style="font-weight:700;margin-top:10px">Toplam: ${D.stats.answers} cevap · %${D.stats.answers ? Math.round(D.stats.correct / D.stats.answers * 100) : 0} doğruluk · ${lessonsDone(D)} ünite · ${D.cards.length} kart</div></div></div>

async function aiReport() {

  try { const t = await aiText(`Öğrencinin son haftalık verileri (JSON): ${JSON.stringify(summary)}\nTürkçe, samimi ve motive edici bir “Haftalık Gelişim Raporu” yaz: 1) Genel değerlendirme 2) Güçlü yönler 3) Gelişim alanları (konu adlarıyla) 4) Gelecek hafta için günlük mini plan (7 madde) 5) Almanca motivasyon cümlesi + Türkçesi.`, tutorSys());

}

function buildDaily() {
  const items = [], now = Date.now(), li = currentLevelIdx(), L = LEVELS[li];
  const pool = D.cards.length >= 4 ? D.cards : allVocab().filter(v => LEVELS.findIndex(x => x.id === v.lv) <= li).map(v => ({ de: v.de, tr: v.tr }));
  const due = D.cards.filter(c => c.due <= now), cards = (due.length ? shuffle(due) : shuffle(pool)).slice(0, 4);
  cards.forEach(c => { const o = shuffle([c.tr].concat(pick(pool.filter(x => x.tr !== c.tr), 2).map(x => x.tr))); items.push({ k: 'mc', q: `“${c.de}” ne demek?`, say: c.de, o, a: o.indexOf(c.tr), e: `${c.de} = ${c.tr}`, id: 'daily:c:' + c.de, card: [c.de, c.tr], cardId: c.id, cat: 'kelime' }); });
  D.wrong.filter(w => w.item.k !== 'match').slice(0, 3).forEach(w => items.push(w.item));
  const nu = nextUnit(), u = nu && !nu.boss ? nu.u : pick(L.units, 1)[0];
  pick(qItems(u), 2).forEach(x => items.push(x));
  const s = pick(L.units.flatMap(x => x.s.map(y => ({ s: y, u: x }))), 2);
  if (s[0]) items.push({ k: 'build', q: s[0].s[1], a: s[0].s[0], id: s[0].u.id + ':b:' + hashStr(s[0].s[0]), unit: s[0].u.id });

  const seen = new Set(); return shuffle(items.filter(x => !seen.has(x.id) && seen.add(x.id)));
}

function goalInfo() {
  const g = D.goal, ti = LEVELS.findIndex(L => L.id === g.lv), all = LEVELS.slice(0, ti + 1).flatMap((L, li) => L.units.map(u => ({ L, li, u })));
  const left = all.filter(x => D.done[x.u.id] == null), days = dayDiff(today(), g.date);
  const studyDays = Math.max(1, days > 21 ? days - 7 : days), perDay = left.length / studyDays;
  // Kalan üniteler çalışma günlerine eşit aralıklarla dağıtılır; ilk ünite bugüne düşer
  const sched = [], horizon = Math.min(Math.max(days, 1), 60);
  for (let d = 0; d < horizon; d++) sched.push({ date: new Date(Date.now() + d * DAY), units: [] });
  left.forEach((x, j) => { const d = Math.floor(j * studyDays / left.length); if (d < horizon) sched[d].units.push(x); });
  while (sched.length > 1 && !sched[sched.length - 1].units.length && sched.length > Math.min(days, 14)) sched.pop();
  const recent = Object.entries(D.days).filter(([k2]) => dayDiff(k2, today()) < 14).reduce((s, [, v]) => s + (v.lessons || 0), 0) / 14;
  return { all, left, days, perDay, sched, today: (sched[0] && sched[0].units) || [], pct: all.length ? Math.round((all.length - left.length) / all.length * 100) : 100, recent, onTrack: recent >= perDay * .8 || !left.length };
}

const PATH_DECO = { A1: ['🌱', '🏡', '🥨'], A2: ['🌳', '🚲', '☕'], B1: ['🏢', '🎓', '🚆'], B2: ['🌍', '🎨', '📈'], C1: ['📜', '🏛️', '✒️'], C2: ['👑', '🎭', '📚'] };
function drawPaths() {
  document.querySelectorAll('.path').forEach((path, li) => {
    path.querySelectorAll('.path-svg,.path-deco').forEach(e => e.remove());
    const nodes = [...path.querySelectorAll('.node')]; if (nodes.length < 2) return;
    const pr = path.getBoundingClientRect(), pts = nodes.map(n => { const r = n.getBoundingClientRect(); return { x: r.left + r.width / 2 - pr.left, y: r.top + r.height / 2 - pr.top, done: n.classList.contains('done') }; });
    let segs = '';
    for (let i = 0; i < pts.length - 1; i++) { const a = pts[i], b = pts[i + 1], my = (a.y + b.y) / 2, d = `M${a.x} ${a.y} C${a.x} ${my} ${b.x} ${my} ${b.x} ${b.y}`;
      segs += `<path d="${d}" stroke="var(--stroke)" stroke-width="16" fill="none" stroke-linecap="round"/><path d="${d}" stroke="${a.done && b.done ? 'var(--lv)' : 'var(--muted)'}" stroke-width="${a.done && b.done ? 8 : 4}" stroke-dasharray="${a.done && b.done ? '0' : '2 12'}" fill="none" stroke-linecap="round" opacity="${a.done && b.done ? .9 : .5}"/>`; }
    path.insertAdjacentHTML('afterbegin', `<svg class="path-svg" width="${pr.width}" height="${pr.height}" aria-hidden="true">${segs}</svg>`);
    const deco = PATH_DECO[LEVELS[li] && LEVELS[li].id] || [];
    pts.forEach((p, i) => { if (i % 2 === 1 && deco.length) { const side = p.x > pr.width / 2 ? -1 : 1; path.insertAdjacentHTML('beforeend', `<div class="path-deco" style="left:${p.x + side * 130 - 22}px;top:${p.y - 24}px">${deco[Math.floor(i / 2) % deco.length]}</div>`); } });
  });
}

const FSRS_W = [0.4872, 1.4003, 3.7145, 13.8206, 5.1618, 1.2298, 0.8975, 0.031, 1.6474, 0.1367, 1.0461, 2.1072, 0.0793, 0.3246, 1.587, 0.2272, 2.8755];

function fsrsNext(c, g, now) {
  const w = FSRS_W; now = now || Date.now();

  if (!s) { if (c.box > 1 && !c.reps) { s = LEITNER_DAYS[c.box - 1] || 1; d = 5; } else { return { s: w[g - 1], d: fsrsD0(g) }; } }
  const t = Math.max(0, (now - (c.last || c.added || now)) / DAY), R = fsrsR(t, s);
  let d2 = d - w[6] * (g - 3); d2 = w[7] * fsrsD0(4) + (1 - w[7]) * d2; d2 = Math.min(10, Math.max(1, d2));

  if (g === 1) s2 = w[11] * Math.pow(d, -w[12]) * (Math.pow(s + 1, w[13]) - 1) * Math.exp(w[14] * (1 - R));
  else s2 = s * (1 + Math.exp(w[8]) * (11 - d) * Math.pow(s, -w[9]) * (Math.exp(w[10] * (1 - R)) - 1) * (g === 2 ? w[15] : 1) * (g === 4 ? w[16] : 1));

}

  const now = Date.now(), r = fsrsNext(c, g, now);

  c.due = now + fsrsIvlMs(g, r.s); c.box = r.s < 1 ? 1 : r.s < 3 ? 2 : r.s < 7 ? 3 : r.s < 21 ? 4 : 5;
}

  out.done = out.done || {}; Object.entries(other.done || {}).forEach(([k, v]) => { if (out.done[k] == null || v > out.done[k]) out.done[k] = v; });
  out.boss = Object.assign({}, other.boss || {}, out.boss || {});

  if (out.stats && other.stats) Object.keys(other.stats).forEach(k => { if (typeof other.stats[k] === 'number' && other.stats[k] > (out.stats[k] || 0)) out.stats[k] = other.stats[k]; });

/* ---------- Yazma ve pratik etkinlikleri: her ünitenin kelime ve cümlelerinden üretilir ---------- */
Object.assign(KIND_NAMES, { ww: 'Kelimeyi yaz', wr: 'Çeviriyi yaz', scr: 'Harfleri diz', free: 'Serbest yazma' });
const WX_KINDS = ['ww', 'wr', 'scr', 'free'];
const deFold = s => norm(s).replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss');
const ART_RE = /^(der|die|das)\s+/i, PUNCT_RE = /[.,!?;:„“”"]/g;
const wordForms = de => String(de).split('/').map(x => x.replace(/\(.*?\)/g, '').trim()).filter(Boolean);
const coreWord = de => wordForms(de)[0].replace(ART_RE, '').replace(/^sich\s+/i, '');
const okVocab = u => u.v.filter(v => !/…/.test(v[0]));
// İsimleri küçük harfle yazdıysa (doğru olsa bile) hatırlatır
function capNote(typed, target) {
  const tw = String(typed).split(/\s+/).map(w => w.replace(PUNCT_RE, '')), miss = [];
  String(target).split(/\s+/).forEach((w, i) => { w = w.replace(PUNCT_RE, ''); if (i > 0 && /^[A-ZÄÖÜ]/.test(w) && tw.includes(w.toLowerCase()) && !tw.includes(w)) miss.push(w); });
  return miss.length ? 'Almancada isimler büyük harfle başlar: ' + miss.join(', ') : '';
}
function gradeWord(typed, de) {
  const forms = wordForms(de);
  if (forms.some(f => norm(f) === norm(typed))) return { ok: true };
  if (forms.some(f => deFold(f) === deFold(typed))) return { ok: true, note: 'Doğru! Umlaut yerine ae/oe/ue yazdın; asıl yazılışı: ' + forms[0] };
  const f0 = forms.find(f => ART_RE.test(f));
  if (f0 && norm(f0.replace(ART_RE, '')) === norm(String(typed).replace(ART_RE, ''))) return { ok: false, note: ART_RE.test(typed) ? `Kelime doğru, artikel yanlış: “${f0.match(ART_RE)[1]}” olmalı.` : 'Kelime doğru ama artikeli unuttun: ' + f0 };
  if (forms.some(f => similarity(f, typed) >= .8)) return { ok: false, note: 'Çok yaklaştın, küçük bir yazım hatası var.' };
  return { ok: false };
}
function gradeSentence(typed, de) {
  if (norm(typed) === norm(de)) return { ok: true };
  if (deFold(typed) === deFold(de)) return { ok: true, note: 'Doğru! Umlaut yerine ae/oe/ue yazdın; ä, ö, ü tuşlarını kullanmayı dene.' };
  const sim = similarity(typed, de);
  if (sim >= .95) return { ok: true, diff: true, note: 'Küçük bir yazım hatası var, aşağıda işaretli.' };
  return { ok: false, diff: true, note: sim >= .75 ? 'Yaklaştın! Farkları aşağıda görebilirsin.' : '' };
}
// Serbest yazmada hedef kelime kullanıldı mı? Çekimli hâlleri de sayılır (trinken → trinke, trinkt)
function freeHas(text, de) {
  const w = deFold(de).split(' ').filter(x => !/^(der|die|das|sich|ein|eine|den|dem|zum|zur|in|auf|um|nur)$/.test(x)).sort((a, b) => b.length - a.length)[0] || deFold(de);
  const stem = w.length > 5 ? w.replace(/(en|n|e)$/, '') : w;
  return deFold(text).split(' ').some(t => t.startsWith(stem));
}

function makeWW(u, v) { return v && { k: 'ww', q: v[1], a: v[0], art: ART_RE.test(wordForms(v[0])[0]), id: u.id + ':ww:' + v[0], unit: u.id, card: v }; }
function makeWR(u, s) { return s && { k: 'wr', q: s[1], a: s[0], id: u.id + ':wr:' + hashStr(s[0]), unit: u.id }; }
function makeScr(u, v) {
  if (!v) return null; const w = coreWord(v[0]); if (!/^[A-Za-zÄÖÜäöüß]{4,10}$/.test(w)) return null;
  return { k: 'scr', q: v[1], a: w, art: (wordForms(v[0])[0].match(ART_RE) || [])[1] || '', id: u.id + ':scr:' + w, unit: u.id, card: v };
}
function makeGap(u, s) {
  if (!s) return null; const toks = s[0].split(' ');
  const cand = toks.map((w, i) => ({ i, c: w.replace(/[.,!?;:„“"]+$/, '') })).filter(x => x.i > 0 && /^[A-Za-zÄÖÜäöüß]{4,}$/.test(x.c)).sort((a, b) => b.c.length - a.c.length).slice(0, 3);
  if (!cand.length) return null; const x = pick(cand, 1)[0], q = toks.slice(); q[x.i] = '___' + toks[x.i].slice(x.c.length);
  return { k: 'fill', q: q.join(' ') + ` (${x.c[0]}… · “${s[1]}”)`, a: [x.c], e: 'Tam cümle: ' + s[0], id: u.id + ':gap:' + hashStr(s[0] + x.i), unit: u.id, lbl: 'Eksik kelimeyi yaz', sk: 'schreiben' };
}
function makeListen(u, L, v) {
  if (!v) return null; const o = shuffle([v[1]].concat(pick(L.units.flatMap(x => x.v).filter(w => w[1] !== v[1]), 2).map(w => w[1])));
  return { k: 'mc', q: 'Duyduğun kelime ne demek?', say: v[0], listen: true, lbl: 'Dinle ve seç', o, a: o.indexOf(v[1]), e: `${v[0]} = ${v[1]}`, id: u.id + ':lmc:' + v[0], unit: u.id, card: v, sk: 'horen' };
}
function makeMeaning(u, L, v) {
  if (!v) return null; const o = shuffle([v[1]].concat(pick(L.units.flatMap(x => x.v).filter(w => w[1] !== v[1]), 2).map(w => w[1])));
  return { k: 'mc', q: `“${v[0]}” ne demek?`, say: v[0], o, a: o.indexOf(v[1]), e: `${v[0]} = ${v[1]}`, id: u.id + ':v:' + v[0], unit: u.id, card: v };
}
function makeTrans(u, L, s) {
  if (!s) return null; const pool = L.units.flatMap(x => x.s).filter(x => x[1] !== s[1]); if (pool.length < 2) return null;
  const o = shuffle([s[1]].concat(pick(pool, 2).map(x => x[1])));
  return { k: 'mc', q: s[0], say: s[0], lbl: 'Doğru çeviriyi seç', o, a: o.indexOf(s[1]), e: '', id: u.id + ':tmc:' + hashStr(s[0]), unit: u.id };
}
function makeFree(u) { const ws = pick(okVocab(u), 3); return { k: 'free', q: 'Serbest yazma: ' + ws.map(w => w[0]).join(', '), words: ws, a: ws.map(w => w[0]).join(', '), id: u.id + ':free', unit: u.id }; }
const mkBuild = (u, s) => ({ k: 'build', q: s[1], a: s[0], id: u.id + ':b:' + hashStr(s[0]), unit: u.id });
const mkDict = (u, s) => ({ k: 'dict', a: s[0], tr: s[1], id: u.id + ':d:' + hashStr(s[0]), unit: u.id });

// Ana derse 4 yeni etkinlik: kelime yazma, eksik kelime, çeviri yazma ve bir dinleme/çeviri/harf etkinliği
const _buildUnitItemsW = buildUnitItems;
buildUnitItems = function (u, L) {
  const items = _buildUnitItemsW(u, L), used = items.filter(x => x.k === 'build' || x.k === 'dict').map(x => x.a);
  const free = shuffle(u.s.filter(s => !used.includes(s[0]))), vs = okVocab(u);
  const extra = [makeWW(u, pick(vs, 1)[0]), makeGap(u, free[0]), makeWR(u, free[1]), pick([makeListen(u, L, pick(vs, 1)[0]), free[2] && makeTrans(u, L, free[2]), makeScr(u, pick(vs, 1)[0])].filter(Boolean), 1)[0]].filter(Boolean);
  extra.forEach(x => items.splice(Math.floor(Math.random() * (items.length + 1)), 0, x));
  return items;
};

const PRACTICE = [
  { k: 'yaz', ic: 'fa-pen-nib', t: 'Yazma pratiği', d: 'Kelime ve cümleleri kendin yaz, sonunda kısa bir metin oluştur' },
  { k: 'kelime', ic: 'fa-spell-check', t: 'Kelime pratiği', d: 'Dinle, eşleştir, harfleri diz, kelimeyi yaz' },
  { k: 'cumle', ic: 'fa-quote-left', t: 'Cümle pratiği', d: 'Doğru çeviriyi seç, cümle kur, hatayı bul, eksik kelimeyi yaz' },
  { k: 'karisik', ic: 'fa-shuffle', t: 'Karışık tekrar', d: 'Konunun bütün etkinlik türlerinden rastgele bir set' }
];
function practiceItems(u, L, mode) {
  const vs = okVocab(u), V = n => pick(vs, n), S = n => pick(u.s, n), scr = n => V(6).map(v => makeScr(u, v)).filter(Boolean).slice(0, n);
  let out;
  if (mode === 'yaz') out = [...V(3).map(v => makeWW(u, v)), ...scr(2), ...S(2).map(s => makeGap(u, s)), ...S(3).map(s => makeWR(u, s)), mkDict(u, S(1)[0])];
  else if (mode === 'kelime') out = [...V(2).map(v => makeListen(u, L, v)), ...V(2).map(v => makeMeaning(u, L, v)), { k: 'match', pairs: pick(u.v, 4), id: u.id + ':match', unit: u.id }, ...scr(2), ...V(3).map(v => makeWW(u, v))];
  else if (mode === 'cumle') out = [...S(2).map(s => makeTrans(u, L, s)), ...S(2).map(s => mkBuild(u, s)), makeSpot(u), ...S(2).map(s => makeGap(u, s)), ...S(2).map(s => makeWR(u, s)), mkDict(u, S(1)[0])];
  else out = [...pick(qItems(u), 4), makeWW(u, V(1)[0]), makeWR(u, S(1)[0]), makeGap(u, S(1)[0]), makeListen(u, L, V(1)[0]), makeTrans(u, L, S(1)[0]), ...scr(1), mkBuild(u, S(1)[0]), makeSpot(u)];
  out = shuffle(out.filter(Boolean)); if (mode === 'yaz') out.push(makeFree(u));

}
function startPractice(id, mode) {

  startLesson(practiceItems(f.u, f.L, mode), { title: m.t + ' · ' + f.u.t, color: f.L.color, kind: 'practice', unitId: id, mode, pass: 0 });
}
const _lessonSummaryW = lessonSummary;

};

const _renderItemW = renderItem;
renderItem = function () {

    if (it.lbl) { const k = $('#lsBody .ls-kind'); if (k) k.textContent = it.lbl; }
    if (it.listen) setTimeout(() => { if (LSN && LSN.items[LSN.i] === it) speak(it.say); }, 400);
    return;
  }
  LSN.sel = null; LSN.built = []; LSN.checked = false; LSN.hint = 0;
  $('#lsBar').style.width = (LSN.i / LSN.items.length * 100) + '%'; $('#lsCount').textContent = (LSN.i + 1) + '/' + LSN.items.length;
  const enter = `onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();if(LSN.sel)checkItem()}"`;
  let h = `<div class="ls-kind">${KIND_NAMES[it.k]}</div>`;
  if (it.k === 'ww') h += `<h2 class="ls-q">Almancasını yaz: <span class="hl">${esc(it.q)}</span></h2>${it.art ? '<div class="muted wx-sub">İsim olduğu için artikeliyle yaz (der / die / das)</div>' : ''}
    <input id="fillIn" class="pill-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Almanca yaz…" oninput="LSN.sel=this.value.trim()||null;footCheck()" ${enter}>${umlautBar('fillIn')}
    <button class="wx-hint" onclick="wxHint()"><i class="fa-regular fa-lightbulb"></i> İpucu</button><div id="wxHint" class="wx-hint-out"></div>`;
  else if (it.k === 'wr') h += `<h2 class="ls-q">Almancaya çevir ve yaz</h2><div class="wx-src">“${esc(it.q)}”</div>
    <textarea id="fillIn" class="pill-input" rows="3" autocomplete="off" spellcheck="false" placeholder="Almanca cümleyi yaz…" oninput="LSN.sel=this.value.trim()||null;footCheck()" ${enter}></textarea>${umlautBar('fillIn')}
    <button class="wx-hint" onclick="wxHint()"><i class="fa-regular fa-lightbulb"></i> Kelimeleri göster</button><div id="wxHint" class="wx-hint-out"></div>`;
  else if (it.k === 'scr') {
    let letters = it.a.split(''); for (let n = 0; n < 6 && letters.join('') === it.a; n++) letters = shuffle(letters);
    LSN.tokens = letters.map((w, i) => ({ w, i }));
    h += `<div class="scr"><h2 class="ls-q">Harfleri doğru sıraya diz: <span class="hl">${esc(it.q)}</span></h2><div class="answer-line" id="ansLine">${it.art ? `<span class="wx-art">${esc(it.art)}</span>` : ''}</div><div class="bank" id="bank">${LSN.tokens.map((t, k) => `<button class="tok press" data-k="${k}" onclick="tapTok(${k})">${esc(t.w)}</button>`).join('')}</div></div>`;

  if (innerWidth <= 960 && extra > 0) document.querySelectorAll('.fx-feed').forEach(f => { f.style.height = Math.max(440, f.offsetHeight - extra) + 'px'; });
}
addEventListener('resize', () => { if (isFx() && document.querySelector('.fx-feed')) fxSize(); });
// Klavye: akış odaktayken yukarı/aşağı ok bir slayt ilerler
document.addEventListener('keydown', e => {
  const f = document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('fx-feed') ? document.activeElement : null;
  if (!f || !['ArrowDown', 'ArrowUp', 'PageDown', 'PageUp'].includes(e.key)) return;
  e.preventDefault(); const dir = /Down/.test(e.key) ? 1 : -1, step = f.clientHeight + 12;
  f.scrollTo({ top: Math.round(f.scrollTop / step + dir) * step, behavior: 'auto' });
});

// Akış: seviye alanında yazı rengi ve beyaz yüzey üstündeki koyu ton da geçsin (B1 sarısında yazı koyu)
const _lvStyleFx = lvStyle;
lvStyle = function (color) { const k = LV_COLORS[color] ? color : 'a1', t = FX_TONE[k]; return _lvStyleFx(color) + (isFx() ? `;--lvi:${t[0]};--lvd2:${t[1]}` : ''); };
// Ders: etkinlik türü üst şeride taşınır (başlığın üstünde etiket olmasın)
const _renderItemFx = renderItem;
renderItem = function () {
  _renderItemFx.apply(this, arguments);
  if (!(isFx() || isAm()) || !LSN) return;
  const k = document.querySelector('#lsBody .ls-kind'), top = document.querySelector('#lesson .ls-top'); if (!k || !top) return;
  let pill = document.getElementById('fxKind'); if (!pill) { pill = document.createElement('span'); pill.id = 'fxKind'; pill.className = 'fx-kind'; top.insertBefore(pill, document.getElementById('lsCount')); }
  pill.textContent = k.textContent;
};
// Ünite penceresi: seviye etiketi meta satırına, içerikteki emojiler simgeye
const _openUnitFx = openUnit;
openUnit = function (id) {
  const el = _openUnitFx.apply(this, arguments);
  if (!(isFx() || isAm()) || !el) return el;
  const sc = el.querySelector('.us-top .smallcaps'), meta = el.querySelector('.us-meta');
  if (sc && meta) meta.insertAdjacentHTML('afterbegin', `<span class="fx-lvm">${esc(sc.textContent.trim())}</span>`);
  el.querySelectorAll('.guide').forEach(g => { g.innerHTML = g.innerHTML.replace(/💡\s*/g, '<i class="fa-solid fa-lightbulb" aria-hidden="true"></i>').replace(/⚡/g, '<i class="fa-solid fa-bolt" aria-hidden="true"></i>'); });
  return el;
};
/* ---------- Üst çubuk: ana sayfada selam ---------- */
const _renderTopbarFx = renderTopbar;
renderTopbar = function () {
  _renderTopbarFx.apply(this, arguments);
  if (!isFx() || !D || PAGE !== 'home' || innerWidth > 960) return;
  const t = document.querySelector('#topbar .page-title'), p = PROFILES.find(x => x.id === PID); const h = new Date().getHours();
  if (t && p) t.textContent = (h < 11 ? 'Guten Morgen' : h < 18 ? 'Guten Tag' : 'Guten Abend') + ', ' + p.name;
};

/* ---------- Ayarlar: dört tasarım, Akış varsayılan ---------- */
setDesign = function (d) {
  try { localStorage.setItem('df_design', d); } catch (e) {}
  const h = document.documentElement; h.classList.toggle('bh', d === 'bh'); h.classList.toggle('bm', d === 'bm' || d === 'fx'); h.classList.toggle('fx', d === 'fx');
  bhPosterDrawn = false; bhLearnSeen = false; bmAlbumDrawn = false; bmLearnSeen = false; renderNav(); go(PAGE);
  toast('Tasarım: ' + ({ fx: 'Akış', bh: 'Bauhaus', bm: 'Briefmarke', herb: 'Herbaryum' }[d] || d));
};
const _settingsFx = VIEWS.settings;
VIEWS.settings = () => {
  const cur = isFx() ? 'fx' : isBm() ? 'bm' : isBh() ? 'bh' : 'herb';
  const opt = (k, prev, t) => `<button class="ds-opt ${cur === k ? 'on' : ''}" onclick="setDesign('${k}')" aria-pressed="${cur === k}">${prev}${t}</button>`;
  return _settingsFx().replace(/<div class="ds-pick three">[\s\S]*?Herbaryum<\/button><\/div>/, `<div class="ds-pick four">${opt('fx', '<div class="ds-prev fxp"><i style="background:#e5372b"></i><i style="background:#f2b200"></i><i style="background:#2f5bff"></i></div>', 'Akış')}${opt('bm', '<div class="ds-prev bm"><span></span></div>', 'Briefmarke')}${opt('bh', '<div class="ds-prev bh"><i></i><i></i><i></i></div>', 'Bauhaus')}${opt('herb', '<div class="ds-prev hb">Blatt</div>', 'Herbaryum')}</div>`);
};

/* =====================================================================
   APPLE TARZI ekranlar (html.am): Ana Sayfa rafları, seviye albümü, mini oynatıcı.
   Varsayılan tasarım; Akış, Briefmarke, Bauhaus ve Herbaryum Ayarlar > Tasarım'dan seçilebilir.
   ===================================================================== */
const isAm = () => document.documentElement.classList.contains('am');
const AM_HUE = { a1: 4, a2: 30, b1: 44, b2: 146, c1: 214, c2: 276 };
// Kapak: seviyenin tonundan, ünitenin sırasına göre kayan iki ışıklı renk alanı
function amBg(L, i = 0) {
  const h = AM_HUE[L.color] + ((i % 6) - 2) * 8, l = L.color === 'b1' ? 46 : L.color === 'b2' ? 40 : 52;
  return `background:radial-gradient(130% 95% at 0% 0%,hsl(${h + 26} 96% ${l + 16}%) 0,transparent 58%),radial-gradient(115% 115% at 100% 100%,hsl(${h - 20} 88% ${l - 18}%) 0,transparent 62%),hsl(${h} 86% ${l}%)`;
}
const amCover = (L, i, title, cls = '', icon = '') => `<span class="am-cv ${cls}" style="${amBg(L, i)}" aria-hidden="true"><span class="am-cv-lv">${L.id}</span>${icon ? `<i class="fa-solid ${icon}"></i>` : ''}<span class="am-cv-t" lang="de">${esc(title)}</span></span>`;
const amEq = '<span class="am-eq" aria-label="sıradaki"><i></i><i></i><i></i></span>';
const amMins = (u, L) => Math.max(3, Math.round(buildUnitItems(u, L).length * .6));
// Sıradaki ünite (yoksa sınav) için ortak bilgiler
function amNext() {
  const nu = nextUnit(); if (!nu) return null; const L = LEVELS[nu.li];
  return nu.boss ? { nu, L, i: L.units.length, title: 'Abschlussprüfung ' + L.id, sub: `${L.id} seviye sonu sınavı · 15 soru`, open: `startBoss(${nu.li})`, start: `startBoss(${nu.li})` }
    : { nu, L, i: nu.ui, title: nu.u.de, sub: `${nu.u.t} · ${L.id} · ${nu.ui + 1}/${L.units.length}`, open: `openUnit('${nu.u.id}')`, start: `startUnit('${nu.u.id}')` };
}

/* ---------- Ana Sayfa ---------- */
const _homeAm = VIEWS.home;
VIEWS.home = () => {
  if (!isAm()) return _homeAm();
  ensureQuests();
  const n = amNext(), due = D.cards.filter(c => c.due <= Date.now()), dailyDone = D.daily && D.daily[today()] != null;
  const idiom = IDIOMS[hashStr(today()) % IDIOMS.length];
  const hero = n ? `<button class="am-hero" style="${amBg(n.L, n.i)}" onclick="${n.open}" aria-label="Sıradaki: ${esc(n.title)}">
      <span class="am-hcv">${amCover(n.L, n.i, '', 'xl')}</span>
      <h2 lang="de">${esc(n.title)}</h2><p>${esc(n.sub)}</p><span class="am-play"><i class="fa-solid fa-play"></i> Devam et</span></button>`
    : `<div class="am-hero" style="${amBg(LEVELS[5], 2)}"><h2>Bütün yol bitti</h2><p>A1'den C2'ye her şeyi geçtin.</p></div>`;
  const mix = (bg, ic, top, big, sub, js) => `<button class="am-it" onclick="${js}"><span class="am-mix" style="background:${bg}"><span>${top}</span><i class="fa-solid ${ic}"></i><b>${big}</b></span><b>${big}</b><small>${sub}</small></button>`;
  const forYou = [
    mix('linear-gradient(150deg,#ff6a88,#fa2d48 55%,#c21a5b)', 'fa-calendar-day', 'Her gün', 'Günün Dersi', dailyDone ? 'Bugün yapıldı' : '5 dakikalık karışık set', 'startDaily()'),
    mix('linear-gradient(150deg,#5ac8fa,#007aff 55%,#3a3adb)', 'fa-layer-group', `${due.length} kart`, 'Tekrar Karışımı', due.length ? due.slice(0, 3).map(c => c.de).join(', ') : 'Şimdilik boş', "go('review')"),
    mix('linear-gradient(150deg,#ffd60a,#ff9f0a 55%,#ff6b00)', 'fa-triangle-exclamation', `${D.wrong.length} soru`, 'Yanlışlarım', 'Hata yaptığın sorular', "go('errors')"),
    mix('linear-gradient(150deg,#bf5af2,#7d3cff 55%,#4b2bd6)', 'fa-pen-nib', 'Pratik', 'Yazma Pratiği', n && !n.nu.boss ? n.nu.u.de : 'Serbest yazma', n && !n.nu.boss ? `startPractice('${n.nu.u.id}','yaz')` : "go('writing')")
  ].join('');
  // Son çalışılanlar: biten üniteler (en yeniler önde) + sıradaki
  const doneU = []; LEVELS.forEach((L, li) => L.units.forEach((u, ui) => { if (D.done[u.id] != null) doneU.push({ L, li, u, ui }); }));
  const recent = doneU.reverse().slice(0, 10).map(({ L, u, ui }) => `<button class="am-it" onclick="openUnit('${u.id}')">${amCover(L, ui, u.de)}<b lang="de">${esc(u.de)}</b><small>${esc(u.t)} · %${Math.round(D.done[u.id] * 100)}</small></button>`).join('');
  const levels = LEVELS.map((L, li) => { const open = levelUnlocked(li), d = L.units.filter(u => D.done[u.id] != null).length; return `<button class="am-it" onclick="amLv=${li};go('learn')">${amCover(L, 2, L.tr, open ? '' : 'lock', open ? '' : 'fa-lock')}<b>${L.id} · ${esc(L.tr)}</b><small>${open ? `${d}/${L.units.length} ünite` : 'Kilitli'}</small><span class="am-pg"><i style="width:${Math.round(d / L.units.length * 100)}%"></i></span></button>`; }).join('');
  const quests = (D.quests ? D.quests.list : []).map(q => { const d = QUEST_POOL.find(x => x.id === q.id); if (!d) return ''; const ok = q.p >= d.goal; return `<div class="am-li ${ok ? 'done' : ''}"><span class="am-ic" style="background:${ok ? 'var(--positive)' : 'var(--accent)'}"><i class="fa-solid ${ok ? 'fa-check' : 'fa-bullseye'}"></i></span><span class="am-lm"><b style="font-weight:400">${d.t}</b></span><span class="am-le">${q.p}/${d.goal}</span></div>`; }).join('');
  return `<div class="am-home"><h1 class="am-lt">Ana Sayfa</h1>${hero}
    <section><div class="am-sh"><h2>Senin İçin</h2></div><div class="am-row">${forYou}</div></section>
    ${recent ? `<section><div class="am-sh"><h2>Son Çalıştıkların</h2><button onclick="go('learn')">Tümü</button></div><div class="am-row">${recent}</div></section>` : ''}
    <section><div class="am-sh"><h2>Seviyeler <i class="fa-solid fa-chevron-right"></i></h2><button onclick="go('learn')">${lessonsDone(D)}/${LEVELS.reduce((a, L) => a + L.units.length, 0)}</button></div><div class="am-row">${levels}</div></section>
    <div class="am-two">
      <section><div class="am-sh"><h2>Bugünün Görevleri</h2><button onclick="go('badges')">Kalkan ${D.shields}/3</button></div><div class="am-list">${quests}</div></section>
      <section><div class="am-sh"><h2>Günün Deyimi</h2></div><div class="am-list" style="padding:16px">
        <p class="am-idiom" lang="de">${esc(idiom.de)}</p><p style="margin:0;font-weight:500">${esc(idiom.tr)}</p><p class="am-foot" style="margin:4px 0 12px">Kelimesi kelimesine: “${esc(idiom.lit)}”</p>
        <div class="row" style="gap:8px"><button class="btn btn-ghost btn-sm" data-say="${esc(idiom.de)}" onclick="say(this.dataset.say)"><i class="fa-solid fa-play"></i> Dinle</button><button class="btn btn-ghost btn-sm" data-de="${esc(idiom.de)}" data-tr="${esc(idiom.tr)}" onclick="addCard(this.dataset.de,this.dataset.tr,'idiom')"><i class="fa-solid fa-plus"></i> Kutuya ekle</button></div></div></section>
    </div></div>`;
};

/* ---------- Öğren: her seviye bir albüm, üniteler şarkı listesi ---------- */
let amLv = null;
const _learnAm = VIEWS.learn;
VIEWS.learn = () => {
  if (!isAm()) return _learnAm();
  const nu = nextUnit(), li = amLv != null ? amLv : currentLevelIdx(), L = LEVELS[li], open = levelUnlocked(li);
  const d = L.units.filter(u => D.done[u.id] != null).length, bossDone = !!D.boss[L.id];
  const seg = LEVELS.map((x, i) => { const dd = x.units.filter(u => D.done[u.id] != null).length; return `<button class="${i === li ? 'on' : ''}" style="--h:var(--${x.color})" onclick="amLv=${i};go('learn')" aria-pressed="${i === li}"><span class="am-sd"></span>${x.id}<small>${levelUnlocked(i) ? dd + '/' + x.units.length : '<i class="fa-solid fa-lock"></i>'}</small><span class="am-sp"><i style="width:${Math.round(dd / x.units.length * 100)}%"></i></span></button>`; }).join('');
  const target = L.units.find((u, ui) => D.done[u.id] == null && unitUnlocked(li, ui)) || L.units[0];
  const tracks = L.units.map((u, ui) => {
    const un = unitUnlocked(li, ui), dn = D.done[u.id] != null, cur = nu && !nu.boss && nu.u.id === u.id;
    return `<button class="am-tr ${dn ? 'done' : ''} ${cur ? 'cur' : ''} ${un ? '' : 'lock'}" onclick="${un ? `openUnit('${u.id}')` : `toast('Önce önceki üniteyi geç','warn')`}" ${un ? '' : 'aria-disabled="true"'}>
      <span class="am-tn">${cur ? amEq : dn ? '<i class="fa-solid fa-check"></i>' : ui + 1}</span>
      <span class="am-tm"><b lang="de">${esc(u.de)}</b><small>${esc(u.t)}</small></span>
      <span class="am-te">${dn ? '%' + Math.round(D.done[u.id] * 100) : un ? amMins(u, L) + ' dk' : '<i class="fa-solid fa-lock"></i>'}${un ? '<i class="fa-solid fa-ellipsis"></i>' : ''}</span></button>`;
  }).join('');
  const bOpen = bossUnlocked(li), bCur = nu && nu.boss && nu.li === li, sc = D.bossScore && D.bossScore[L.id];
  const boss = `<button class="am-tr ${bossDone ? 'done' : ''} ${bCur ? 'cur' : ''} ${bOpen ? '' : 'lock'}" onclick="${bOpen ? `startBoss(${li})` : `toast('Sınav için bütün üniteleri geç','warn')`}">
      <span class="am-tn">${bCur ? amEq : bossDone ? '<i class="fa-solid fa-check"></i>' : '<i class="fa-solid fa-award"></i>'}</span>
      <span class="am-tm"><b lang="de">Abschlussprüfung ${L.id}</b><small>Seviye sonu sınavı · 15 soru · baraj %80</small></span>
      <span class="am-te">${bossDone && sc ? '%' + sc.score : bOpen ? '12 dk' : '<i class="fa-solid fa-lock"></i>'}</span></button>`;
  const acts = open ? `<div class="am-acts"><button class="btn" onclick="openUnit('${target.id}')"><i class="fa-solid fa-play"></i> ${d ? 'Devam et' : 'Başla'}</button><button class="btn btn-ghost" onclick="startPractice('${(L.units.slice().reverse().find(u => D.done[u.id] != null) || target).id}','karisik')"><i class="fa-solid fa-shuffle"></i> Karışık</button></div>`
    : `<div class="am-acts"><button class="btn" onclick="startPlacement()"><i class="fa-solid fa-compass"></i> Seviye tespiti</button><button class="btn btn-ghost" onclick="amLv=${Math.max(0, li - 1)};go('learn')"><i class="fa-solid fa-arrow-left"></i> ${li ? LEVELS[li - 1].id : ''}</button></div>`;
  return `<div class="am-seg" role="tablist">${seg}</div>
  <div class="am-album"><div class="am-ah">${amCover(L, 2, L.name, 'xl ' + (open ? '' : 'lock'), open ? '' : 'fa-lock')}
      <div><h2>${esc(L.tr)}</h2><div class="am-by">${L.id} · Almanca</div><div class="am-meta">${L.units.length} ünite · 1 sınav · ${d}/${L.units.length} tamam${bossDone ? ' · sınav geçildi' : ''}</div></div>${acts}</div>
    <div><div class="am-tracks">${tracks}${boss}</div>
      <p class="am-foot" style="margin-top:14px">${open ? `Her üniteyi en az %80 ile geçince sıradaki açılır. ${L.units.length} ünitenin sonundaki sınavı geçince ${LEVELS[li + 1] ? LEVELS[li + 1].id + ' açılır' : 'müfredat tamamlanır'}.` : `${li ? LEVELS[li - 1].id + ' seviye sonu sınavını geçince' : ''} bu seviye açılır. Seviye tespitiyle atlayabilirsin.`}</p>
      ${bossDone ? `<button class="btn btn-ghost btn-sm" style="margin-top:6px" onclick="certPdf('${L.id}')"><i class="fa-solid fa-certificate"></i> Sertifika</button>` : ''}</div></div>`;
};

/* ---------- Mini oynatıcı: sıradaki ünite her sayfada alt menünün üstünde ---------- */
function amMini() {
  let m = document.getElementById('amMini');
  const n = isAm() && D && !$('#app').hidden ? amNext() : null;
  if (!n) { if (m) m.remove(); return; }
  if (!m) { m = document.createElement('div'); m.id = 'amMini'; m.setAttribute('role', 'region'); m.setAttribute('aria-label', 'Sıradaki ders'); document.body.appendChild(m); }
  m.onclick = e => { if (!e.target.closest('button')) new Function(n.open)(); };
  m.innerHTML = `${amCover(n.L, n.i, n.title, 'sm')}<span class="am-mm"><b lang="de">${esc(n.title)}</b><small>${esc(n.sub)}</small></span>
    <button aria-label="Derse başla" onclick="${n.start}"><i class="fa-solid fa-play"></i></button><button aria-label="Ayrıntılar" onclick="${n.open}"><i class="fa-solid fa-forward"></i></button>`;
}
const _goAm = go;
go = function () { const r = _goAm.apply(this, arguments); amMini(); return r; };
const _renderGateAm = renderGate;
renderGate = async function () { const m = document.getElementById('amMini'); if (m) m.remove(); return _renderGateAm.apply(this, arguments); };

/* ---------- Ünite penceresi: başlık alanı ünitenin kapağı ---------- */
const _openUnitAm = openUnit;
openUnit = function (id) {
  const el = _openUnitAm.apply(this, arguments);
  if (!isAm() || !el) return el;
  const f = findUnit(id), head = el.querySelector('.us-head'); if (f && head) head.style.cssText += ';' + amBg(f.L, f.ui);
  el.querySelectorAll('.guide').forEach(g => { g.innerHTML = g.innerHTML.replace(/💡\s*/g, '<i class="fa-solid fa-lightbulb" aria-hidden="true" style="color:var(--b1d);margin-right:6px"></i>').replace(/⚡/g, '<i class="fa-solid fa-bolt" aria-hidden="true"></i>'); });
  return el;
};

// Üst şerit: AI Öğretmen her ekranda simge olarak (yüzen düğme yerine)
const _renderTopbarAm = renderTopbar;
renderTopbar = function () {
  _renderTopbarAm.apply(this, arguments);
  if (!isAm() || !D) return;
  const row = document.querySelector('#topbar .tb-row, #topbar .row'); if (!row || row.querySelector('.tutor-top')) return;
  row.insertAdjacentHTML('beforeend', '<button class="icon-btn tutor-top" title="AI Öğretmen" aria-label="AI Öğretmen" onclick="toggleTutor()"><i class="fa-solid fa-robot"></i></button>');
};
/* ---------- Ayarlar: beş tasarım, Apple tarzı varsayılan ---------- */
setDesign = function (d) {
  try { localStorage.setItem('df_design', d); } catch (e) {}
  const h = document.documentElement; h.classList.toggle('bh', d === 'bh'); h.classList.toggle('bm', ['bm', 'fx', 'am'].includes(d)); h.classList.toggle('fx', d === 'fx'); h.classList.toggle('am', d === 'am');
  bhPosterDrawn = false; bhLearnSeen = false; bmAlbumDrawn = false; bmLearnSeen = false; renderNav(); go(PAGE);
  toast('Tasarım: ' + ({ am: 'Cam', fx: 'Akış', bh: 'Bauhaus', bm: 'Briefmarke', herb: 'Herbaryum' }[d] || d));
};
const _settingsAm = VIEWS.settings;
VIEWS.settings = () => {
  const cur = isAm() ? 'am' : isFx() ? 'fx' : isBm() ? 'bm' : isBh() ? 'bh' : 'herb';
  const opt = (k, prev, t) => `<button class="ds-opt ${cur === k ? 'on' : ''}" onclick="setDesign('${k}')" aria-pressed="${cur === k}">${prev}${t}</button>`;
  return _settingsAm().replace(/<div class="ds-pick four">[\s\S]*?Herbaryum<\/button><\/div>/, `<div class="ds-pick five">${opt('am', '<div class="ds-prev amp"><i></i></div>', 'Cam')}${opt('fx', '<div class="ds-prev fxp"><i style="background:#e5372b"></i><i style="background:#f2b200"></i><i style="background:#2f5bff"></i></div>', 'Akış')}${opt('bm', '<div class="ds-prev bm"><span></span></div>', 'Briefmarke')}${opt('bh', '<div class="ds-prev bh"><i></i><i></i><i></i></div>', 'Bauhaus')}${opt('herb', '<div class="ds-prev hb">Blatt</div>', 'Herbaryum')}</div>`);
};

/* ---------- Başlat ---------- */
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!CFG.theme) applyTheme(); });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
document.addEventListener('visibilitychange', () => { if (!document.hidden && D && PAGE === 'home') go('home'); });
renderGate();
</script>
