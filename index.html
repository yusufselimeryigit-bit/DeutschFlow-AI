<style>
/* ============ TASARIM DEĞİŞKENLERİ ============ */
:root {
  --bg: #F3F6FB; --bg2: #FFFFFF; --card: rgba(255,255,255,.74); --card2: rgba(255,255,255,.92);
  --stroke: rgba(15,23,42,.08); --text: #0F172A; --muted: #64748B; --soft: rgba(15,23,42,.05);
  --a1: #58CC02; --a1d: #46A302; --a2: #1CB0F6; --a2d: #1899D6; --b1: #A560F0; --b1d: #8549BA;
  --b2: #FF9600; --b2d: #CC7800; --c1: #FFC800; --c1d: #D9A800; --c2: #E5A400; --c2d: #B8860B;
  --red: #FF4B4B; --redd: #D33131; --green: #58CC02; --greend: #46A302;
  --acc: var(--a1); --accd: var(--a1d);
  --lv: var(--acc); --lvd: var(--accd);
  --shadow: 0 12px 34px -14px rgba(15,23,42,.22); --r: 22px;
  --nav-h: 74px;
}
.dark {
  --bg: #0A0F1F; --bg2: #111833; --card: rgba(22,29,56,.68); --card2: rgba(26,34,64,.94);
  --stroke: rgba(255,255,255,.08); --text: #E8ECF8; --muted: #94A3B8; --soft: rgba(255,255,255,.06);
  --shadow: 0 14px 40px -16px rgba(0,0,0,.6);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
/* iPhone: hızlı art arda dokunuşlar çift-dokunma yakınlaştırmasına gitmesin (aksi halde ikinci dokunuş düğmeye ulaşmaz) */
button, a, label, input, select, textarea, .opt, .tok, .node, .story-w, .swatch { touch-action: manipulation; }
/* Ders ekranı görünür alanı takip etsin: iPhone klavyesi açılınca alttaki “Kontrol et” klavyenin arkasında kalmasın */
#lesson { top: var(--vvt, 0px); bottom: auto; height: var(--vvh, 100%); }
html, body { margin: 0; padding: 0; }
body { font-family: 'Nunito', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; transition: background .3s, color .3s; }
body::before { content: ''; position: fixed; inset: -20%; z-index: -1; pointer-events: none;
  background: radial-gradient(40% 35% at 12% 10%, rgba(88,204,2,.18), transparent 70%), radial-gradient(35% 30% at 88% 18%, rgba(28,176,246,.16), transparent 70%), radial-gradient(40% 40% at 70% 90%, rgba(165,96,240,.14), transparent 70%); }
h1, h2, h3, .font-display { font-family: 'Outfit', 'Nunito', sans-serif; letter-spacing: -.01em; margin: 0; }
button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
input, textarea, select { font-family: inherit; color: var(--text); }
a { color: inherit; }
::selection { background: rgba(88,204,2,.3); }

/* ============ CAM KARTLAR ============ */
.glass { background: var(--card); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); border: 1px solid var(--stroke); border-radius: var(--r); box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.35); }
.dark .glass { box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.05); }
.card { padding: 20px; }
.muted { color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; font-weight: 800; font-size: 13px; background: var(--soft); }
.lvl-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 38px; height: 26px; padding: 0 10px; border-radius: 999px; font-weight: 900; font-size: 13px; color: #fff; background: var(--lv); }
.pill-input { width: 100%; padding: 13px 16px; border-radius: 16px; border: 2px solid var(--stroke); background: var(--card2); font-size: 16px; outline: none; transition: border-color .2s; }
.pill-input:focus { border-color: var(--lv); }
textarea.pill-input { resize: vertical; min-height: 90px; }

/* ============ DUOLINGO TARZI 3D DÜĞMELER ============ */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 20px; border-radius: 16px; font-weight: 900; font-size: 15px; letter-spacing: .01em; background: var(--lv); color: #fff; box-shadow: 0 4px 0 var(--lvd); transition: transform .08s, box-shadow .08s, filter .2s; user-select: none; }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--lvd); }
.btn:disabled { filter: grayscale(.9) opacity(.55); cursor: not-allowed; transform: none; }
.btn-ghost { background: var(--card2); color: var(--text); box-shadow: 0 4px 0 var(--stroke), inset 0 0 0 2px var(--stroke); }
.btn-ghost:active { box-shadow: inset 0 0 0 2px var(--stroke); }
.btn-red { background: var(--red); box-shadow: 0 4px 0 var(--redd); }
.btn-sm { padding: 8px 14px; font-size: 13px; border-radius: 12px; }
.btn-block { width: 100%; }
.icon-btn { width: 42px; height: 42px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; background: var(--soft); transition: transform .15s, background .2s; }
.icon-btn:hover { background: var(--stroke); }
.icon-btn:active { transform: scale(.9); }
.press { transition: transform .12s cubic-bezier(.34,1.56,.64,1); }
.press:active { transform: scale(.95); }

/* ============ DÜZEN ============ */
#app { display: grid; grid-template-columns: 270px minmax(0, 1fr); min-height: 100vh; } /* minmax(0,…): geniş içerik (tablo, ısı haritası) sayfayı ekrandan taşırmasın */
#sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 22px 14px; border-right: 1px solid var(--stroke); background: var(--card); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
.brand-logo { width: 42px; height: 42px; border-radius: 13px; background: linear-gradient(135deg, var(--acc), var(--a2)); display: flex; align-items: center; justify-content: center; color: #fff; font-family: 'Outfit'; font-weight: 800; font-size: 20px; box-shadow: 0 6px 16px -6px rgba(88,204,2,.7); }
.brand b { font-family: 'Outfit'; font-size: 21px; }
.brand small { display: block; font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: .12em; }
.nav-group { font-size: 11px; font-weight: 900; letter-spacing: .14em; color: var(--muted); padding: 14px 12px 6px; text-transform: uppercase; }
.nav-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; font-weight: 800; font-size: 15px; color: var(--text); text-align: left; transition: background .2s, color .2s; }
.nav-item i { width: 22px; text-align: center; font-size: 17px; color: var(--muted); }
.nav-item:hover { background: var(--soft); }
.nav-item.active { background: color-mix(in srgb, var(--acc) 15%, transparent); color: var(--accd); }
.nav-item.active i { color: var(--acc); }
.dark .nav-item.active { color: color-mix(in srgb, var(--acc) 62%, #fff); }
#main { padding: 26px 28px 120px; max-width: 1180px; width: 100%; min-width: 0; margin: 0 auto; }
#topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
.stat-pill { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px; font-weight: 900; font-size: 15px; background: var(--card); border: 1px solid var(--stroke); }
#bottomNav { display: none; }
.conj-grid { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
@media (max-width: 760px) { .conj-grid { grid-template-columns: 1fr; } }
.grid-2 > *, .grid-3 > *, .grid-4 > *, .conj-grid > *, .box-grid > * { min-width: 0; }
.verb-row b { flex-shrink: 0; }
.verb-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.box-grid { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 12px; }
@media (max-width: 620px) { .box-grid { grid-template-columns: repeat(3, minmax(0,1fr)); } }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; }
.stack > * + * { margin-top: 16px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.page-title { font-size: 30px; font-weight: 800; }
.page-sub { color: var(--muted); font-weight: 700; margin: 4px 0 20px; }
.section-title { font-size: 19px; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
.ro-banner { display: none; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 14px; margin-bottom: 16px; font-weight: 800; background: rgba(28,176,246,.14); color: var(--a2d); }
body.readonly .ro-banner { display: flex; }

@media (max-width: 960px) {
  #app { grid-template-columns: minmax(0, 1fr); }
  #sidebar { display: none; }
  #main { padding: 16px 16px calc(var(--nav-h) + 90px + env(safe-area-inset-bottom)); }
  #topbar { padding-top: env(safe-area-inset-top); }
  #bottomNav { display: flex; position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); height: var(--nav-h); z-index: 60; justify-content: space-around; align-items: center; padding: 0 6px; border-radius: 26px; }
  .bn-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 900; color: var(--muted); padding: 8px 0; border-radius: 18px; }
  .bn-item i { font-size: 20px; }
  .bn-item.active { color: var(--acc); }
  .grid-3, .grid-4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .page-title { font-size: 25px; }
}
@media (max-width: 620px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } .grid-4 { grid-template-columns: repeat(2, minmax(0,1fr)); } }

/* ============ ÖĞRENME YOLU (DUOLINGO PATİKASI) ============ */
.level-block { margin-bottom: 34px; }
.level-head { display: flex; align-items: center; gap: 14px; padding: 18px 20px; border-radius: 22px; color: #fff; background: var(--lv); box-shadow: 0 6px 0 var(--lvd); margin-bottom: 26px; }
.level-head h2 { font-size: 22px; }
.level-head p { margin: 2px 0 0; font-weight: 700; opacity: .9; font-size: 14px; }
.level-head .lh-ic { width: 52px; height: 52px; border-radius: 16px; background: rgba(255,255,255,.22); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
.level-head.locked { filter: grayscale(.85) opacity(.7); }
.path { display: flex; flex-direction: column; align-items: center; gap: 22px; }
.node-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.node { position: relative; width: 76px; height: 76px; border-radius: 50%; background: var(--lv); color: #fff; font-size: 28px; display: flex; align-items: center; justify-content: center; box-shadow: 0 7px 0 var(--lvd), 0 12px 24px -10px var(--lv); transition: transform .12s; }
.node:active { transform: translateY(6px); box-shadow: 0 1px 0 var(--lvd); }
.node.locked { background: #CBD5E1; box-shadow: 0 7px 0 #94A3B8; color: #F8FAFC; cursor: not-allowed; }
.dark .node.locked { background: #334155; box-shadow: 0 7px 0 #1E293B; color: #64748B; }
.node.done::after { content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900; position: absolute; right: -4px; top: -4px; width: 28px; height: 28px; border-radius: 50%; background: #FFC800; color: #fff; font-size: 13px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 #D9A800; }
.node.current { animation: nodePulse 1.8s ease-in-out infinite; }
@keyframes nodePulse { 0%,100% { box-shadow: 0 7px 0 var(--lvd), 0 0 0 0 color-mix(in srgb, var(--lv) 55%, transparent); } 50% { box-shadow: 0 7px 0 var(--lvd), 0 0 0 14px transparent; } }
.node.boss { width: 92px; height: 92px; border-radius: 28px; font-size: 34px; }
.node-label { font-weight: 800; font-size: 14px; max-width: 170px; text-align: center; }

/* ============ MODAL / SHEET ============ */
.overlay { position: fixed; inset: 0; z-index: 350; background: rgba(2,6,23,.5); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 16px; animation: fadeIn .2s ease; }
.sheet { width: 100%; max-width: 720px; max-height: 92vh; overflow-y: auto; background: var(--card2); border-radius: 28px; border: 1px solid var(--stroke); box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); animation: sheetIn .35s cubic-bezier(.22,1,.36,1); }
.sheet-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 20px; background: var(--card2); border-bottom: 1px solid var(--stroke); }
.sheet-body { padding: 20px; }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes sheetIn { from { opacity: 0; transform: translateY(30px) scale(.97); } }
.tabs { display: flex; gap: 6px; padding: 4px; border-radius: 16px; background: var(--soft); margin-bottom: 16px; overflow-x: auto; }
.tab { flex: 1; white-space: nowrap; padding: 9px 14px; border-radius: 12px; font-weight: 800; font-size: 14px; color: var(--muted); }
.tab.active { background: var(--card2); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,.08); }

/* ============ DERS / ETKİNLİK MOTORU ============ */
#lesson { position: fixed; inset: 0; z-index: 120; background: var(--bg); display: flex; flex-direction: column; }
.ls-top { display: flex; align-items: center; gap: 14px; padding: calc(14px + env(safe-area-inset-top)) 20px 14px; max-width: 900px; width: 100%; margin: 0 auto; }
.progress { flex: 1; height: 16px; border-radius: 999px; background: var(--soft); overflow: hidden; }
.progress > div { height: 100%; border-radius: 999px; background: var(--lv); box-shadow: inset 0 -4px 0 rgba(0,0,0,.12), inset 0 4px 0 rgba(255,255,255,.25); transition: width .5s cubic-bezier(.22,1,.36,1); }
.ls-body { flex: 1; overflow-y: auto; padding: 10px 20px 30px; max-width: 760px; width: 100%; margin: 0 auto; }
.ls-kind { font-weight: 900; font-size: 13px; letter-spacing: .1em; color: var(--lv); text-transform: uppercase; margin-bottom: 8px; }
.ls-q { font-family: 'Outfit'; font-size: 26px; font-weight: 700; margin: 0 0 22px; line-height: 1.3; }
.opt { width: 100%; text-align: left; padding: 16px 18px; border-radius: 18px; border: 2px solid var(--stroke); background: var(--card2); font-weight: 800; font-size: 17px; box-shadow: 0 4px 0 var(--stroke); margin-bottom: 12px; transition: transform .08s, border-color .15s, background .15s; display: flex; align-items: center; gap: 12px; }
.opt:active { transform: translateY(3px); box-shadow: none; }
.opt .k { width: 30px; height: 30px; border-radius: 10px; border: 2px solid var(--stroke); display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--muted); flex-shrink: 0; }
.opt.sel { border-color: var(--a2); background: rgba(28,176,246,.1); box-shadow: 0 4px 0 var(--a2d); }
.opt.ok { border-color: var(--green); background: rgba(88,204,2,.12); }
.opt.bad { border-color: var(--red); background: rgba(255,75,75,.1); }
.tf-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tf-row .opt { justify-content: center; font-size: 19px; }
.bank, .answer-line { display: flex; flex-wrap: wrap; gap: 10px; min-height: 58px; padding: 10px; border-radius: 18px; }
.answer-line { border-bottom: 2px solid var(--stroke); border-radius: 0; margin-bottom: 18px; }
.tok { padding: 10px 15px; border-radius: 14px; border: 2px solid var(--stroke); background: var(--card2); font-weight: 800; font-size: 17px; box-shadow: 0 3px 0 var(--stroke); }
.tok.used { visibility: hidden; }
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.match-grid .opt { justify-content: center; text-align: center; margin: 0; }
.match-grid .opt.gone { opacity: .25; pointer-events: none; border-color: var(--green); }
.ls-foot { border-top: 2px solid var(--stroke); padding: 18px 20px calc(18px + env(safe-area-inset-bottom)); background: var(--bg); transition: background .2s; }
.ls-foot-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.ls-foot.ok { background: rgba(88,204,2,.14); }
.ls-foot.bad { background: rgba(255,75,75,.12); }
.fb-title { font-family: 'Outfit'; font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
.ls-foot.ok .fb-title { color: var(--greend); }
.ls-foot.bad .fb-title { color: var(--redd); }
.dark .ls-foot.ok .fb-title { color: #8EE04A; }
.dark .ls-foot.bad .fb-title { color: #FF8080; }
.fb-text { font-weight: 700; margin-top: 4px; max-width: 520px; }
.ai-box { margin-top: 10px; padding: 12px 14px; border-radius: 14px; background: var(--card2); border: 1px solid var(--stroke); font-weight: 600; font-size: 15px; line-height: 1.5; max-width: 560px; }
.diff span { padding: 1px 2px; border-radius: 4px; }
.diff .d-ok { color: var(--greend); }
.diff .d-bad { background: rgba(255,75,75,.22); color: var(--redd); text-decoration: line-through; }
.diff .d-miss { background: rgba(255,200,0,.3); color: #B45309; }
.dark .diff .d-ok { color: #8EE04A; } .dark .diff .d-bad { color: #FF8080; } .dark .diff .d-miss { color: #FFD666; }

/* ============ GRAMMATIK KARTLARI / TABLOLAR ============ */
.guide h4 { font-family: 'Outfit'; font-size: 18px; margin: 18px 0 8px; }
.guide p { line-height: 1.6; font-weight: 600; margin: 8px 0; }
.guide ul { margin: 8px 0; padding-left: 20px; line-height: 1.7; font-weight: 600; }
.guide .tip { padding: 12px 14px; border-radius: 14px; background: rgba(255,200,0,.14); border-left: 4px solid #FFC800; font-weight: 700; margin: 12px 0; }
.guide .ex { padding: 10px 14px; border-radius: 14px; background: var(--soft); margin: 8px 0; font-weight: 700; }
.guide .ex i { color: var(--muted); font-style: normal; font-weight: 600; display: block; font-size: 14px; }
table.gt { width: 100%; border-collapse: separate; border-spacing: 0; margin: 10px 0; border-radius: 14px; overflow: hidden; border: 1px solid var(--stroke); font-size: 15px; }
table.gt th { background: var(--lv); color: #fff; padding: 9px 12px; text-align: left; font-weight: 900; }
table.gt td { padding: 9px 12px; border-top: 1px solid var(--stroke); font-weight: 700; background: var(--card2); }
table.gt tr:nth-child(even) td { background: var(--soft); }
.hl-m { color: #1C7FD6; font-weight: 900; } .hl-f { color: #E0365F; font-weight: 900; } .hl-n { color: #2E9E2E; font-weight: 900; } .hl-p { color: #A560F0; font-weight: 900; } .hl { background: rgba(255,200,0,.35); border-radius: 4px; padding: 0 3px; }
.dark .hl-m { color: #6CB8FF; } .dark .hl-f { color: #FF7A9C; } .dark .hl-n { color: #6FDB6F; }
.tbl-wrap { overflow-x: auto; }

/* ============ KARTLAR / ÇEŞİTLİ ============ */
.quest { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
.quest + .quest { border-top: 1px solid var(--stroke); }

.tabular, .stat-pill, .chip, .k-val, table, .bar ~ b { font-variant-numeric: tabular-nums; }

/* ---------- Yüzeyler: düz, tek ton adımı ---------- */
.glass, .dark .glass { background: var(--surface); -webkit-backdrop-filter: none; backdrop-filter: none; border: 0; border-radius: var(--radius-card); box-shadow: none; }
.card { padding: 20px; }
.glass.idiom { background: var(--surface); color: var(--ink); box-shadow: none; border: 0; }
.glass.idiom .muted { color: var(--muted); }
#tutorPanel, #wordPop, #tbMenu { background: var(--raised) !important; -webkit-backdrop-filter: none; backdrop-filter: none; border: 1px solid var(--border); border-radius: 20px; box-shadow: 0 18px 50px -20px rgba(0,0,0,.28); }

/* ---------- Kabuk: açık düzlem ---------- */
#app { grid-template-columns: 248px minmax(0, 1fr); }
#sidebar { position: sticky; top: 0; height: 100vh; height: 100dvh; margin: 0; padding: 28px 12px; border-radius: 0; background: var(--ground); -webkit-backdrop-filter: none; backdrop-filter: none; border: 0; border-right: 1px solid var(--rule); box-shadow: none; }
.brand { padding: 0 10px 22px; gap: 10px; }
.brand-logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); box-shadow: none; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 22px; color: var(--accent-ink); }
.brand b { font-family: 'Instrument Sans', sans-serif; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.brand small { font-size: 12px; font-weight: 500; letter-spacing: 0; color: var(--muted); }
.nav-group { text-transform: none; letter-spacing: 0; font-size: 12.5px; font-weight: 500; color: var(--faint); padding: 22px 12px 6px; }
.nav-item { height: 34px; padding: 0 10px; gap: 10px; border-radius: 10px; font-size: 14px; font-weight: 400; color: var(--muted); box-shadow: none; }
.nav-item i { width: 18px; font-size: 14px; color: var(--faint); }
.nav-item:hover { background: var(--surface); color: var(--ink); }
.nav-item.active, .dark .nav-item.active { background: var(--surface-2); color: var(--ink); box-shadow: none; font-weight: 500; }
.nav-item.active i { color: var(--ink); }
#main { padding: 32px 40px 120px; max-width: 1180px; }
#topbar, .dark #topbar { position: static; padding: 0; margin: 0 0 28px; border-radius: 0; background: none; -webkit-backdrop-filter: none; backdrop-filter: none; border: 0; box-shadow: none; }
.page-title { font-size: 24px; font-weight: 500; letter-spacing: -.015em; }
.page-sub { font-size: 15px; font-weight: 400; color: var(--muted); margin: 0 0 24px; max-width: 64ch; }
.stat-pill { background: none; border: 0; box-shadow: none; padding: 6px 8px; font-weight: 500; font-size: 14px; color: var(--ink); gap: 6px; }
.stat-pill i { color: var(--faint) !important; font-size: 13px; }
.icon-btn { width: 38px; height: 38px; border-radius: 999px; background: var(--surface); border: 0; box-shadow: none; color: var(--ink); -webkit-backdrop-filter: none; backdrop-filter: none; transition: background .2s var(--ease-out), transform .12s var(--ease-press); }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:active { transform: scale(.94); }
.ro-banner { background: var(--accent-soft); color: var(--accd); border-radius: 14px; font-weight: 500; }

@media (max-width: 960px) {
  #app { grid-template-columns: minmax(0, 1fr); }
  #main { padding: 0 16px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom)); }
  #topbar, .dark #topbar { position: sticky; top: 0; z-index: 50; height: calc(52px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 0 0; margin: 0 -16px 18px; padding-left: 16px; padding-right: 8px; background: var(--ground); border-bottom: 1px solid var(--rule); border-radius: 0; }
  #topbar .page-title { font-size: 17px; font-weight: 600; }
  .page-title { font-size: 17px; }
  #bottomNav, .dark #bottomNav { left: 0; right: 0; bottom: 0; height: calc(60px + env(safe-area-inset-bottom)); padding: 0 4px env(safe-area-inset-bottom); border-radius: 0; background: var(--ground) !important; -webkit-backdrop-filter: none; backdrop-filter: none; border: 0; border-top: 1px solid var(--rule); box-shadow: none; }
  .bn-item { font-size: 11px; font-weight: 500; gap: 3px; color: var(--faint); border-radius: 0; box-shadow: none !important; transform: none !important; background: none !important; }
  .bn-item i { font-size: 18px; }
  .bn-item.active, .dark .bn-item.active { color: var(--ink); background: none; }
  .tb-row .stat-pill { padding: 4px 6px; font-size: 13px; }
}

/* ---------- Düğmeler: düz dolgu, tam yuvarlak ---------- */
.btn, .btn-red, .btn-ghost { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 15px; border-radius: 999px; padding: 11px 20px; min-height: 42px;
  transition: transform .12s var(--ease-press), background-color .2s var(--ease-out), filter .2s; box-shadow: none !important; }
.btn { background: var(--lv, var(--accent)); color: #fff; }
.dark .btn { color: #0d0d0c; }
.btn:hover { filter: brightness(1.06); }
.btn:active, .btn-red:active, .btn-ghost:active { transform: scale(.97); }
.btn-red { background: var(--negative); color: #fff; }
.btn-ghost { background: var(--surface-2); color: var(--ink); border: 0; -webkit-backdrop-filter: none; backdrop-filter: none; }
.dark .btn-ghost { color: var(--ink); }
.btn-ghost:hover { background: var(--control); filter: none; }
.btn-sm { padding: 7px 14px; font-size: 14px; min-height: 34px; }
.btn:disabled { opacity: .4; filter: none; }
.press { transition: transform .12s var(--ease-press); }

/* ---------- Girdi, sekme, çip, çubuk ---------- */
.pill-input, #app .pill-input, .sheet .pill-input, #lesson .pill-input, #tutorPanel .pill-input, #gate .pill-input { background: var(--raised); border: 1px solid var(--border); border-radius: 12px; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; font-size: 16px; color: var(--ink); }
.pill-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.tabs { background: var(--surface-2); border: 0; border-radius: 999px; padding: 3px; box-shadow: none; }
.tab { border-radius: 999px; font-weight: 500; font-size: 14px; color: var(--muted); }
.tab.active { background: var(--raised); color: var(--ink); box-shadow: none; }
.chip { background: var(--surface-2); border: 0; box-shadow: none; font-weight: 500; font-size: 13px; color: var(--ink); }
.bar { height: 6px; background: var(--surface-2); box-shadow: none; }
.bar > div { background: var(--lv, var(--accent)); box-shadow: none; transition: transform .6s var(--ease-out), width .6s var(--ease-out); }
.lvl-badge { border-radius: 6px; height: 22px; min-width: 30px; padding: 0 7px; font-size: 12px; font-weight: 600; letter-spacing: .02em; background: var(--lv); color: #fff; }
.dark .lvl-badge { color: #0d0d0c; }
.section-title { font-size: 14px; font-weight: 600; letter-spacing: 0; gap: 8px; margin-bottom: 14px; }
.section-title i { color: var(--faint) !important; font-size: 13px; }
.empty { color: var(--muted); font-weight: 400; }
.empty i { color: var(--faint); }

/* ---------- Pencereler ---------- */
.overlay { background: rgba(20,20,18,.42); -webkit-backdrop-filter: none; backdrop-filter: none; animation: fadeIn .2s var(--ease-out); }
.sheet { background: var(--raised); -webkit-backdrop-filter: none; backdrop-filter: none; border: 0; border-radius: 24px; box-shadow: 0 30px 80px -30px rgba(0,0,0,.4); animation: sheetIn2 .32s var(--ease-out); }
@keyframes sheetIn2 { from { opacity: 0; transform: translateY(14px) scale(.985); filter: blur(4px); } }
.sheet-head { background: var(--raised); border-bottom: 1px solid var(--rule); -webkit-backdrop-filter: none; backdrop-filter: none; }
.sheet-head h3 { font-size: 17px; font-weight: 600; }
.toast { background: var(--ink); color: var(--ground); border: 0; border-radius: 14px; font-weight: 500; font-size: 14px; box-shadow: 0 16px 34px -16px rgba(0,0,0,.45); -webkit-backdrop-filter: none; backdrop-filter: none; animation: toastIn .26s var(--ease-out); }
.toast i { color: var(--ground) !important; opacity: .8; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-8px); filter: blur(3px); } }

/* ---------- Ana ekran: editoryal karşılama ---------- */
.home { max-width: 1100px; margin: 0 auto; }
.greet-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin: 8px 0 44px; }
.greet { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: clamp(40px, 6.2vw, 72px); line-height: .98; letter-spacing: -.02em; margin: 0; }
.greet-sub { font-size: 17px; line-height: 1.5; color: var(--muted); margin: 14px 0 0; max-width: 56ch; }
.greet-sub b { color: var(--ink); font-weight: 500; }
.greet-act { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; }
.grid12 { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s6 { grid-column: span 6; } .s8 { grid-column: span 8; } .s9 { grid-column: span 9; }
.k-tile { background: var(--surface); border-radius: var(--radius-card); padding: 16px 18px; min-height: 128px; display: flex; flex-direction: column; }
.k-lab { font-size: 13px; color: var(--muted); }
.k-val { font-size: 34px; font-weight: 400; letter-spacing: -.02em; margin-top: auto; line-height: 1.1; }
.k-val small { font-size: 15px; color: var(--muted); margin-left: 4px; }
.k-cap { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.panel { background: var(--surface); border-radius: var(--radius-card); padding: 20px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.panel-head h2 { font-size: 14px; font-weight: 600; margin: 0; }
.panel-head .lnk { font-size: 13px; color: var(--muted); background: none; border: 0; padding: 0; }
.panel-head .lnk:hover { color: var(--ink); }
.row-card { display: flex; align-items: center; gap: 14px; width: 100%; min-height: var(--row-h); padding: 10px 14px; margin-bottom: 8px; background: var(--raised); border: 1px solid var(--border); border-radius: var(--radius-row); text-align: left; color: var(--ink); transition: transform .12s var(--ease-press), border-color .2s var(--ease-out); }
.row-card:last-child { margin-bottom: 0; }
.row-card:hover { border-color: var(--control); }
.row-card:active { transform: scale(.99); }
.row-card .rc-main { flex: 1; min-width: 0; }
.row-card .rc-t { font-size: 15px; font-weight: 500; }
.row-card .rc-s { font-size: 13px; color: var(--muted); margin-top: 1px; }
.row-card .rc-ic { width: 30px; text-align: center; color: var(--faint); font-size: 15px; flex-shrink: 0; }
.row-card .rc-end { font-size: 13px; color: var(--muted); white-space: nowrap; }
.row-card.hot { border-color: var(--accent); }
.row-card.hot .rc-end { color: var(--accd); font-weight: 500; }
.idiom-de { font-family: 'Instrument Serif', Georgia, serif; font-size: 30px; line-height: 1.12; letter-spacing: -.01em; margin: 2px 0 10px; }
.idiom-ex { font-size: 14px; line-height: 1.5; padding-top: 12px; margin-top: 12px; border-top: 1px solid var(--border); }
.q-line { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.q-line + .q-line { border-top: 1px solid var(--border); }
.q-line .bar { flex: 1; }
.q-line .q-t { width: 46%; font-size: 14px; }
.q-line .q-n { font-size: 13px; color: var(--muted); width: 44px; text-align: right; }
.q-line.done .q-t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
.note { font-size: 13px; color: var(--muted); margin: 12px 0 0; }
.flo-inline { flex-shrink: 0; }
@media (max-width: 960px) {
  .greet-row { margin: 6px 0 26px; }
  .greet { font-size: 40px; }
  .greet-sub { font-size: 16px; }
  .s3 { grid-column: span 6; } .s9, .s8, .s6, .s4, .panel.s3 { grid-column: span 12; }
  .k-tile { min-height: 108px; }
  .k-val { font-size: 30px; }
  .flo-inline { display: none; }
}

/* ---------- Hızlı erişim satırları (eski kare kutucukların yerine) ---------- */
.hub { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.hub .row-card { margin: 0; }
@media (min-width: 961px) { .hub.wide { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 520px) { .hub { grid-template-columns: minmax(0, 1fr); } }

/* ---------- İmza: Fahrplan (öğrenme yolu = tren hattı) ---------- */
.line { margin-bottom: 40px; }
.line-head { display: flex; align-items: center; gap: 14px; padding: 0 0 14px; }
.line-badge { display: inline-flex; align-items: center; justify-content: center; height: 34px; min-width: 50px; padding: 0 10px; border-radius: 8px; background: var(--lv); color: #fff; font-weight: 600; font-size: 16px; letter-spacing: .01em; font-variant-numeric: tabular-nums; }
.dark .line-badge { color: #0d0d0c; }
.line-head h2 { font-size: 20px; font-weight: 600; margin: 0; }
.line-head .lh-sub { font-size: 13px; color: var(--muted); }
.line-acts { margin-left: auto; display: flex; gap: 6px; }
.line.locked .line-badge { background: var(--control); color: var(--muted); }
.stops { list-style: none; margin: 0; padding: 0; position: relative; }
.stop { position: relative; }
.stop > button { display: flex; align-items: center; gap: 16px; width: 100%; min-height: 66px; padding: 10px 14px 10px 0; text-align: left; color: var(--ink); border-radius: 14px; transition: background .2s var(--ease-out), transform .12s var(--ease-press); }
.stop > button:hover { background: var(--surface); }
.stop > button:active { transform: scale(.995); }
.stop .rail { position: relative; width: 44px; align-self: stretch; flex-shrink: 0; margin: -10px 0; } /* düğmenin iç boşluğunu da kaplasın: hat duraklar arasında kesilmesin */
.stop .rail::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: var(--rule); }
.stop:first-child .rail::before { top: 50%; }
.stop:last-child .rail::before { bottom: 50%; }
.stop .rail::after { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: var(--lv); transform-origin: top; transform: scaleY(var(--fill, 0)); transition: transform .5s var(--ease-out) var(--d, 0ms); }
.stop:first-child .rail::after { top: 50%; }
.stop:last-child .rail::after { bottom: 50%; }
.stop.done .rail { --fill: 1; }
.stop.current .rail { --fill: .5; }
.stop.current .rail::after { bottom: 50%; transform: scaleY(1); }
.stop.current:first-child .rail::after { display: none; }
.stop .dot { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--ground); border: 3px solid var(--control); z-index: 1; transition: transform .3s var(--ease-out); }
.stop.done .dot { background: var(--lv); border-color: var(--lv); }
.stop.current .dot { width: 24px; height: 24px; margin: -12px 0 0 -12px; border: 6px solid var(--lv); background: var(--ground); }
.stop.end .dot { width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 6px; border: 4px solid var(--ink); }
.stop.end.done .dot { background: var(--ink); }
.stop .st-name { flex: 1; min-width: 0; }
.stop .st-t { font-size: 16px; font-weight: 500; line-height: 1.3; }
.stop .st-de { font-size: 13px; color: var(--muted); margin-top: 2px; }
.stop .st-meta { font-size: 13px; color: var(--muted); white-space: nowrap; text-align: right; }
.stop.current .st-meta { color: var(--lvd); font-weight: 600; }
.stop.current > button { background: var(--surface); }
.stop.locked .st-t, .stop.locked .st-de { color: var(--faint); }
.stop.locked > button { cursor: default; }
.halt { display: inline-block; font-size: 12px; font-weight: 600; color: #fff; background: var(--lv); border-radius: 6px; padding: 3px 8px; margin-top: 6px; }
.dark .halt { color: #0d0d0c; }
.line.drawn .stop .rail::after { transition: none; }

/* ---------- Ders ekranı ---------- */
#lesson { background: var(--ground); }
#lesson::before { display: none; }
.ls-top { padding-top: calc(14px + env(safe-area-inset-top)); }
#lesson .progress { height: 6px; background: var(--surface-2); border: 0; box-shadow: none; }
#lesson .progress > div { background: var(--lv); box-shadow: none; }
.ls-kind { font-size: 13px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--lvd); }
.ls-q { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: clamp(28px, 5vw, 40px); line-height: 1.15; letter-spacing: -.01em; }
.ls-q .muted { font-family: 'Instrument Sans', sans-serif; font-size: .55em; }
#lesson .opt, #gameArea .opt, .opt { background: var(--raised); border: 1px solid var(--border); border-radius: 16px; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; font-weight: 500; font-size: 17px; min-height: 58px;
  transition: transform .12s var(--ease-press), border-color .18s var(--ease-out), background-color .18s var(--ease-out); }
#lesson .opt:hover, #gameArea .opt:hover { border-color: var(--control); }
#lesson .opt:active, #gameArea .opt:active { transform: scale(.985); }
#lesson .opt.sel, #gameArea .opt.sel { border-color: var(--ink); background: var(--raised); box-shadow: inset 0 0 0 1px var(--ink); }
#lesson .opt.ok, #gameArea .opt.ok { border-color: var(--positive); background: var(--pos-bg); box-shadow: inset 0 0 0 1px var(--positive); animation: okPop .32s var(--ease-out); }
#lesson .opt.bad, #gameArea .opt.bad { border-color: var(--negative); background: var(--neg-bg); box-shadow: inset 0 0 0 1px var(--negative); animation: badShake .3s var(--ease-out); }
.opt .k { border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 12px; }
.tok { background: var(--raised); border: 1px solid var(--border); border-radius: 12px; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; font-weight: 500; font-size: 17px; transition: transform .12s var(--ease-press), border-color .18s; }
.tok:active { transform: scale(.96); }
.tok.sel { box-shadow: inset 0 0 0 1px var(--ink); border-color: var(--ink); }
.tok.ok { border-color: var(--positive); background: var(--pos-bg); box-shadow: none; }
.tok.bad { border-color: var(--negative); background: var(--neg-bg); box-shadow: none; }
.answer-line { border-bottom: 1px solid var(--border); }
.ls-foot { background: var(--ground); -webkit-backdrop-filter: none; backdrop-filter: none; border-top: 1px solid var(--rule); box-shadow: none; }
.ls-foot.ok, .ls-foot.bad { animation: footIn .28s var(--ease-out); }
.ls-foot.ok { background: var(--pos-bg); border-top-color: transparent; }
.ls-foot.bad { background: var(--neg-bg); border-top-color: transparent; }
.fb-title { font-family: 'Instrument Sans', sans-serif; font-size: 18px; font-weight: 600; }
.ls-foot.ok .fb-title, .dark .ls-foot.ok .fb-title { color: var(--positive); }
.ls-foot.bad .fb-title, .dark .ls-foot.bad .fb-title { color: var(--negative); }
.dark .ls-foot.ok .fb-title { color: #7cc982; } .dark .ls-foot.bad .fb-title { color: #f08a7f; }
.fb-text { font-weight: 400; font-size: 15px; }
.ai-box { background: var(--raised); border: 1px solid var(--border); border-radius: 14px; box-shadow: none; font-weight: 400; }
@keyframes okPop { 40% { transform: scale(1.015); } }
@keyframes badShake { 20% { transform: translateX(-5px); } 45% { transform: translateX(4px); } 70% { transform: translateX(-2px); } }
@keyframes footIn { from { transform: translateY(14px); opacity: .4; } }

/* ---------- Kartlar, tablolar, mesajlar ---------- */
.flash-f { background: var(--surface); border: 0; border-radius: 24px; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
.flash-b { background: var(--lv); border-radius: 24px; box-shadow: none; }
.flash .big { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 40px; }
.flash-in { transition: transform .5s var(--ease-out); }
.box-col { background: var(--surface); border: 0; border-radius: 16px; box-shadow: none; }
.box-col b { font-family: 'Instrument Sans', sans-serif; font-weight: 400; font-size: 30px; }
#app .ex, .sheet .ex, .guide .ex { background: var(--surface); border: 0; border-radius: 14px; box-shadow: none; font-weight: 500; }
.guide .tip { background: var(--warn-bg); border-left: 3px solid var(--warning); border-radius: 10px; font-weight: 500; }
.guide p, .guide ul { font-weight: 400; }
.guide h4 { font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 16px; }
#app table.gt, .sheet table.gt { border: 1px solid var(--border); border-radius: 14px; box-shadow: none; }
#app table.gt th, .sheet table.gt th { background: var(--surface); color: var(--ink); font-weight: 600; border-bottom: 1px solid var(--border); }
#app table.gt td, .sheet table.gt td, #app table.gt tr:nth-child(even) td, .sheet table.gt tr:nth-child(even) td { background: var(--raised); font-weight: 400; border-top: 1px solid var(--rule); }
.msg { font-weight: 400; border-radius: 18px; }
.msg.me { background: var(--ink); color: var(--ground); box-shadow: none; }
.msg.ai { background: var(--surface); border: 0; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
.story-s { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 24px; line-height: 1.55; }
.story-w:hover { background: var(--accent-soft); }

#sidebar { background: var(--ground); border-right: 1px solid var(--rule); padding: 30px 14px 18px; }
.brand { padding: 0 8px 26px; }
.brand-logo { border-radius: 11px; background: var(--accent); color: var(--accent-ink); font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 21px; }
.brand b { font-family: var(--serif); font-weight: 500; font-size: 19px; letter-spacing: -.01em; }
.brand small { font-family: var(--sans); }
#sideNav .nav-item { height: 44px; border-radius: 12px; font-weight: 500; color: var(--muted); }
#sideNav .nav-item i { color: var(--faint); }
#sideNav .nav-item:hover { background: var(--surface-2); color: var(--ink); }
#sideNav .nav-item.active, .dark #sideNav .nav-item.active { background: var(--accent-soft); color: var(--accd); font-weight: 600; }
#sideNav .nav-item.active i { color: var(--accd); }
.side-prof:hover { background: var(--surface-2); }
#main { padding: 36px 44px 120px; }
.page-title { font-family: var(--serif); font-weight: 400; font-size: 30px; letter-spacing: -.015em; }
.page-sub { font-size: 15.5px; line-height: 1.55; }
.icon-btn { background: var(--surface); border: 1px solid var(--rule); }
.icon-btn:hover { background: var(--surface-2); }
@media (max-width: 960px) {
  #main { padding: 0 16px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom)); }
  #topbar, .dark #topbar { background: color-mix(in srgb, var(--ground) 94%, transparent); border-bottom: 1px solid var(--rule); }
  #topbar .page-title { font-family: var(--serif); font-size: 21px; font-weight: 400; }
  #bottomNav, .dark #bottomNav { background: var(--ground) !important; border-top: 1px solid var(--rule); }
  .bn-item { font-weight: 600; font-size: 11px; color: var(--faint); position: relative; }
  .bn-item.active, .dark .bn-item.active { color: var(--accd); }
  .bn-item::before { content: ''; position: absolute; top: 0; left: 50%; width: 22px; height: 3px; margin-left: -11px; border-radius: 0 0 3px 3px; background: var(--accent); transform: scaleX(0); transition: transform .24s var(--ease-out); }
  .bn-item.active::before { transform: scaleX(1); }
}

/* ---------- Düğmeler: koyu mürekkep dolgu ---------- */
.btn, .btn-red, .btn-ghost { font-family: var(--sans); font-weight: 600; font-size: 15px; letter-spacing: -.005em; min-height: 44px; padding: 11px 20px; }
.btn { background: var(--lvd, var(--accent)); color: var(--btn-ink); }
.dark .btn { color: var(--btn-ink); }
.btn:hover { filter: brightness(1.08); }
.btn-ghost { background: var(--surface-2); color: var(--ink); }
.dark .btn-ghost { background: var(--surface-2); color: var(--ink); }
.btn-ghost:hover { background: var(--control); }
.btn-sm { min-height: 36px; padding: 7px 14px; font-size: 14px; }
.btn-red { background: var(--negative); color: #fff; }
.dark .btn-red { color: #1a0d0a; }

/* ---------- Rozet, çip, çubuk: açık kutu + aynı tonun mürekkebi ---------- */
.lvl-badge { background: var(--lvs, var(--accent-soft)); color: var(--lvd, var(--accd)); border-radius: 7px; font-weight: 700; letter-spacing: .03em; }
.dark .lvl-badge { color: var(--lvd, var(--accd)); }
.chip { background: var(--surface-2); color: var(--ink); font-weight: 600; }
.bar { height: 6px; background: var(--surface-2); }
.bar > div { background: var(--lv, var(--accent)); border-radius: 999px; }
.tabs { background: var(--surface-2); }
.tab { font-weight: 600; }
.tab.active { background: var(--raised); color: var(--ink); }
.pill-input, #app .pill-input, .sheet .pill-input, #lesson .pill-input, #tutorPanel .pill-input, #gate .pill-input { border-radius: 12px; border-color: var(--border); background: var(--raised); }
.section-title { font-size: 15px; }

/* ---------- Pencereler ---------- */
.overlay { background: rgba(22,24,20,.38); }
.sheet { border-radius: 24px; border: 1px solid var(--rule); box-shadow: 0 34px 90px -36px rgba(22,24,20,.45); }
.sheet-head h3 { font-family: var(--serif); font-weight: 500; font-size: 21px; letter-spacing: -.01em; }
.toast { border-radius: 14px; font-weight: 600; }

/* ---------- Ana sayfa: karşılama + koleksiyon etiketi ---------- */
.greet-row { align-items: stretch; margin: 6px 0 36px; gap: 32px; }
.greet { font-family: var(--serif); font-weight: 400; font-size: clamp(42px, 6vw, 74px); line-height: 1; letter-spacing: -.025em; font-variation-settings: 'SOFT' 100, 'WONK' 1, 'opsz' 144; }
.greet em { font-style: italic; color: var(--accd); }
.greet-sub { font-size: 17px; margin-top: 16px; }
.greet-act { margin-top: 24px; }
.label-card { flex: 0 0 300px; align-self: flex-start; background: var(--raised); border: 1px solid var(--border); border-radius: 6px; padding: 16px 18px 14px; position: relative; }
.dark .label-card { background: var(--surface); }
.label-card::before { content: ''; position: absolute; inset: 5px; border: 1px solid var(--rule); border-radius: 3px; pointer-events: none; }
.lc-top { display: flex; justify-content: space-between; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.lc-genus { font-family: var(--serif); font-style: italic; font-size: 26px; line-height: 1.1; margin: 12px 0 2px; color: var(--lvd); }
.lc-cap { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.lc-dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 13.5px; }
.lc-dl dt { color: var(--faint); }
.lc-dl dd { margin: 0; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lc-stem { display: flex; gap: 3px; margin-top: 12px; }
.lc-stem i { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-2); }
.lc-stem i.on { background: var(--lv); }
.ledger { grid-column: span 12; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius-card); }
.ledger > div { padding: 18px 22px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ledger > div + div { border-left: 1px solid var(--rule); }
.lg-lab { font-size: 13px; color: var(--muted); }
.lg-val { font-family: var(--serif); font-size: 40px; line-height: 1.05; letter-spacing: -.02em; font-variant-numeric: lining-nums tabular-nums; }
.lg-val small { font-family: var(--sans); font-size: 14px; color: var(--muted); margin-left: 5px; letter-spacing: 0; }
.lg-cap { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.idiom-de { font-family: var(--serif); font-style: italic; font-size: 28px; line-height: 1.15; }
.quote-mark { font-family: var(--serif); font-size: 54px; line-height: .6; color: var(--accent); opacity: .5; height: 22px; }
@media (max-width: 960px) {
  .greet-row { flex-direction: column; gap: 22px; margin-bottom: 24px; }
  .greet { font-size: 44px; }
  .label-card { flex: none; width: 100%; box-sizing: border-box; }
  .ledger { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ledger > div:nth-child(3) { border-left: 0; }
  .ledger > div:nth-child(n+3) { border-top: 1px solid var(--rule); }
  .ledger > div { padding: 14px 16px; }
  .lg-val { font-size: 32px; }
}

/* ---------- İmza: Herbaryum (öğrenme yolu = yaprak koleksiyonu) ---------- */
.mappe { margin-bottom: 44px; }
.mp-head { display: flex; align-items: flex-end; gap: 18px; padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
.mp-id { font-family: var(--serif); font-size: 64px; line-height: .85; letter-spacing: -.03em; color: var(--lvd); font-variation-settings: 'opsz' 144; }
.mp-t { min-width: 0; }
.mp-t h2 { font-family: var(--serif); font-weight: 400; font-size: 24px; letter-spacing: -.01em; margin: 0; }
.mp-t .mp-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
.mp-prog { display: flex; gap: 3px; margin-top: 8px; max-width: 220px; }
.mp-prog i { flex: 1; height: 3px; border-radius: 2px; background: var(--surface-2); }
.mp-prog i.on { background: var(--lv); }
.mp-acts { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.mappe.locked .mp-id { color: var(--control); }
.specs { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 12px; }
.spec > button { position: relative; display: flex; flex-direction: column; align-items: flex-start; width: 100%; height: 100%; min-height: 168px; padding: 14px 16px 14px; text-align: left; color: var(--ink); background: var(--raised); border: 1px solid var(--border); border-radius: 16px; transition: transform .14s var(--ease-press), border-color .2s var(--ease-out), background-color .2s var(--ease-out); }
.dark .spec > button { background: var(--surface); }
.spec > button:hover { border-color: var(--control); }
.spec > button:active { transform: scale(.98); }
.sp-no { font-size: 11.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); font-variant-numeric: tabular-nums; }
.sp-de { font-family: var(--serif); font-size: 21px; line-height: 1.15; letter-spacing: -.01em; margin-top: 10px; overflow-wrap: break-word; -webkit-hyphens: auto; hyphens: auto; }
.empty-leaf { display: block; width: 72px; height: 72px; margin: 4px auto 8px; }
.empty-leaf path { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; }
.empty-leaf .vein { fill: none; }
.report-tile i { color: var(--faint) !important; font-size: 15px !important; }
.sp-t { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.35; }
.sp-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; margin-top: auto; padding-top: 14px; }
.sp-st { font-size: 12.5px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.leaf { width: 26px; height: 26px; flex-shrink: 0; }
.leaf path { fill: var(--lv); fill-opacity: 0; stroke: var(--control); stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; transition: fill-opacity .5s var(--ease-out) var(--d, 0ms), stroke .3s var(--ease-out) var(--d, 0ms); }
.leaf .vein { fill: none; }
.spec.done .leaf path { fill-opacity: 1; stroke: var(--lv); }
.spec.done .leaf .vein { stroke: var(--raised); }
.dark .spec.done .leaf .vein { stroke: var(--surface); }
.spec.done .sp-st { color: var(--lvd); }
.spec.current > button { background: var(--lvs); border-color: transparent; }
.spec.current .sp-no, .spec.current .sp-st { color: var(--lvd); }
.spec.current .leaf path { stroke: var(--lvd); fill-opacity: .18; }
.spec.current .sp-de { color: var(--lvd); }
.spec.locked > button { background: transparent; border-style: dashed; cursor: default; }
.spec.locked .sp-de, .spec.locked .sp-t { color: var(--faint); }
.spec.locked > button:active { transform: none; }
.spec.exam { grid-column: 1 / -1; }
.spec.exam > button { min-height: 0; flex-direction: row; align-items: center; gap: 18px; padding: 16px 18px; }
.spec.exam .sp-main { flex: 1; min-width: 0; }
.spec.exam .sp-de { margin-top: 4px; }
.spec.exam .seal { width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--control); display: inline-flex; align-items: center; justify-content: center; color: var(--faint); flex-shrink: 0; font-size: 16px; }
.spec.exam.done .seal { background: var(--lvd); border-color: var(--lvd); color: var(--btn-ink); }
.spec.exam.open .seal, .spec.exam.current .seal { border-color: var(--lvd); color: var(--lvd); }
.sp-next { display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--btn-ink); background: var(--lvd); border-radius: 6px; padding: 3px 8px; }
.mappe.prep .spec.done .leaf path { fill-opacity: 0; stroke: var(--control); }
.mappe.drawn .leaf path { transition: none; }
@media (max-width: 960px) {
  .mp-head { flex-wrap: wrap; gap: 12px 16px; }
  .mp-id { font-size: 52px; }
  .mp-acts { margin-left: 0; width: 100%; justify-content: flex-start; }
  .specs { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .spec > button { min-height: 156px; padding: 12px 13px; }
  .sp-de { font-size: 18px; }
}

/* ---------- Tekrar kutusu: büyüme aşamaları ---------- */
.box-grid .box-col { background: var(--surface) !important; border: 1px solid var(--rule); border-radius: 16px; padding: 14px 8px 12px; }
.box-grid .box-col .lvl-badge { background: var(--stage) !important; color: var(--stage-ink) !important; }
.box-grid .box-col b { font-family: var(--serif); font-weight: 400; font-size: 34px; margin-top: 6px; }
.box-grid .box-col:nth-child(1) { --stage: var(--st1); --stage-ink: var(--ink); }
.box-grid .box-col:nth-child(2) { --stage: var(--st2); --stage-ink: var(--ink); }
.box-grid .box-col:nth-child(3) { --stage: var(--st3); --stage-ink: #10190f; }
.box-grid .box-col:nth-child(4) { --stage: var(--st4); --stage-ink: #fff; }
.box-grid .box-col:nth-child(5) { --stage: var(--st5); --stage-ink: #fff; }
.dark .box-grid .box-col:nth-child(3), .dark .box-grid .box-col:nth-child(4) { --stage-ink: var(--ink); }
.dark .box-grid .box-col:nth-child(5) { --stage-ink: #10190f; }

/* ---------- Grafikler (dataviz: tek seri, tek ton, ince çubuk, üzerine gelince değer) ---------- */
.hm-0 { background: var(--surface-2); } .hm-1 { background: var(--st2); } .hm-2 { background: var(--st3); } .hm-3 { background: var(--st4); } .hm-4 { background: var(--st5); }
.hm i { border-radius: 3px; }
.wk7 { position: relative; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; height: 190px; padding-top: 22px; }
.wk7::after { content: ''; position: absolute; left: 0; right: 0; bottom: 24px; height: 1px; background: var(--border); }
.wk7-c { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 0; height: 100%; padding-bottom: 24px; outline: none; }
.wk7-c .b { width: 60%; max-width: 30px; min-height: 2px; border-radius: 4px 4px 0 0; background: var(--st3); transform-origin: bottom; transition: transform .6s var(--ease-out), background-color .2s; }
.wk7-c.now .b { background: var(--accent); }
.wk7-c .d { position: absolute; bottom: 0; font-size: 12px; color: var(--muted); }
.wk7-c.now .d { color: var(--ink); font-weight: 600; }
.wk7-c .v { font-size: 12px; font-weight: 600; color: var(--ink); margin-bottom: 4px; font-variant-numeric: tabular-nums; }
.wk7-c .tip { position: absolute; left: 50%; bottom: calc(100% - 18px); transform: translate(-50%, 4px); opacity: 0; pointer-events: none; white-space: nowrap; background: var(--ink); color: var(--ground); font-size: 12px; font-weight: 500; padding: 6px 9px; border-radius: 8px; transition: opacity .15s, transform .15s var(--ease-out); z-index: 2; }
.wk7-c:hover .tip, .wk7-c:focus-visible .tip { opacity: 1; transform: translate(-50%, 0); }
.wk7-c:hover .b { filter: brightness(.92); }
.ready-bar > div { background: var(--accent); }

/* ---------- Ders ekranı ---------- */
.ls-q { font-family: var(--serif); font-weight: 400; letter-spacing: -.015em; }
.ls-q .muted { font-family: var(--sans); }
.ls-kind { font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: 12px; }
#lesson .opt, #gameArea .opt, .opt { font-family: var(--sans); font-weight: 600; border-radius: 16px; }
#lesson .opt.sel, #gameArea .opt.sel { border-color: var(--lvd, var(--ink)); box-shadow: inset 0 0 0 1px var(--lvd, var(--ink)); background: var(--lvs, var(--raised)); }
.tok { font-family: var(--sans); font-weight: 600; }
.fb-title { font-family: var(--serif); font-weight: 500; font-size: 21px; }
.flash .big, .story-s, .sh-sent, .ctx-mask, .ctx-full, .br-pairs .opt { font-family: var(--serif); }
.flash-b { background: var(--lvs); color: var(--lvd); }
.msg.me { background: var(--accent); color: var(--accent-ink); }
.mic-btn { background: var(--accent); color: var(--accent-ink); }
#tutorFab { background: var(--accent); color: var(--accent-ink); }
.badge:not(.locked) .b-ic { background: var(--accent-soft) !important; color: var(--accd) !important; }
.tour-ic { background: var(--accent-soft); color: var(--accd); }
.remed { background: var(--accent-soft); }

/* ---------- PDF ve sertifika: aynı kâğıt ---------- */
html .pdf-doc { font-family: 'Manrope', sans-serif; color: #1c1e1a; }
html .pdf-ed .pdf-h1, .cert2-title, .cert2-name, .cert2-mark { font-family: 'Fraunces', Georgia, serif; }
html .pdf-ed .pdf-badge { background: var(--lvs, #e4f0e7); color: var(--lvd, #1f5c35); }
html .pdf-ed h2 { font-family: 'Manrope', sans-serif; }
.cert2 { font-family: 'Manrope', sans-serif; background: #fdfcf9; }
.cert2-mark { background: #2f5d46; font-style: italic; }
.cert2-badge { background: var(--lvs, #e4f0e7); color: var(--lvd, #1f5c35); }

/* ---------- Hareket: Jakub (birincil), Emil (sık dokunuşlar kısa) ---------- */
.enter { animation: enterUp .44s var(--ease-out) both; animation-delay: var(--ed, 0ms); }
@keyframes enterUp { from { opacity: 0; transform: translateY(10px); filter: blur(3px); } }
@media (prefers-reduced-motion: reduce) {
  .leaf path, .wk7-c .b, .wk7-c .tip, .bn-item::before { transition: none !important; }
}
html.dys .greet, html.dys .sp-de, html.dys .mp-t h2, html.dys .lg-val, html.dys .lc-genus, html.dys .page-title { font-family: 'Atkinson Hyperlegible', sans-serif !important; font-style: normal; }
.brand-logo .df-mark, .cert2-mark .df-mark { width: 100%; height: 100%; display: block; }
.cert2-mark { color: #f6f4ee; }
/* =====================================================================
   TELEFON: SADE DÜZEN
   design-taste app-screens §12: başlık tek satır, işlemler ⋯ menüsünde; sayılar 3 dar sütun;
   aynı bilgi iki kez gösterilmez; kutu içinde kutu yok, listeler tek yüzeyde çizgiyle ayrılır.
   ui-ux-pro-max: 44px dokunma alanı, uzun metin kısaltılır, gruplu listeler.
   ===================================================================== */
.greet-m, .next-m, .mp-lock { display: none; }
.hub-g + .hub-g { margin-top: 28px; }
.hub-h { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .01em; margin: 0 0 10px 2px; }
@media (max-width: 960px) {
  .m-hide { display: none !important; }
  /* üst çubuk: tek satır */
  #topbar, .dark #topbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: nowrap; gap: 8px; }
  #topbar > div:first-child { flex: 1; min-width: 0; }
  #topbar .page-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tb-row { flex-wrap: nowrap !important; gap: 2px !important; flex-shrink: 0; }
  .tb-row .stat-pill[title="Seviye"] { display: none; }
  .page-sub { font-size: 14.5px; margin-bottom: 18px; }

  /* ana sayfa */
  .home .greet-row { margin: 10px 0 22px; gap: 16px; }
  .home .greet { font-size: 40px; }
  .label-card, .home .greet-sub { display: none; }
  .greet-m { display: block; font-size: 14.5px; color: var(--muted); margin: 10px 0 0; }
  .next-m { display: block; margin-top: 20px; padding: 18px 18px 16px; border-radius: 20px; background: var(--lvs); }
  .nm-top { display: flex; justify-content: space-between; }
  .nm-top .smallcaps { color: var(--lvd); opacity: .85; }
  .nm-de { font-family: var(--serif); font-size: 27px; line-height: 1.12; letter-spacing: -.015em; color: var(--lvd); margin-top: 10px; -webkit-hyphens: auto; hyphens: auto; }
  .nm-t { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .next-m .lc-stem i { background: color-mix(in srgb, var(--lvd) 14%, transparent); }
  .next-m .lc-stem i.on { background: var(--lvd); }
  .home .greet-act { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .home .greet-act .btn { width: 100%; padding-left: 10px; padding-right: 10px; white-space: nowrap; }
  .home .greet-act .btn:nth-child(3) { grid-column: 1 / -1; }
  .home .grid12 { gap: 28px; }
  .ledger { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ledger > div { padding: 12px 14px; border-top: 0 !important; }
  .ledger > div:nth-child(3) { border-left: 1px solid var(--rule); }
  .lg-val { font-size: 28px; }
  .lg-val small { font-size: 12.5px; margin-left: 3px; }
  .lg-cap { display: none; }
  .home .panel { background: transparent; border: 0; padding: 0; border-radius: 0; }
  .home .panel-head { margin-bottom: 10px; padding: 0 2px; }
  .home .panel.s4 { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius-card); padding: 18px; }
  .home .panel.s4 .idiom-de { font-size: 24px; }
  .home .panel.s4 .quote-mark { display: none; }
  .home .q-line .q-t { width: 52%; }

  /* listeler: tek yüzey, satırlar ince çizgiyle */
  .hub, .home .panel.s8 { display: block; background: var(--raised); border: 1px solid var(--border) !important; border-radius: 18px !important; overflow: hidden; }

/* ---------- Pul ---------- */
.stp { position: relative; display: block; padding: 9px; background: var(--stamp-face);
  -webkit-mask: linear-gradient(#000 0 0) content-box, radial-gradient(circle, transparent 3.2px, #000 3.7px) -6px -6px / 12px 12px;
  -webkit-mask-composite: source-over; mask: linear-gradient(#000 0 0) content-box, radial-gradient(circle, transparent 3.2px, #000 3.7px) -6px -6px / 12px 12px; mask-composite: add; }
.stp-wrap, .album > li > button, .bm-card .stp-hold { filter: drop-shadow(0 0 .6px rgba(60, 20, 30, .45)) drop-shadow(0 3px 6px rgba(60, 20, 30, .07)); }
html.bm.dark .album > li > button, html.bm.dark .bm-card .stp-hold { filter: drop-shadow(0 0 .6px rgba(255, 220, 230, .35)); }
.stp-in { position: relative; z-index: 1; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; padding: 12px 12px 10px; border: 1px solid var(--track); background: var(--stamp-face); }

.stp-de { font-family: var(--serif); font-size: 17px; line-height: 1.2; color: var(--ink); margin-top: 12px; -webkit-hyphens: auto; hyphens: auto; overflow-wrap: break-word; }
.stp-tr { font-size: 12.5px; color: var(--muted); margin-top: 4px; line-height: 1.35; }
.stp-foot { margin-top: auto; padding-top: 12px; display: flex; justify-content: space-between; align-items: center; font: 600 10.5px/1 var(--sans); letter-spacing: .1em; color: var(--faint); text-transform: uppercase; }
.stp.done .stp-in { background: var(--accent-soft); border-color: var(--track); }
.stp.cur .stp-in { border: 1.5px solid var(--accent); }
.stp.cur .stp-foot { color: var(--accent); }
.stp.lock { opacity: 1; }
.stp.lock .stp-de, .stp.lock .stp-tr, .stp.lock .stp-foot { color: var(--faint); }
.album > li > button[aria-disabled="true"] { filter: drop-shadow(0 0 .6px rgba(60, 20, 30, .25)); }
.stp.lock .stp-in { border-style: dashed; border-color: var(--control); background: var(--stamp-face); }
.stp.lock .stp-val, .stp.lock .stp-top { color: var(--faint); }
.pmk { position: absolute; z-index: 2; right: -6px; bottom: 14px; width: 92px; height: 60px; pointer-events: none; transform: rotate(-12deg); opacity: .82; }
.pmk circle, .pmk path { fill: none; stroke: var(--accd); stroke-width: 1.4; }
.pmk text { fill: var(--accd); font: 700 11px var(--sans); letter-spacing: .04em; }
.album { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 16px; }
.album > li > button { position: relative; display: block; width: 100%; height: 100%; text-align: left; color: inherit; transition: transform .18s cubic-bezier(.3,.7,.4,1); }
.album > li > button:hover { transform: translateY(-2px) rotate(-.4deg); }
.album > li > button:active { transform: scale(.98); }

.album .stp { height: 100%; min-height: 200px; }
.album.prep .pmk { opacity: 0; transform: rotate(-30deg) scale(1.5); }
.album .pmk { transition: opacity .28s ease-out var(--d, 0ms), transform .34s cubic-bezier(.2, 1.4, .4, 1) var(--d, 0ms); }
.bm-pg { margin-bottom: 40px; }

  background-image: repeating-linear-gradient(-45deg, var(--accent) 0 10px, transparent 10px 20px, transparent 20px 20px); background-size: 100% 6px; background-repeat: no-repeat; background-position: 0 0; padding-top: 26px; }

/* =====================================================================
   AKIŞ TASARIMI (html.fx) — dikey akış: her ünite ekranı tek başına doldurur, sıradaki bir kaydırma ötede.
   Briefmarke'nin düz bileşen katmanının (html.bm) üstüne kurulur; renk, yazı, kabuk ve imza ekranlar yenidir.
   Seviyeler kendi renk alanında: A1 mercan, A2 mandalina, B1 güneş, B2 yeşil, C1 elektrik mavisi, C2 mor.
   ===================================================================== */
html.fx {
  --ground: #f4f4f7; --surface: #ffffff; --surface-2: #ececf2; --raised: #ffffff;
  --border: #e1e1ea; --rule: #e9e9f0; --control: #cdcdd9;
  --ink: #111118; --muted: #5a5a6b; --faint: #7e7e93;
  --accent: #111118; --accent-ink: #ffffff; --accent-soft: #ececf2; --accd: #111118;
  --track: #e1e1ea; --grey: #6b6b7c;
  --positive: #0b8a4c; --negative: #d4263c; --pos-bg: #e1f6e9; --neg-bg: #fde7ea;
  --btn-ink: #ffffff;
  --display: 'Bricolage Grotesque', 'Geist', system-ui, sans-serif;
  --sans: 'Geist', system-ui, -apple-system, sans-serif;
  --serif: var(--display);
  --mono: 'Geist Mono', ui-monospace, monospace;
  --a1: #e5372b; --a1d: #b0231a; --a1s: #fdecea;
  --a2: #e9660a; --a2d: #a94a05; --a2s: #fef0e3;
  --b1: #f2b200; --b1d: #7f5c00; --b1s: #fff5d6;
  --b2: #0d9b58; --b2d: #087040; --b2s: #e1f6e9;
  --c1: #2f5bff; --c1d: #1c3dcc; --c1s: #e8edff;
  --c2: #7b3ff2; --c2d: #5925c2; --c2s: #f0e9fe;
  --st1: #ececf2; --st2: #d9d9e4; --st3: #a9a9bd; --st4: #6b6b82; --st5: #111118;
  --fx-glass: rgba(250, 250, 252, .74);
  --fx-r: 22px;
  --ease-out: cubic-bezier(.22, 1, .36, 1);
}
html.fx.dark {
  --ground: #0e0e13; --surface: #17171e; --surface-2: #21212a; --raised: #17171e;
  --border: #2b2b36; --rule: #23232d; --control: #3a3a48;
  --ink: #f2f2f7; --muted: #a8a8ba; --faint: #80809a;
  --accent: #f2f2f7; --accent-ink: #111118; --accent-soft: #21212a; --accd: #f2f2f7;
  --track: #2b2b36; --positive: #4fd18b; --negative: #ff6b7d; --pos-bg: #10301e; --neg-bg: #3a141b;
  --btn-ink: #111118;
  --a1: #e5372b; --a2: #e9660a; --b1: #f2b200; --b2: #0d9b58; --c1: #2f5bff; --c2: #7b3ff2;
  --a1d: #ff8f85; --a1s: #3a1714; --a2d: #ffb169; --a2s: #3a2410; --b1d: #ffd45a; --b1s: #362a08;
  --b2d: #5fe0a0; --b2s: #0f2e1f; --c1d: #9ab0ff; --c1s: #18224a; --c2d: #c2a3ff; --c2s: #271748;
  --st1: #21212a; --st2: #2b2b36; --st3: #4a4a5c; --st4: #8a8aa0; --st5: #f2f2f7;
  --fx-glass: rgba(20, 20, 27, .74);
}
html.fx.dark.oled { --ground: #000; --surface: #0d0d11; --surface-2: #17171d; --raised: #0d0d11; --border: #24242c; }
html.fx[data-accent] { --accent: #111118; --accd: #111118; --accent-soft: #ececf2; }
html.fx.dark[data-accent] { --accent: #f2f2f7; --accd: #f2f2f7; --accent-soft: #21212a; }

/* ---------- Yazı ---------- */
html.fx body { font-family: var(--sans); font-size: 15px; letter-spacing: -.004em; background: var(--ground); -webkit-font-smoothing: antialiased; }
html.fx h1, html.fx h2, html.fx h3, html.fx .font-display, html.fx .page-title { font-family: var(--display); font-weight: 700; letter-spacing: -.025em; font-optical-sizing: auto; }
html.fx .page-title { font-size: 30px; line-height: 1.05; }
html.fx .tabular, html.fx .stat-pill, html.fx .q-n { font-variant-numeric: tabular-nums; }
html.fx ::selection { background: var(--c1); color: #fff; }
html.fx :focus-visible { outline: 2px solid var(--c1); outline-offset: 2px; }
html.fx body { caret-color: var(--c1); }
html.fx * { scrollbar-width: thin; scrollbar-color: var(--control) transparent; }

/* ---------- Yüzeyler ve kontroller ---------- */
html.fx .glass, html.fx .panel, html.fx .k-tile { border-radius: var(--fx-r); border-color: var(--border); box-shadow: 0 1px 2px rgba(17, 17, 24, .04); }

html.fx .row-card.hot .rc-end { color: var(--c1d); }
html.fx .panel-head h2 { font-family: var(--display); font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
html.fx .btn, html.fx .btn-red, html.fx .btn-ghost { font-family: var(--sans); font-weight: 600; border-radius: 14px; min-height: 46px; font-size: 15px; transition: transform .14s var(--ease-out), background-color .2s; }
html.fx .btn:active { transform: scale(.97); }
html.fx .btn-sm { min-height: 36px; border-radius: 11px; font-size: 13.5px; }
html.fx .btn.btn-ghost, html.fx .btn-ghost, html.fx.dark .btn-ghost { background: var(--surface-2); color: var(--ink); }
html.fx .btn-ghost:hover { background: var(--border); }
html.fx .tabs { background: var(--surface-2); border-radius: 14px; padding: 4px; }
html.fx .tab { border-radius: 10px; font-weight: 600; }
html.fx .tab.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(17, 17, 24, .1); }
html.fx .chip { background: var(--surface-2); color: var(--ink); border-radius: 99px; font-weight: 600; }
html.fx .lvl-badge { background: var(--lv, var(--ink)); color: #fff; border-radius: 8px; font-family: var(--display); font-weight: 700; }
html.fx .bar { background: var(--track); border-radius: 99px; }
html.fx .bar > div { background: var(--lv, var(--ink)); border-radius: 99px; }
html.fx .pill-input, html.fx #app .pill-input, html.fx .sheet .pill-input, html.fx #lesson .pill-input, html.fx #tutorPanel .pill-input { border-radius: 14px; }
html.fx .pill-input:focus { border-color: var(--c1); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c1) 22%, transparent); }
html.fx .icon-btn { border-radius: 12px; }
html.fx .sheet { border-radius: 26px; }

html.fx #lesson .opt { border-radius: 16px; }
html.fx #lesson .opt.sel { border-color: var(--lv); box-shadow: inset 0 0 0 1px var(--lv); background: var(--lvs, var(--surface)); }
html.fx #lesson .progress > div { background: var(--lv); }
html.fx #lesson .ls-kind { color: var(--lvd); }
html.fx #lesson .hl, html.fx .ls-q .hl { background: var(--lvs); color: var(--lvd); box-shadow: inset 0 -2px 0 var(--lv); border-radius: 6px; }

/* ---------- Kabuk ---------- */
@media (min-width: 961px) {
  html.fx #app { grid-template-columns: 232px minmax(0, 1fr); }
  html.fx #sidebar { background: var(--ground); border-right: 1px solid var(--rule); padding: 26px 14px 16px; }
  html.fx .brand b { font-family: var(--display); font-weight: 700; font-size: 19px; letter-spacing: -.02em; }
  html.fx .brand-logo { background: var(--ink); color: var(--ground); border-radius: 12px; }

  html.fx #sideNav .nav-item.active, html.fx.dark #sideNav .nav-item.active { background: var(--ink); color: var(--ground); box-shadow: none; }

}
