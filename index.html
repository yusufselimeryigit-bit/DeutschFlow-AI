<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DeutschFlow AI</title>
<meta name="description" content="A1'den C2'ye oyunlaştırılmış, yapay zeka destekli Almanca öğrenme uygulaması">
<meta name="theme-color" content="#58CC02">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.tailwindcss.com/3.4.3"></script>
<script>tailwind.config = { darkMode: 'class', corePlugins: { preflight: false } };</script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
/* ============ TASARIM DEĞİŞKENLERİ ============ */
:root {
  --bg: #F3F6FB; --bg2: #FFFFFF; --card: rgba(255,255,255,.74); --card2: rgba(255,255,255,.92);
  --stroke: rgba(15,23,42,.08); --text: #0F172A; --muted: #64748B; --soft: rgba(15,23,42,.05);
  --a1: #58CC02; --a1d: #46A302; --a2: #1CB0F6; --a2d: #1899D6; --b1: #A560F0; --b1d: #8549BA;
  --b2: #FF9600; --b2d: #CC7800; --c1: #FFC800; --c1d: #D9A800; --c2: #E5A400; --c2d: #B8860B;
  --red: #FF4B4B; --redd: #D33131; --green: #58CC02; --greend: #46A302;
  --acc: var(--a1); --accd: var(--a1d);
  --lv: var(--acc); --lvd: var(--accd);
  --shadow: 0 12px 34px -14px rgba(15,23,42,.22); --r: 22px;
  --nav-h: 74px;
}
.dark {
  --bg: #0A0F1F; --bg2: #111833; --card: rgba(22,29,56,.68); --card2: rgba(26,34,64,.94);
  --stroke: rgba(255,255,255,.08); --text: #E8ECF8; --muted: #94A3B8; --soft: rgba(255,255,255,.06);
  --shadow: 0 14px 40px -16px rgba(0,0,0,.6);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body { font-family: 'Nunito', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; transition: background .3s, color .3s; }
body::before { content: ''; position: fixed; inset: -20%; z-index: -1; pointer-events: none;
  background: radial-gradient(40% 35% at 12% 10%, rgba(88,204,2,.18), transparent 70%), radial-gradient(35% 30% at 88% 18%, rgba(28,176,246,.16), transparent 70%), radial-gradient(40% 40% at 70% 90%, rgba(165,96,240,.14), transparent 70%); }
h1, h2, h3, .font-display { font-family: 'Outfit', 'Nunito', sans-serif; letter-spacing: -.01em; margin: 0; }
button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
input, textarea, select { font-family: inherit; color: var(--text); }
a { color: inherit; }
::selection { background: rgba(88,204,2,.3); }

/* ============ CAM KARTLAR ============ */
.glass { background: var(--card); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); border: 1px solid var(--stroke); border-radius: var(--r); box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.35); }
.dark .glass { box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.05); }
.card { padding: 20px; }
.muted { color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; font-weight: 800; font-size: 13px; background: var(--soft); }
.lvl-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 38px; height: 26px; padding: 0 10px; border-radius: 999px; font-weight: 900; font-size: 13px; color: #fff; background: var(--lv); }
.pill-input { width: 100%; padding: 13px 16px; border-radius: 16px; border: 2px solid var(--stroke); background: var(--card2); font-size: 16px; outline: none; transition: border-color .2s; }
.pill-input:focus { border-color: var(--lv); }
textarea.pill-input { resize: vertical; min-height: 90px; }

/* ============ DUOLINGO TARZI 3D DÜĞMELER ============ */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 20px; border-radius: 16px; font-weight: 900; font-size: 15px; letter-spacing: .01em; background: var(--lv); color: #fff; box-shadow: 0 4px 0 var(--lvd); transition: transform .08s, box-shadow .08s, filter .2s; user-select: none; }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--lvd); }
.btn:disabled { filter: grayscale(.9) opacity(.55); cursor: not-allowed; transform: none; }
.btn-ghost { background: var(--card2); color: var(--text); box-shadow: 0 4px 0 var(--stroke), inset 0 0 0 2px var(--stroke); }
.btn-ghost:active { box-shadow: inset 0 0 0 2px var(--stroke); }
.btn-red { background: var(--red); box-shadow: 0 4px 0 var(--redd); }
.btn-sm { padding: 8px 14px; font-size: 13px; border-radius: 12px; }
.btn-block { width: 100%; }
.icon-btn { width: 42px; height: 42px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; background: var(--soft); transition: transform .15s, background .2s; }
.icon-btn:hover { background: var(--stroke); }
.icon-btn:active { transform: scale(.9); }
.press { transition: transform .12s cubic-bezier(.34,1.56,.64,1); }
.press:active { transform: scale(.95); }

/* ============ DÜZEN ============ */
#app { display: grid; grid-template-columns: 270px 1fr; min-height: 100vh; }
#sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 22px 14px; border-right: 1px solid var(--stroke); background: var(--card); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
.brand-logo { width: 42px; height: 42px; border-radius: 13px; background: linear-gradient(135deg, var(--acc), var(--a2)); display: flex; align-items: center; justify-content: center; color: #fff; font-family: 'Outfit'; font-weight: 800; font-size: 20px; box-shadow: 0 6px 16px -6px rgba(88,204,2,.7); }
.brand b { font-family: 'Outfit'; font-size: 21px; }
.brand small { display: block; font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: .12em; }
.nav-group { font-size: 11px; font-weight: 900; letter-spacing: .14em; color: var(--muted); padding: 14px 12px 6px; text-transform: uppercase; }
.nav-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; font-weight: 800; font-size: 15px; color: var(--text); text-align: left; transition: background .2s, color .2s; }
.nav-item i { width: 22px; text-align: center; font-size: 17px; color: var(--muted); }
.nav-item:hover { background: var(--soft); }
.nav-item.active { background: color-mix(in srgb, var(--acc) 15%, transparent); color: var(--accd); }
.nav-item.active i { color: var(--acc); }
.dark .nav-item.active { color: color-mix(in srgb, var(--acc) 62%, #fff); }
#main { padding: 26px 28px 120px; max-width: 1180px; width: 100%; margin: 0 auto; }
#topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
.stat-pill { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px; font-weight: 900; font-size: 15px; background: var(--card); border: 1px solid var(--stroke); }
#bottomNav { display: none; }
.conj-grid { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
@media (max-width: 760px) { .conj-grid { grid-template-columns: 1fr; } }
.grid-2 > *, .grid-3 > *, .grid-4 > *, .conj-grid > *, .box-grid > * { min-width: 0; }
.verb-row b { flex-shrink: 0; }
.verb-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.box-grid { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 12px; }
@media (max-width: 620px) { .box-grid { grid-template-columns: repeat(3, minmax(0,1fr)); } }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; }
.stack > * + * { margin-top: 16px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.page-title { font-size: 30px; font-weight: 800; }
.page-sub { color: var(--muted); font-weight: 700; margin: 4px 0 20px; }
.section-title { font-size: 19px; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
.ro-banner { display: none; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 14px; margin-bottom: 16px; font-weight: 800; background: rgba(28,176,246,.14); color: var(--a2d); }
body.readonly .ro-banner { display: flex; }

@media (max-width: 960px) {
  #app { grid-template-columns: 1fr; }
  #sidebar { display: none; }
  #main { padding: 16px 16px calc(var(--nav-h) + 90px + env(safe-area-inset-bottom)); }
  #topbar { padding-top: env(safe-area-inset-top); }
  #bottomNav { display: flex; position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); height: var(--nav-h); z-index: 60; justify-content: space-around; align-items: center; padding: 0 6px; border-radius: 26px; }
  .bn-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 900; color: var(--muted); padding: 8px 0; border-radius: 18px; }
  .bn-item i { font-size: 20px; }
  .bn-item.active { color: var(--acc); }
  .grid-3, .grid-4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .page-title { font-size: 25px; }
}
@media (max-width: 620px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } .grid-4 { grid-template-columns: repeat(2, minmax(0,1fr)); } }

/* ============ ÖĞRENME YOLU (DUOLINGO PATİKASI) ============ */
.level-block { margin-bottom: 34px; }
.level-head { display: flex; align-items: center; gap: 14px; padding: 18px 20px; border-radius: 22px; color: #fff; background: var(--lv); box-shadow: 0 6px 0 var(--lvd); margin-bottom: 26px; }
.level-head h2 { font-size: 22px; }
.level-head p { margin: 2px 0 0; font-weight: 700; opacity: .9; font-size: 14px; }
.level-head .lh-ic { width: 52px; height: 52px; border-radius: 16px; background: rgba(255,255,255,.22); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
.level-head.locked { filter: grayscale(.85) opacity(.7); }
.path { display: flex; flex-direction: column; align-items: center; gap: 22px; }
.node-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.node { position: relative; width: 76px; height: 76px; border-radius: 50%; background: var(--lv); color: #fff; font-size: 28px; display: flex; align-items: center; justify-content: center; box-shadow: 0 7px 0 var(--lvd), 0 12px 24px -10px var(--lv); transition: transform .12s; }
.node:active { transform: translateY(6px); box-shadow: 0 1px 0 var(--lvd); }
.node.locked { background: #CBD5E1; box-shadow: 0 7px 0 #94A3B8; color: #F8FAFC; cursor: not-allowed; }
.dark .node.locked { background: #334155; box-shadow: 0 7px 0 #1E293B; color: #64748B; }
.node.done::after { content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900; position: absolute; right: -4px; top: -4px; width: 28px; height: 28px; border-radius: 50%; background: #FFC800; color: #fff; font-size: 13px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 #D9A800; }
.node.current { animation: nodePulse 1.8s ease-in-out infinite; }
@keyframes nodePulse { 0%,100% { box-shadow: 0 7px 0 var(--lvd), 0 0 0 0 color-mix(in srgb, var(--lv) 55%, transparent); } 50% { box-shadow: 0 7px 0 var(--lvd), 0 0 0 14px transparent; } }
.node.boss { width: 92px; height: 92px; border-radius: 28px; font-size: 34px; }
.node-label { font-weight: 800; font-size: 14px; max-width: 170px; text-align: center; }

/* ============ MODAL / SHEET ============ */
.overlay { position: fixed; inset: 0; z-index: 350; background: rgba(2,6,23,.5); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 16px; animation: fadeIn .2s ease; }
.sheet { width: 100%; max-width: 720px; max-height: 92vh; overflow-y: auto; background: var(--card2); border-radius: 28px; border: 1px solid var(--stroke); box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); animation: sheetIn .35s cubic-bezier(.22,1,.36,1); }
.sheet-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 20px; background: var(--card2); border-bottom: 1px solid var(--stroke); }
.sheet-body { padding: 20px; }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes sheetIn { from { opacity: 0; transform: translateY(30px) scale(.97); } }
.tabs { display: flex; gap: 6px; padding: 4px; border-radius: 16px; background: var(--soft); margin-bottom: 16px; overflow-x: auto; }
.tab { flex: 1; white-space: nowrap; padding: 9px 14px; border-radius: 12px; font-weight: 800; font-size: 14px; color: var(--muted); }
.tab.active { background: var(--card2); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,.08); }

/* ============ DERS / ETKİNLİK MOTORU ============ */
#lesson { position: fixed; inset: 0; z-index: 120; background: var(--bg); display: flex; flex-direction: column; }
.ls-top { display: flex; align-items: center; gap: 14px; padding: calc(14px + env(safe-area-inset-top)) 20px 14px; max-width: 900px; width: 100%; margin: 0 auto; }
.progress { flex: 1; height: 16px; border-radius: 999px; background: var(--soft); overflow: hidden; }
.progress > div { height: 100%; border-radius: 999px; background: var(--lv); box-shadow: inset 0 -4px 0 rgba(0,0,0,.12), inset 0 4px 0 rgba(255,255,255,.25); transition: width .5s cubic-bezier(.22,1,.36,1); }
.ls-body { flex: 1; overflow-y: auto; padding: 10px 20px 30px; max-width: 760px; width: 100%; margin: 0 auto; }
.ls-kind { font-weight: 900; font-size: 13px; letter-spacing: .1em; color: var(--lv); text-transform: uppercase; margin-bottom: 8px; }
.ls-q { font-family: 'Outfit'; font-size: 26px; font-weight: 700; margin: 0 0 22px; line-height: 1.3; }
.opt { width: 100%; text-align: left; padding: 16px 18px; border-radius: 18px; border: 2px solid var(--stroke); background: var(--card2); font-weight: 800; font-size: 17px; box-shadow: 0 4px 0 var(--stroke); margin-bottom: 12px; transition: transform .08s, border-color .15s, background .15s; display: flex; align-items: center; gap: 12px; }
.opt:active { transform: translateY(3px); box-shadow: none; }
.opt .k { width: 30px; height: 30px; border-radius: 10px; border: 2px solid var(--stroke); display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--muted); flex-shrink: 0; }
.opt.sel { border-color: var(--a2); background: rgba(28,176,246,.1); box-shadow: 0 4px 0 var(--a2d); }
.opt.ok { border-color: var(--green); background: rgba(88,204,2,.12); }
.opt.bad { border-color: var(--red); background: rgba(255,75,75,.1); }
.tf-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tf-row .opt { justify-content: center; font-size: 19px; }
.bank, .answer-line { display: flex; flex-wrap: wrap; gap: 10px; min-height: 58px; padding: 10px; border-radius: 18px; }
.answer-line { border-bottom: 2px solid var(--stroke); border-radius: 0; margin-bottom: 18px; }
.tok { padding: 10px 15px; border-radius: 14px; border: 2px solid var(--stroke); background: var(--card2); font-weight: 800; font-size: 17px; box-shadow: 0 3px 0 var(--stroke); }
.tok.used { visibility: hidden; }
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.match-grid .opt { justify-content: center; text-align: center; margin: 0; }
.match-grid .opt.gone { opacity: .25; pointer-events: none; border-color: var(--green); }
.ls-foot { border-top: 2px solid var(--stroke); padding: 18px 20px calc(18px + env(safe-area-inset-bottom)); background: var(--bg); transition: background .2s; }
.ls-foot-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.ls-foot.ok { background: rgba(88,204,2,.14); }
.ls-foot.bad { background: rgba(255,75,75,.12); }
.fb-title { font-family: 'Outfit'; font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
.ls-foot.ok .fb-title { color: var(--greend); }
.ls-foot.bad .fb-title { color: var(--redd); }
.dark .ls-foot.ok .fb-title { color: #8EE04A; }
.dark .ls-foot.bad .fb-title { color: #FF8080; }
.fb-text { font-weight: 700; margin-top: 4px; max-width: 520px; }
.ai-box { margin-top: 10px; padding: 12px 14px; border-radius: 14px; background: var(--card2); border: 1px solid var(--stroke); font-weight: 600; font-size: 15px; line-height: 1.5; max-width: 560px; }
.diff span { padding: 1px 2px; border-radius: 4px; }
.diff .d-ok { color: var(--greend); }
.diff .d-bad { background: rgba(255,75,75,.22); color: var(--redd); text-decoration: line-through; }
.diff .d-miss { background: rgba(255,200,0,.3); color: #B45309; }
.dark .diff .d-ok { color: #8EE04A; } .dark .diff .d-bad { color: #FF8080; } .dark .diff .d-miss { color: #FFD666; }

/* ============ GRAMMATIK KARTLARI / TABLOLAR ============ */
.guide h4 { font-family: 'Outfit'; font-size: 18px; margin: 18px 0 8px; }
.guide p { line-height: 1.6; font-weight: 600; margin: 8px 0; }
.guide ul { margin: 8px 0; padding-left: 20px; line-height: 1.7; font-weight: 600; }
.guide .tip { padding: 12px 14px; border-radius: 14px; background: rgba(255,200,0,.14); border-left: 4px solid #FFC800; font-weight: 700; margin: 12px 0; }
.guide .ex { padding: 10px 14px; border-radius: 14px; background: var(--soft); margin: 8px 0; font-weight: 700; }
.guide .ex i { color: var(--muted); font-style: normal; font-weight: 600; display: block; font-size: 14px; }
table.gt { width: 100%; border-collapse: separate; border-spacing: 0; margin: 10px 0; border-radius: 14px; overflow: hidden; border: 1px solid var(--stroke); font-size: 15px; }
table.gt th { background: var(--lv); color: #fff; padding: 9px 12px; text-align: left; font-weight: 900; }
table.gt td { padding: 9px 12px; border-top: 1px solid var(--stroke); font-weight: 700; background: var(--card2); }
table.gt tr:nth-child(even) td { background: var(--soft); }
.hl-m { color: #1C7FD6; font-weight: 900; } .hl-f { color: #E0365F; font-weight: 900; } .hl-n { color: #2E9E2E; font-weight: 900; } .hl-p { color: #A560F0; font-weight: 900; } .hl { background: rgba(255,200,0,.35); border-radius: 4px; padding: 0 3px; }
.dark .hl-m { color: #6CB8FF; } .dark .hl-f { color: #FF7A9C; } .dark .hl-n { color: #6FDB6F; }
.tbl-wrap { overflow-x: auto; }

/* ============ KARTLAR / ÇEŞİTLİ ============ */
.quest { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
.quest + .quest { border-top: 1px solid var(--stroke); }
.quest .q-ic { width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; flex-shrink: 0; }
.bar { height: 12px; border-radius: 999px; background: var(--soft); overflow: hidden; }
.bar > div { height: 100%; border-radius: 999px; background: var(--lv); transition: width .6s cubic-bezier(.22,1,.36,1); }
.idiom { background: linear-gradient(135deg, #FF9600, #FFC800); color: #fff; border: 0; }
.idiom .muted { color: rgba(255,255,255,.85); }
.flash { perspective: 1200px; height: 230px; cursor: pointer; }
.flash-in { position: relative; width: 100%; height: 100%; transition: transform .6s cubic-bezier(.22,1,.36,1); transform-style: preserve-3d; }
.flash.flip .flash-in { transform: rotateY(180deg); }
.flash-f, .flash-b { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
.flash-f { background: var(--card2); border: 2px solid var(--stroke); box-shadow: 0 6px 0 var(--stroke); }
.flash-b { background: var(--lv); color: #fff; transform: rotateY(180deg); box-shadow: 0 6px 0 var(--lvd); }
.flash .big { font-family: 'Outfit'; font-size: 32px; font-weight: 800; }
.box-col { text-align: center; padding: 14px 6px; border-radius: 18px; background: var(--soft); }
.box-col b { display: block; font-family: 'Outfit'; font-size: 28px; }
.story-w { cursor: pointer; border-radius: 6px; padding: 0 1px; transition: background .15s; }
.story-w:hover { background: rgba(28,176,246,.18); }
.story-s { font-size: 20px; line-height: 1.8; font-weight: 700; margin: 0 0 6px; }
.story-tr { font-size: 15px; color: var(--muted); font-weight: 700; margin: 0 0 16px; display: none; }
.show-tr .story-tr { display: block; }

<script>
/* =====================================================================

{ id: 'A1', name: 'Anfänger', tr: 'Başlangıç', ic: 'fa-seedling', color: 'a1', units: [

  { id: 'a1u2', t: 'Artikel: der, die, das', ic: 'fa-tag', g: `
    <p>Almancada her ismin bir cinsiyeti (Genus) vardır ve isim bir <b>artikel</b> ile öğrenilir.</p>

    s: [['Das ist meine Mutter.', 'Bu benim annem.'], ['Mein Bruder heißt Tom.', 'Erkek kardeşimin adı Tom.'], ['Das Kind spielt im Garten.', 'Çocuk bahçede oynuyor.']],
    q: [['mc', '___ Mädchen', ['der', 'die', 'das'], 2, '-chen ile biten isimler daima “das” alır.'],
        ['mc', '___ Schwester', ['der', 'die', 'das'], 1, 'die Schwester (dişil).'],
        ['tf', 'Nominativ\'de çoğul isimlerin artikeli her zaman “die”dir.', true, 'Çoğulda cinsiyet fark etmez: die Kinder, die Väter.'],

  { id: 'a1u3', t: 'Personalpronomen, sein & haben', ic: 'fa-user', g: `
    <div class="tbl-wrap"><table class="gt"><tr><th>Zamir</th><th>Türkçe</th><th>sein (olmak)</th><th>haben (sahip olmak)</th></tr>
    <tr><td>ich</td><td>ben</td><td>bin</td><td>habe</td></tr>
    <tr><td>du</td><td>sen</td><td>bist</td><td>hast</td></tr>
    <tr><td>er / sie / es</td><td>o (eril/dişil/nötr)</td><td>ist</td><td>hat</td></tr>
    <tr><td>wir</td><td>biz</td><td>sind</td><td>haben</td></tr>
    <tr><td>ihr</td><td>siz (samimi)</td><td>seid</td><td>habt</td></tr>
    <tr><td>sie / Sie</td><td>onlar / Siz (resmi)</td><td>sind</td><td>haben</td></tr></table></div>
    <div class="tip">💡 Büyük harfle <b>Sie</b> = resmi “Siz”. Küçük <b>sie</b> = “o (dişil)” veya “onlar”. Fiil çekiminden anlarsın: sie ist (o) / sie sind (onlar).</div>
    <div class="ex">Ich bin müde, aber ich habe Zeit.<i>Yorgunum ama vaktim var.</i></div>`,
    v: [['ich', 'ben'], ['du', 'sen'], ['er', 'o (eril)'], ['wir', 'biz'], ['ihr', 'siz'], ['müde', 'yorgun'], ['glücklich', 'mutlu'], ['der Hund', 'köpek']],
    s: [['Ich bin Student.', 'Ben öğrenciyim.'], ['Wir haben einen Hund.', 'Bir köpeğimiz var.'], ['Bist du müde?', 'Yorgun musun?']],
    q: [['fill', 'Du ___ sehr nett. (sein)', 'bist', 'du → bist.'],
        ['fill', 'Er ___ ein Auto. (haben)', 'hat', 'er/sie/es → hat.'],
        ['mc', 'Wir ___ aus der Türkei.', ['ist', 'sind', 'seid'], 1, 'wir → sind.'],
        ['tf', 'Büyük harfle yazılan “Sie” resmi “Siz” anlamına gelir.', true, 'Doğru: Sie sind sehr freundlich. (Çok naziksiniz.)']] },
  { id: 'a1u4', t: 'Präsens & Essen', ic: 'fa-utensils', g: `
    <p>Şimdiki/geniş zaman: <b>fiil kökü + çekim eki</b>. Örnek: lern-en → lern-</p>
    <div class="tbl-wrap"><table class="gt"><tr><th>Kişi</th><th>Ek</th><th>lernen</th><th>arbeiten</th><th>essen ⚡</th></tr>
    <tr><td>ich</td><td>-e</td><td>lerne</td><td>arbeite</td><td>esse</td></tr>
    <tr><td>du</td><td>-st</td><td>lernst</td><td>arbeit<span class="hl">e</span>st</td><td><span class="hl">isst</span></td></tr>
    <tr><td>er/sie/es</td><td>-t</td><td>lernt</td><td>arbeit<span class="hl">e</span>t</td><td><span class="hl">isst</span></td></tr>
    <tr><td>wir</td><td>-en</td><td>lernen</td><td>arbeiten</td><td>essen</td></tr>
    <tr><td>ihr</td><td>-t</td><td>lernt</td><td>arbeitet</td><td>esst</td></tr>
    <tr><td>sie/Sie</td><td>-en</td><td>lernen</td><td>arbeiten</td><td>essen</td></tr></table></div>
    <div class="tip">💡 Kökü -t / -d ile bitenler du/er/ihr'de araya <b>e</b> alır. Bazı güçlü fiiller du/er'de ünlü değiştirir: essen → isst, lesen → liest, fahren → fährt, sehen → sieht.</div>
    <div class="ex">Ich esse gern Brot mit Käse.<i>Peynirli ekmek yemeyi severim.</i></div>`,
    v: [['das Brot', 'ekmek'], ['der Apfel', 'elma'], ['das Wasser', 'su'], ['der Kaffee', 'kahve'], ['die Milch', 'süt'], ['essen', 'yemek yemek'], ['trinken', 'içmek'], ['kochen', 'yemek pişirmek']],
    s: [['Ich trinke gern Kaffee.', 'Kahve içmeyi severim.'], ['Wir essen heute Brot und Käse.', 'Bugün ekmek ve peynir yiyoruz.'], ['Was kochst du heute?', 'Bugün ne pişiriyorsun?']],
    q: [['fill', 'Du ___ Deutsch. (lernen)', 'lernst', 'du → -st: lernst.'],
        ['fill', 'Er ___ einen Apfel. (essen)', 'isst', 'essen düzensizdir: er isst.'],
        ['mc', 'Ihr ___ Wasser.', ['trinkt', 'trinken', 'trinkst'], 0, 'ihr → -t: trinkt.'],
        ['tf', '“arbeiten” fiili “du” ile “du arbeitst” olur.', false, 'Kök -t ile bittiği için araya e girer: du arbeitest.']] },
  { id: 'a1u5', t: 'Nominativ & Akkusativ', ic: 'fa-arrows-left-right', g: `
    <p><b>Nominativ</b> = özne (kim/ne?). <b>Akkusativ</b> = doğrudan nesne (kimi/neyi?). Değişen yalnızca <span class="hl-m">eril</span> artikeldir!</p>
    <div class="tbl-wrap"><table class="gt"><tr><th></th><th>Eril</th><th>Dişil</th><th>Nötr</th><th>Çoğul</th></tr>
    <tr><td>Nominativ</td><td>der / ein</td><td>die / eine</td><td>das / ein</td><td>die / –</td></tr>
    <tr><td>Akkusativ</td><td class="hl-m">den / einen</td><td>die / eine</td><td>das / ein</td><td>die / –</td></tr></table></div>
    <div class="ex"><span class="hl-m">Der</span> Mann kauft <span class="hl-m">einen</span> Tisch.<i>Adam bir masa satın alıyor. (Mann = özne, Tisch = nesne)</i></div>
    <div class="tip">💡 Akkusativ alan fiiller: haben, kaufen, sehen, brauchen, essen, trinken, suchen, möchten…</div>`,
    v: [['der Tisch', 'masa'], ['der Stuhl', 'sandalye'], ['die Tasche', 'çanta'], ['das Buch', 'kitap'], ['kaufen', 'satın almak'], ['sehen', 'görmek'], ['brauchen', 'ihtiyaç duymak'], ['suchen', 'aramak']],
    s: [['Ich kaufe einen Tisch.', 'Bir masa satın alıyorum.'], ['Siehst du den Hund?', 'Köpeği görüyor musun?'], ['Wir brauchen das Buch.', 'Kitaba ihtiyacımız var.']],
    q: [['mc', 'Ich habe ___ Bruder.', ['ein', 'einen', 'eine'], 1, 'der Bruder → Akkusativ: einen Bruder.'],
        ['mc', 'Sie sieht ___ Mann.', ['der', 'den', 'dem'], 1, 'sehen + Akkusativ, eril → den.'],
        ['fill', 'Ich brauche ___ Stuhl. (ein)', 'einen', 'der Stuhl → einen Stuhl.'],
        ['tf', 'Akkusativ\'te dişil artikel (die) değişmez.', true, 'Sadece eril değişir: der → den.']] },
  { id: 'a1u6', t: 'W-Fragen & Negation', ic: 'fa-circle-question', g: `
    <div class="tbl-wrap"><table class="gt"><tr><th>Soru</th><th>Türkçe</th><th>Soru</th><th>Türkçe</th></tr>
    <tr><td>Wer?</td><td>Kim?</td><td>Wann?</td><td>Ne zaman?</td></tr>

    <p>W-sorularında fiil <b>2. sırada</b>: <i>Wo <b>wohnst</b> du?</i></p>
    <h4>Olumsuzluk: nicht / kein</h4>
    <ul><li><b>kein</b>: belirsiz (ein) veya artikelsiz isimleri olumsuz yapar → kein Auto, keine Zeit, keinen Hunger (Akk. eril).</li>
    <li><b>nicht</b>: fiil, sıfat, belirli isim ve cümlenin geri kalanını olumsuz yapar → Ich komme nicht. Das ist nicht mein Auto.</li></ul>`,
    v: [['wer', 'kim'], ['was', 'ne'], ['wo', 'nerede'], ['woher', 'nereden'], ['wann', 'ne zaman'], ['warum', 'neden'], ['nicht', 'değil'], ['kein', 'hiç / yok']],
    s: [['Woher kommst du?', 'Nerelisin?'], ['Ich habe keine Zeit.', 'Vaktim yok.'], ['Das ist nicht mein Auto.', 'Bu benim arabam değil.']],
    q: [['mc', '___ wohnst du? – In Berlin.', ['Wer', 'Wo', 'Was'], 1, 'Yer sorusu → Wo?'],
        ['mc', 'Ich habe ___ Hunger.', ['nicht', 'keinen', 'kein'], 1, 'der Hunger, Akkusativ eril → keinen.'],
        ['fill', 'Ich trinke ___ Kaffee. (olumsuz)', 'keinen', 'der Kaffee → Akk.: keinen Kaffee.'],
        ['tf', '“Wann” = “Nerede” demektir.', false, '“Wann” = ne zaman, “Wo” = nerede.']] }
]},

  { id: 'a2u1', t: 'Dativ', ic: 'fa-gift', g: `

    <tr><td>Nominativ</td><td>der / ein</td><td>die / eine</td><td>das / ein</td><td>die</td></tr>
    <tr><td>Dativ</td><td class="hl">dem / einem</td><td class="hl">der / einer</td><td class="hl">dem / einem</td><td class="hl">den + -n</td></tr></table></div>

    v: [['helfen', 'yardım etmek'], ['danken', 'teşekkür etmek'], ['gehören', 'ait olmak'], ['gefallen', 'hoşa gitmek'], ['der Freund', 'arkadaş'], ['die Kollegin', 'iş arkadaşı (kadın)'], ['mit', 'ile'], ['zu', '-e / -a (yön)']],
    s: [['Ich helfe meinem Freund.', 'Arkadaşıma yardım ediyorum.'], ['Das Buch gehört der Lehrerin.', 'Kitap öğretmene ait.'], ['Wir fahren mit dem Bus.', 'Otobüsle gidiyoruz.']],
    q: [['mc', 'Ich gehe zu ___ Arzt.', ['den', 'dem', 'der'], 1, 'zu + Dativ, der Arzt → dem (zum Arzt).'],

  { id: 'a2u2', t: 'Trennbare Verben & Tagesroutine', ic: 'fa-sun', g: `

    s: [['Ich stehe jeden Tag um sieben Uhr auf.', 'Her gün saat yedide kalkarım.'], ['Rufst du mich heute Abend an?', 'Bu akşam beni arar mısın?'], ['Am Samstag kaufen wir ein.', 'Cumartesi alışveriş yaparız.']],

  { id: 'a2u3', t: 'Modalverben', ic: 'fa-sliders', g: `
    <div class="tbl-wrap"><table class="gt"><tr><th></th><th>können</th><th>müssen</th><th>wollen</th><th>dürfen</th><th>sollen</th><th>möchten</th></tr>

  { id: 'a2u4', t: 'Perfekt', ic: 'fa-clock-rotate-left', g: `
    <p>Konuşmada geçmiş zaman: <b>haben / sein (çekimli) + Partizip II (sonda)</b>.</p>

    <tr><td>Düzenli</td><td>ge- + kök + -t</td><td>machen → <b>gemacht</b>, kaufen → gekauft</td></tr>
    <tr><td>Düzensiz</td><td>ge- + (değişen) kök + -en</td><td>essen → <b>gegessen</b>, sehen → gesehen</td></tr>

    <tr><td>-ieren</td><td>ge- yok</td><td>studieren → <b>studiert</b></td></tr></table></div>
    <div class="tip">💡 <b>sein</b> ile kurulanlar: yer değiştirme (gehen, fahren, kommen, fliegen) ve durum değişimi (aufwachen, sterben) + sein, bleiben, werden. Diğer hepsi <b>haben</b>.</div>
    <div class="ex">Ich <b>bin</b> nach Berlin <b>gefahren</b> und <b>habe</b> viel <b>gesehen</b>.<i>Berlin'e gittim ve çok şey gördüm.</i></div>`,
    v: [['gemacht', 'yaptı (machen)'], ['gegessen', 'yedi (essen)'], ['gegangen', 'gitti (gehen)'], ['gefahren', 'araçla gitti (fahren)'], ['gesehen', 'gördü (sehen)'], ['gekauft', 'satın aldı (kaufen)'], ['gestern', 'dün'], ['letzte Woche', 'geçen hafta']],
    s: [['Ich habe gestern Pizza gegessen.', 'Dün pizza yedim.'], ['Wir sind nach Hamburg gefahren.', 'Hamburg\'a gittik.'], ['Hast du den Film gesehen?', 'Filmi izledin mi?']],
    q: [['mc', 'Sie ___ nach Hause gegangen.', ['hat', 'ist', 'sind'], 1, 'gehen = hareket → sein: sie ist gegangen.'],

        ['tf', '“bleiben” Perfekt\'te “haben” ile kurulur.', false, 'bleiben → ist geblieben (sein).']] },
  { id: 'a2u5', t: 'Wechselpräpositionen & Wohnung', ic: 'fa-couch', g: `

  { id: 'a2u6', t: 'Einkaufen, Wetter & Komparativ', ic: 'fa-cloud-sun', g: `

function unitTab(btn, k) { btn.parentNode.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn)); document.querySelectorAll('[data-pane]').forEach(p => p.hidden = p.dataset.pane !== k); }
async function aiExplainUnit(id) {
  const { L, u } = findUnit(id), out = $('#aiUnitOut'); out.hidden = false; out.innerHTML = '<span class="typing"><i></i><i></i><i></i></span> Gemini düşünüyor…';
  try { out.innerHTML = md(await aiText(`“${u.t}” (Almanca: ${u.de}, ${L.id}) konusunu bir Türk öğrenciye çok anlaşılır şekilde, günlük hayattan 4 örnek cümleyle (Almanca + Türkçe) ve bir hafıza ipucuyla anlat. Sonunda 2 mini soru sor (cevapları en altta ver).`, tutorSys())); }
  catch (e) { out.innerHTML = aiErr(e); }
}
async function aiGenExercises(id) {
  if (!canEdit()) return;
  const { L, u } = findUnit(id), out = $('#aiUnitOut'); out.hidden = false; out.innerHTML = '<span class="typing"><i></i><i></i><i></i></span> Yeni alıştırmalar üretiliyor…';
  const prompt = `“${u.t}” (Almanca: ${u.de}, ${L.id} seviyesi) için 6 yeni alıştırma üret. SADECE JSON dizi döndür. Biçim:
[{"k":"mc","q":"soru (Türkçe veya Almanca)","o":["şık1","şık2","şık3"],"a":0,"e":"Türkçe kısa açıklama"},
 {"k":"fill","q":"boşluklu cümle ___ (ipucu)","a":["cevap"],"e":"açıklama"},
 {"k":"tf","q":"Türkçe ifade","a":true,"e":"açıklama"},
 {"k":"build","q":"Türkçe çeviri","a":"Doğru Almanca cümle."}]
2 mc, 2 fill, 1 tf, 1 build olsun. Almanca doğru ve seviyeye uygun olsun.`;
  try {
    const raw = await aiText(prompt, 'Sen Almanca alıştırma üreten bir motorsun. Sadece geçerli JSON döndür.', true);
    const arr = JSON.parse(raw.replace(/^```(json)?|```$/g, '').trim());
    const items = arr.map(normalizeAiItem).filter(Boolean).map(x => Object.assign(x, { unit: u.id }));
    if (!items.length) throw new Error('Geçerli alıştırma çıkmadı');
    closeModal(); startLesson(items, { title: 'AI Alıştırma · ' + u.t, color: L.color, kind: 'ai', pass: .6 });
  } catch (e) { out.innerHTML = aiErr(e); }
}
function normalizeAiItem(x) {
  if (!x || !x.k || !x.q) return null;
  if (x.k === 'mc' && Array.isArray(x.o) && x.o.length >= 2 && Number.isInteger(+x.a)) return { k: 'mc', q: x.q, o: x.o.map(String), a: +x.a, e: x.e || '', id: 'ai:' + hashStr(x.q) };
  if (x.k === 'fill' && x.a) return { k: 'fill', q: x.q, a: [].concat(x.a).map(String), e: x.e || '', id: 'ai:' + hashStr(x.q) };
  if (x.k === 'tf') return { k: 'tf', q: x.q, a: x.a === true || x.a === 'true', e: x.e || '', id: 'ai:' + hashStr(x.q) };
  if (x.k === 'build' && typeof x.a === 'string') return { k: 'build', q: x.q, a: x.a, id: 'ai:' + hashStr(x.a) };
  return null;
}

/* =====================================================================
   ETKİNLİK MOTORU (Exercise Engine)
   ===================================================================== */
function qItems(u) {
  return u.q.map((q, i) => {
    const id = u.id + ':q' + i;
    if (q[0] === 'mc') return { k: 'mc', q: q[1], o: q[2], a: q[3], e: q[4], id, unit: u.id };
    if (q[0] === 'fill') return { k: 'fill', q: q[1], a: [].concat(q[2]), e: q[3], id, unit: u.id };
    return { k: 'tf', q: q[1], a: q[2], e: q[3], id, unit: u.id };
  });
}
function buildUnitItems(u, L) {
  const lvVocab = L.units.flatMap(x => x.v), items = qItems(u);
  pick(u.v, 2).forEach(v => { const wrong = pick(lvVocab.filter(w => w[1] !== v[1]), 2).map(w => w[1]); const o = shuffle([v[1]].concat(wrong)); items.push({ k: 'mc', q: `“${v[0]}” ne demek?`, say: v[0], o, a: o.indexOf(v[1]), e: `${v[0]} = ${v[1]}`, id: u.id + ':v:' + v[0], unit: u.id, card: v }); });
  items.push({ k: 'match', pairs: pick(u.v, 4), id: u.id + ':match', unit: u.id });
  pick(u.s, 2).forEach(s => items.push({ k: 'build', q: s[1], a: s[0], id: u.id + ':b:' + hashStr(s[0]), unit: u.id }));
  const ds = u.s[Math.floor(Math.random() * u.s.length)]; items.push({ k: 'dict', a: ds[0], tr: ds[1], id: u.id + ':d:' + hashStr(ds[0]), unit: u.id });
  return shuffle(items);
}
function startUnit(id) { const { L, u } = findUnit(id); startLesson(buildUnitItems(u, L), { title: u.t, color: L.color, kind: 'unit', unitId: u.id, pass: .8 }); }
function startBoss(li) {
  const L = LEVELS[li], qs = shuffle(L.units.flatMap(qItems)).slice(0, 12);
  pick(L.units.flatMap(u => u.s.map(s => ({ s, u }))), 3).forEach(({ s, u }) => qs.push({ k: 'build', q: s[1], a: s[0], id: u.id + ':b:' + hashStr(s[0]), unit: u.id }));
  modal(`<div class="sheet-body" style="text-align:center;padding:32px 22px;${lvStyle(L.color)}"><div style="font-size:64px">🐉</div><h2 style="font-size:28px">${L.id} Seviye Sonu Sınavı</h2>
    <p class="muted" style="font-weight:800;font-size:16px">${qs.length} soru · Geçme barajı <b>%80</b><br>Geçersen ${LEVELS[li + 1] ? LEVELS[li + 1].id + ' seviyesinin kilidi açılır' : 'Almanca ustası olursun'}! +50 XP</p>
    <button class="btn" style="margin-top:12px" onclick="closeModal();startLesson(window.__boss,{title:'${L.id} Seviye Sonu Sınavı',color:'${L.color}',kind:'boss',levelId:'${L.id}',pass:.8})"><i class="fa-solid fa-dragon"></i> Başla</button></div>`, true, 460);
  window.__boss = shuffle(qs);
}
function placementPrompt() {
  if (!D || RO || D.placementDone || LSN || $('#modalRoot').innerHTML || PAGE !== 'home') return; // başka bir pencere/ders açıksa araya girme
  modal(`<div class="sheet-body" style="text-align:center;padding:32px 22px"><div style="font-size:60px">🧭</div><h2>Almancan ne seviyede?</h2>
  <p class="muted" style="font-weight:700">18 soruluk kısa bir test ile seviyeni bulalım. Bildiğin seviyeleri atlayabilirsin.</p>
  <div class="row" style="justify-content:center;margin-top:14px"><button class="btn" onclick="closeModal();startPlacement()">Teste başla</button><button class="btn btn-ghost" onclick="D.placementDone=true;save();closeModal()">Sıfırdan başla (A1)</button></div></div>`, true, 480);

function startPlacement() {
  if (!canEdit()) return;
  const items = LEVELS.flatMap((L, li) => pick(L.units.flatMap(qItems), 3).map(x => Object.assign({}, x, { lv: li })));
  startLesson(items, { title: 'Seviye Tespit Sınavı', color: 'a2', kind: 'placement', pass: 0, noShuffle: true });
}

let LSN = null;
function startLesson(items, opts) {
  if (!canEdit()) return; if (!items || !items.length) { toast('Etkinlik bulunamadı', 'warn'); return; }
  LSN = { items, opts, i: 0, correct: 0, results: [], t0: Date.now() };
  $('#lessonRoot').innerHTML = `<div id="lesson" style="${lvStyle(opts.color || 'a1')}"><div class="ls-top"><button class="icon-btn" onclick="quitLesson()"><i class="fa-solid fa-xmark"></i></button><div class="progress"><div id="lsBar" style="width:0%"></div></div><button class="icon-btn" title="Çiz" onclick="openDraw()"><i class="fa-solid fa-pen"></i></button><b id="lsCount" class="muted"></b></div><div class="ls-body" id="lsBody"></div><div class="ls-foot" id="lsFoot"></div></div>`;
  document.body.style.overflow = 'hidden'; renderItem();
}
function quitLesson(force) {
  if (!force && LSN && LSN.i > 0 && LSN.i < LSN.items.length && !confirm('Dersten çıkılsın mı? İlerleme kaydedilmez.')) return;
  LSN = null; $('#lessonRoot').innerHTML = ''; document.body.style.overflow = ''; window.speechSynthesis && speechSynthesis.cancel(); if (PAGE) go(PAGE);
}
const KIND_NAMES = { mc: 'Çoktan seçmeli', fill: 'Boşluk doldurma', tf: 'Doğru mu, yanlış mı?', build: 'Cümleyi kur', match: 'Eşleştir', dict: 'Dinle ve yaz' };
function renderItem() {
  const it = LSN.items[LSN.i]; LSN.sel = null; LSN.built = []; LSN.checked = false;
  $('#lsBar').style.width = (LSN.i / LSN.items.length * 100) + '%'; $('#lsCount').textContent = (LSN.i + 1) + '/' + LSN.items.length;
  let h = `<div class="ls-kind">${KIND_NAMES[it.k]}</div>`;

/* ---------- Verb-Konjugator ---------- */
const PERS = ['ich', 'du', 'er/sie/es', 'wir', 'ihr', 'sie/Sie'];
function conj(v) {
  const inf = v.i, stem = inf.endsWith('en') ? inf.slice(0, -2) : inf.slice(0, -1), needE = /[td]$/.test(stem) || /[^aeiouäöülrh][mn]$/.test(stem), sz = /[sßxz]$/.test(stem);
  const p = v.p || [stem + 'e', stem + (needE ? 'est' : sz ? 't' : 'st'), stem + (needE ? 'et' : 't'), inf, stem + (needE ? 'et' : 't'), inf];
  const base = stem + (needE ? 'ete' : 'te'), pr = v.pr || [base, base + 'st', base, base + 'n', base + 't', base + 'n'];
  const p2 = v.p2 || (/ieren$/.test(inf) ? stem + 't' : /^(be|ver|er|ent|emp|ge|zer|miss)/.test(inf) ? stem + (needE ? 'et' : 't') : 'ge' + stem + (needE ? 'et' : 't'));
  const aux = v.a === 'sein' ? ['bin', 'bist', 'ist', 'sind', 'seid', 'sind'] : ['habe', 'hast', 'hat', 'haben', 'habt', 'haben'];
  const K2 = { sein: 'wär', haben: 'hätt', werden: 'würd', können: 'könnt', müssen: 'müsst', wollen: 'wollt', dürfen: 'dürft', sollen: 'sollt', mögen: 'möcht', wissen: 'wüsst' };
  const k2 = K2[inf] ? ['e', 'est', 'e', 'en', 'et', 'en'].map(e => K2[inf] + e) : ['würde', 'würdest', 'würde', 'würden', 'würdet', 'würden'].map(w => w + ' ' + inf);
  const fut = ['werde', 'wirst', 'wird', 'werden', 'werdet', 'werden'].map(w => w + ' ' + inf);
  return { p, pr, perf: aux.map(a => a + ' ' + p2), fut, k2, p2, guess: !v.p && !v.pr && !v.p2 };
}

      ${v.custom || c.guess ? `<div class="tip" style="padding:10px 14px;border-radius:12px;background:rgba(255,200,0,.14);font-weight:700;margin:12px 0">⚠️ Kural tabanlı üretildi; düzensiz fiillerde farklı olabilir. <button class="btn btn-sm btn-ghost" data-w="${esc(v.i)}" onclick="aiConj(this.dataset.w)"><i class="fa-solid fa-robot"></i> AI ile doğrula</button></div><div id="aiConjOut"></div>` : ''}

// Çizim katmanı
let DRAW = null;
function openDraw(blank) {
  if ($('#drawLayer')) return;
  const layer = document.createElement('div'); layer.id = 'drawLayer';
  if (blank) layer.style.background = document.documentElement.classList.contains('dark') ? '#0F172A' : '#FFFFFF';
  layer.innerHTML = '<canvas id="drawCv"></canvas>';
  const bar = document.createElement('div'); bar.id = 'drawBar'; bar.className = 'glass';
  const cols = ['#0F172A', '#FF4B4B', '#1CB0F6', '#58CC02', '#FF9600', '#A560F0', '#FFC800', '#FFFFFF'];
  bar.innerHTML = cols.map((c, i) => `<button class="swatch ${i === (blank ? 0 : 1) ? 'on' : ''}" style="background:${c}" onclick="drawColor('${c}',this)"></button>`).join('') +
    `<input type="range" min="2" max="28" value="5" oninput="DRAW.w=+this.value" style="width:90px" title="Kalınlık"><button class="icon-btn" id="eraserBtn" title="Silgi" onclick="DRAW.erase=!DRAW.erase;this.classList.toggle('on',DRAW.erase)"><i class="fa-solid fa-eraser"></i></button><button class="icon-btn" title="Geri al" onclick="drawUndo()"><i class="fa-solid fa-rotate-left"></i></button><button class="icon-btn" title="Temizle" onclick="drawClear()"><i class="fa-solid fa-trash"></i></button><button class="btn btn-sm" onclick="drawSave()"><i class="fa-solid fa-floppy-disk"></i> Nota kaydet</button><button class="icon-btn" title="Kapat" onclick="closeDraw()"><i class="fa-solid fa-xmark"></i></button>`;
  document.body.append(layer, bar);
  const cv = $('#drawCv'), ctx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1;
  DRAW = { cv, ctx, color: cols[blank ? 0 : 1], w: 5, erase: false, stack: [], blank, down: false };
  const size = () => { const img = cv.width ? ctx.getImageData(0, 0, cv.width, cv.height) : null; cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.lineCap = ctx.lineJoin = 'round'; if (img) ctx.putImageData(img, 0, 0); };
  size(); DRAW.resize = size; addEventListener('resize', size);
  let last = null;
  cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); DRAW.down = true; last = [e.clientX, e.clientY]; DRAW.stack.push(ctx.getImageData(0, 0, cv.width, cv.height)); if (DRAW.stack.length > 25) DRAW.stack.shift(); dot(e); };
  cv.onpointermove = e => { if (!DRAW.down) return; const pts = e.getCoalescedEvents ? e.getCoalescedEvents() : [e]; pts.forEach(p => { line(last, [p.clientX, p.clientY], p.pressure); last = [p.clientX, p.clientY]; }); };
  cv.onpointerup = cv.onpointercancel = () => { DRAW.down = false; };
  const stroke = pr => { ctx.globalCompositeOperation = DRAW.erase ? 'destination-out' : 'source-over'; ctx.strokeStyle = ctx.fillStyle = DRAW.color; ctx.lineWidth = DRAW.erase ? DRAW.w * 4 : DRAW.w * (pr && pr !== .5 ? .5 + pr : 1); };
  const line = (a, b, pr) => { stroke(pr); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); };
  const dot = e => { stroke(e.pressure); ctx.beginPath(); ctx.arc(e.clientX, e.clientY, ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill(); };
}
function drawColor(c, el) { DRAW.color = c; DRAW.erase = false; $('#eraserBtn').classList.remove('on'); document.querySelectorAll('#drawBar .swatch').forEach(s => s.classList.toggle('on', s === el)); }
function drawUndo() { const s = DRAW.stack.pop(); if (s) DRAW.ctx.putImageData(s, 0, 0); }
function drawClear() { DRAW.stack.push(DRAW.ctx.getImageData(0, 0, DRAW.cv.width, DRAW.cv.height)); DRAW.ctx.clearRect(0, 0, DRAW.cv.width, DRAW.cv.height); }
function closeDraw() { removeEventListener('resize', DRAW && DRAW.resize); ['#drawLayer', '#drawBar'].forEach(s => { const e = $(s); e && e.remove(); }); DRAW = null; }
function drawSave() {

  const src = DRAW.cv, scale = Math.min(1, 1200 / src.width), out = document.createElement('canvas'); out.width = src.width * scale; out.height = src.height * scale;
  const o = out.getContext('2d'); o.fillStyle = DRAW.blank && document.documentElement.classList.contains('dark') ? '#0F172A' : '#FFFFFF'; o.fillRect(0, 0, out.width, out.height); o.drawImage(src, 0, 0, out.width, out.height);
  const img = out.toDataURL('image/jpeg', .8); closeDraw(); noteForm({ title: 'Çizim notu · ' + new Date().toLocaleDateString('tr-TR'), text: '', img });
}

VIEWS.focus = () => {

    <div class="row" style="justify-content:center;margin-top:16px"><button class="btn" onclick="pomoToggle()" id="pomoBtn"><i class="fa-solid ${POMO.running ? 'fa-pause' : 'fa-play'}"></i> ${POMO.running ? 'Duraklat' : 'Başlat'}</button><button class="btn btn-ghost" onclick="pomoReset()"><i class="fa-solid fa-rotate-left"></i></button><button class="btn btn-ghost" onclick="pomoDone(true)"><i class="fa-solid fa-forward"></i></button></div>

function pomoMode(m) { POMO.mode = m; POMO.left = POMO.len[m]; if (PAGE === 'focus') go('focus'); }
function pomoToggle() {

function buildDaily() {
  const items = [], now = Date.now(), li = currentLevelIdx(), L = LEVELS[li];
  const pool = D.cards.length >= 4 ? D.cards : allVocab().filter(v => LEVELS.findIndex(x => x.id === v.lv) <= li).map(v => ({ de: v.de, tr: v.tr }));
  const due = D.cards.filter(c => c.due <= now), cards = (due.length ? shuffle(due) : shuffle(pool)).slice(0, 4);
  cards.forEach(c => { const o = shuffle([c.tr].concat(pick(pool.filter(x => x.tr !== c.tr), 2).map(x => x.tr))); items.push({ k: 'mc', q: `“${c.de}” ne demek?`, say: c.de, o, a: o.indexOf(c.tr), e: `${c.de} = ${c.tr}`, id: 'daily:c:' + c.de, card: [c.de, c.tr], cardId: c.id, cat: 'kelime' }); });
  D.wrong.filter(w => w.item.k !== 'match').slice(0, 3).forEach(w => items.push(w.item));
  const nu = nextUnit(), u = nu && !nu.boss ? nu.u : pick(L.units, 1)[0];
  pick(qItems(u), 2).forEach(x => items.push(x));
  const s = pick(L.units.flatMap(x => x.s.map(y => ({ s: y, u: x }))), 2);
  if (s[0]) items.push({ k: 'build', q: s[0].s[1], a: s[0].s[0], id: s[0].u.id + ':b:' + hashStr(s[0].s[0]), unit: s[0].u.id });
  if (s[1]) items.push({ k: 'dict', a: s[1].s[0], tr: s[1].s[1], id: s[1].u.id + ':d:' + hashStr(s[1].s[0]), unit: s[1].u.id });
  const seen = new Set(); return shuffle(items.filter(x => !seen.has(x.id) && seen.add(x.id)));
}

};

/* ---------- 3) Sözlü Sınav (Goethe tarzı) ---------- */
let EX = null;

VIEWS.exam = () => EX ? examChat() : `<p class="page-sub">Goethe sınavı tarzında sözlü sınav. Yapay zeka sınav görevlisi olur, 3 bölümde seninle Almanca konuşur, sonunda 100 üzerinden puanlar.</p>
  <div class="grid-3">${EXAM_LV.map(lv => { const L = LEVELS.find(x => x.id === lv); return `<button class="glass card press" style="text-align:left;${lvStyle(L.color)}" onclick="startExam('${lv}')"><div class="between"><span class="lvl-badge" style="font-size:16px;height:30px">${lv}</span><i class="fa-solid fa-user-tie" style="color:var(--lv);font-size:22px"></i></div><h3 style="margin:12px 0 6px;font-size:19px">Goethe-Zertifikat ${lv} · Sprechen</h3>${EXAM_PARTS[lv].map((p, i) => `<div class="muted" style="font-weight:700;font-size:13px">Teil ${i + 1}: ${esc(p)}</div>`).join('')}</button>`; }).join('')}</div>
  ${D.exams.length ? `<div class="section-title" style="margin-top:22px"><i class="fa-solid fa-clock-rotate-left"></i> Geçmiş sınavlar</div><div class="stack">${D.exams.slice(0, 8).map(e => `<div class="glass card between" style="padding:14px 16px"><div><span class="lvl-badge">${e.lv}</span> <b>${e.puan}/100</b> ${e.gecti ? '<span style="color:var(--a1);font-weight:800">· geçti</span>' : '<span style="color:var(--red);font-weight:800">· geçemedi</span>'}</div><span class="muted" style="font-weight:700;font-size:13px">${new Date(e.ts).toLocaleString('tr-TR')}</span></div>`).join('')}</div>` : ''}`;
function examSys() { const p = EXAM_PARTS[EX.lv]; return `Du bist Prüfer/in in der mündlichen Prüfung „Goethe-Zertifikat ${EX.lv} – Sprechen". Der Kandidat ist ein türkischer Deutschlerner.
Führe die Prüfung in genau 3 Teilen durch: Teil 1: ${p[0]} · Teil 2: ${p[1]} · Teil 3: ${p[2]}.
Regeln: Sprich nur Deutsch, natürlich und kurz (max. 3 Sätze), passend zum Niveau ${EX.lv}. Beginne jeden neuen Teil mit der Markierung „【Teil N】" und erkläre kurz die Aufgabe (bei B1/B2/C1 gib ein konkretes Thema vor). Pro Teil stellst du 2–3 Fragen/Nachfragen und gehst dann zum nächsten Teil. Korrigiere während der Prüfung NICHT. Nach Teil 3 sage genau: „Vielen Dank, die Prüfung ist beendet."`; }
async function startExam(lv) {
  if (!canEdit()) return; EX = { lv, msgs: [], part: 1, tts: true, done: false }; go('exam');
  await examAsk([{ role: 'user', parts: [{ text: 'Bitte beginnen Sie die Prüfung.' }] }]);
}
async function examAsk(contents) {
  const box = $('#exMsgs'); if (box) { box.insertAdjacentHTML('beforeend', '<div class="msg ai typing"><i></i><i></i><i></i></div>'); box.scrollTop = box.scrollHeight; }
  try {
    const r = (await aiCall(contents, examSys())).trim(); EX.msgs.push({ role: 'model', text: r });
    const m = r.match(/【Teil\s*(\d)】/g); if (m) EX.part = +m[m.length - 1].match(/\d/)[0]; if (/Prüfung ist beendet/i.test(r)) EX.done = true;
    if (EX.tts) speak(r.replace(/【Teil\s*\d】/g, '').replace(/[*_#]/g, ''));
  } catch (e) { EX.msgs.push({ role: 'model', text: '⚠️ ' + e.message }); toast('AI hatası: ' + e.message, 'err'); }
  if (PAGE === 'exam') go('exam');
}

    <div class="row">${[1, 2, 3].map(n => `<span class="chip" style="${EX.part === n && !EX.done ? 'background:var(--lv);color:#fff' : EX.part > n || EX.done ? 'color:var(--a1)' : ''}">${EX.part > n || EX.done ? '✓ ' : ''}Teil ${n}</span>`).join('')}<label class="chip" style="cursor:pointer"><input type="checkbox" ${EX.tts ? 'checked' : ''} onchange="EX.tts=this.checked"> Sesli</label><button class="btn btn-sm ${EX.done ? '' : 'btn-ghost'}" onclick="gradeExam()"><i class="fa-solid fa-flag-checkered"></i> Bitir & puanla</button></div></div>
    <div class="muted" style="font-weight:700;margin-top:8px;font-size:14px">Teil ${EX.part}: ${esc(EXAM_PARTS[EX.lv][EX.part - 1] || '')} · Mikrofonla konuşabilir veya yazabilirsin.</div></div>
  <div class="glass card" style="padding:12px"><div class="msgs" id="exMsgs" style="height:min(50vh,500px)">${EX.msgs.map(m => rpMsgHtml({ role: m.role, text: m.text.replace(/【Teil\s*(\d)】/g, '▶ Teil $1 · ') })).join('')}</div>
  <div id="exGrade"></div>

AFTER.exam = () => { const m = $('#exMsgs'); if (m) m.scrollTop = m.scrollHeight; };
function examSend(t) {
  if (!EX || EX.done) return; const inp = $('#exIn'), text = (t || inp.value).trim(); if (!text) return; inp.value = '';

function examMic() { const b = $('#exMic'); if (rec) { rec.stop(); return; } b.style.background = 'var(--red)'; b.style.color = '#fff'; rec = listen('de-DE', t => examSend(t), () => { rec = null; const bb = $('#exMic'); if (bb) { bb.style.background = ''; bb.style.color = ''; } }); }

  const tr = EX.msgs.map(m => (m.role === 'user' ? 'KANDIDAT: ' : 'PRÜFER: ') + m.text).join('\n');
  try {
    const raw = await aiText(`Aşağıdaki Goethe ${EX.lv} sözlü sınav transkriptini resmi ölçütlere göre (görevi yerine getirme, akıcılık, kelime, dilbilgisi, telaffuz yerine yazım) değerlendir. Türkçe yaz. SADECE JSON döndür:
{"puan":0-100,"gecti":true/false,"bolumler":[{"bolum":"Teil 1","puan":0-100,"yorum":"..."}],"guclu":["..."],"gelisim":["..."],"duzeltmeler":[{"yanlis":"...","dogru":"..."}],"ornek_cumleler":["Almanca faydalı cümle — Türkçesi"]}
Geçme sınırı 60.\n\n${tr}`, 'Sen deneyimli bir Goethe-Institut sınav değerlendiricisisin. Sadece geçerli JSON döndür.', true);
    const g = JSON.parse(raw.replace(/^```(json)?|```$/g, '').trim()), puan = Math.max(0, Math.min(100, Math.round(+g.puan || 0)));

    (g.duzeltmeler || []).slice(0, 6).forEach(d => { if (d.yanlis && d.dogru) D.wrong.unshift({ id: 'exam:' + hashStr(d.yanlis), item: { k: 'fill', q: 'Düzelt: “' + d.yanlis + '”', a: [d.dogru], e: 'Sözlü sınavdan', id: 'exam:' + hashStr(d.yanlis), cat: 'yazma', unit: '' }, given: d.yanlis, ts: Date.now() }); });
    addXP(g.gecti ? 40 : 20); if (g.gecti) confettiBurst(true); checkBadges(); save();
    out.innerHTML = `<div class="glass card" style="margin-top:12px"><div class="between"><div class="fb-title" style="color:${g.gecti ? 'var(--a1)' : 'var(--red)'}">${g.gecti ? '🎉 Geçtin!' : '💪 Bu sefer olmadı'} · ${puan}/100</div><span class="lvl-badge">${EX.lv}</span></div>

      ${(g.gelisim || []).length ? `<h4 style="margin:14px 0 4px">🎯 Gelişim alanları</h4><ul style="margin:0;font-weight:600">${g.gelisim.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}

let GM = null;
function gamePool() {
  const li = currentLevelIdx(), seen = new Set();
  return D.cards.map(c => ({ de: c.de, tr: c.tr })).concat(allVocab().filter(v => LEVELS.findIndex(x => x.id === v.lv) <= li))

      if (SPOT_ARTS.includes(low)) alt = pick(SPOT_ARTS.filter(a => a !== low), 1)[0];

      else if (idx > 0 && /^[A-ZÄÖÜ][a-zäöüß]{2,}$/.test(core)) alt = core.toLowerCase();
      if (!alt || alt === core) continue;
      if (core[0] === core[0].toUpperCase() && idx === 0) alt = alt[0].toUpperCase() + alt.slice(1);
      const words = toks.slice(); words[idx] = alt + punct;
      return { k: 'spot', words, bad: idx, right: core + punct, wrongW: alt + punct, a: s[0], tr: s[1], e: `Hatalı: “${alt}” → doğrusu “${core}”`, id: u.id + ':spot:' + hashStr(s[0] + idx), unit: u.id };

function goalInfo() {
  const g = D.goal, ti = LEVELS.findIndex(L => L.id === g.lv), all = LEVELS.slice(0, ti + 1).flatMap((L, li) => L.units.map(u => ({ L, li, u })));
  const left = all.filter(x => D.done[x.u.id] == null), days = dayDiff(today(), g.date);
  const studyDays = Math.max(1, days > 21 ? days - 7 : days), perDay = left.length / studyDays;
  // Kalan üniteler çalışma günlerine eşit aralıklarla dağıtılır; ilk ünite bugüne düşer
  const sched = [], horizon = Math.min(Math.max(days, 1), 60);
  for (let d = 0; d < horizon; d++) sched.push({ date: new Date(Date.now() + d * DAY), units: [] });
  left.forEach((x, j) => { const d = Math.floor(j * studyDays / left.length); if (d < horizon) sched[d].units.push(x); });
  while (sched.length > 1 && !sched[sched.length - 1].units.length && sched.length > Math.min(days, 14)) sched.pop();
  const recent = Object.entries(D.days).filter(([k2]) => dayDiff(k2, today()) < 14).reduce((s, [, v]) => s + (v.lessons || 0), 0) / 14;
  return { all, left, days, perDay, sched, today: (sched[0] && sched[0].units) || [], pct: all.length ? Math.round((all.length - left.length) / all.length * 100) : 100, recent, onTrack: recent >= perDay * .8 || !left.length };
}

const speakP = (text, lang, rate) => new Promise(res => { let done = false; const fin = () => { if (!done) { done = true; res(); } }; speak(text, { lang, rate, onend: fin }); setTimeout(fin, 2500 + text.length * 110); });
const listenP = (lang, ms) => new Promise(res => { let got = '', r = listen(lang, t => { got = t; }, () => res(got)); if (!r) return; setTimeout(() => { try { r.stop(); } catch (e) {} }, ms); });
function trMatch(heard, tr) { const h = norm(heard); if (!h) return false; return tr.split(/[\/,;()]/).map(norm).filter(Boolean).some(o => similarity(h, o) >= .7 || h.includes(o) || o.includes(h) && h.length > 2); }
function handsFree() {
  if (!canEdit()) return; const now = Date.now(); let list = shuffle(D.cards.filter(c => c.due <= now)).slice(0, 20); if (!list.length) list = pick(D.cards, 15);
  if (!list.length) { toast('Kutunda kart yok', 'warn'); return; }
  HF = { list, i: 0, ok: 0, run: true, sr: !!SR };
  modal(`<div class="sheet-body" style="text-align:center;padding:28px 20px"><div id="hfFlo">${mascot('wave', 100)}</div><h3 style="margin:6px 0 2px">🎧 Eller serbest tekrar</h3><div class="muted" style="font-weight:700;font-size:14px">${HF.sr ? 'Almanca kelimeyi dinle, Türkçesini sesli söyle.' : 'Tarayıcın mikrofonu desteklemiyor: dinleme modunda Almanca + Türkçe sırayla okunur.'}</div>
    <div class="font-display" id="hfWord" style="font-size:34px;font-weight:800;margin:18px 0 4px"></div><div id="hfTr" class="muted" style="font-weight:800;min-height:24px"></div><div id="hfStat" style="font-weight:800;margin-top:10px;color:var(--a2d)"></div>
    <div class="row" style="justify-content:center;margin-top:18px"><b id="hfCount" class="chip"></b><button class="btn btn-red" onclick="stopHF()"><i class="fa-solid fa-stop"></i> Bitir</button></div></div>`, false, 460);
  hfLoop();
}
async function hfLoop() {
  while (HF && HF.run && HF.i < HF.list.length) {
    const c = HF.list[HF.i], set = (id, v) => { const e = document.getElementById(id); if (e) e.innerHTML = v; };
    set('hfCount', `${HF.i + 1}/${HF.list.length} · ✓ ${HF.ok}`); set('hfWord', `${wordEmoji(c.de, c)} ${esc(c.de)}`); set('hfTr', ''); set('hfStat', '🔊 Dinle…'); set('hfFlo', mascot('normal', 100));
    await speakP(c.de, 'de-DE'); if (!HF || !HF.run) break;
    if (HF.sr) {
      set('hfStat', '🎙️ Türkçesini söyle…'); const heard = await listenP('tr-TR', 5500); if (!HF || !HF.run) break;
      const ok = trMatch(heard, c.tr); set('hfTr', esc(c.tr)); set('hfStat', heard ? `Duyduğum: “${esc(heard)}”` : 'Ses duyamadım'); set('hfFlo', mascot(ok ? 'happy' : 'sad', 100));
      c.box = ok ? Math.min(5, c.box + 1) : 1; c.due = Date.now() + LEITNER_DAYS[c.box - 1] * DAY; D.stats.reviews++; questProgress('review', 1); if (ok) HF.ok++; save();
      await speakP(ok ? 'Doğru!' : 'Doğrusu: ' + c.tr, 'tr-TR'); if (!ok) await speakP(c.de, 'de-DE', .8);
    } else { await new Promise(r => setTimeout(r, 2500)); if (!HF || !HF.run) break; set('hfTr', esc(c.tr)); await speakP(c.tr, 'tr-TR'); D.stats.reviews++; questProgress('review', 1); save(); }
    HF.i++; await new Promise(r => setTimeout(r, 600));
  }
  if (HF && HF.run) { const n = HF.list.length, ok = HF.ok; HF = null; closeModal(); addXP(Math.max(3, ok)); toast(`🎧 Eller serbest tekrar bitti${SR ? `: ${ok}/${n} doğru` : ''}`); if (PAGE === 'review') go('review'); }
}
function stopHF() { if (HF) HF.run = false; HF = null; stopAllAudio(); closeModal(); if (PAGE === 'review') go('review'); }
const _review = VIEWS.review;
VIEWS.review = () => { let h = _review(); h = h.replace('<div style="font-size:52px">✨</div>', `<div>${mascot('happy', 96)}</div>`).replace('<div style="font-size:52px">🗂️</div>', `<div>${mascot('wave', 96)}</div>`);
  if (D.cards.length) h = h.replace('<button class="btn btn-ghost" onclick="go(\'deck\')">', `<button class="btn btn-ghost" onclick="handsFree()"><i class="fa-solid fa-headphones"></i> Eller serbest</button><button class="btn btn-ghost" onclick="go('deck')">`);
  return h; };

/* ---------- Seviye sertifikası ---------- */
async function certPdf(lv) {
  const L = LEVELS.find(x => x.id === lv); if (!D.boss[lv]) { toast('Önce ' + lv + ' seviye sonu sınavını geç', 'warn'); return; }
  const [c, cd] = PDF_HEX[L.color], sc = (D.bossScore || {})[lv], name = (PROFILES.find(x => x.id === PID) || {}).name || '', no = 'DF-' + lv + '-' + (hashStr(PID + lv) % 900000 + 100000);
  const date = new Date(sc ? sc.date : Date.now()).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
  pdfProgress(lv + ' sertifikası');
  const host = document.createElement('div'); host.className = 'pdf-host'; document.body.appendChild(host);
  host.innerHTML = `<div class="cert-doc" style="--lv:${c};--lvd:${cd}"><div class="cert-in">
    <div class="cert-top"><div class="cert-brand"><div class="brand-logo" style="width:46px;height:46px">D</div><b>DeutschFlow AI</b></div><div class="cert-no">Sertifika No: ${no}</div></div>
    <div class="cert-title">SERTİFİKA</div><div class="cert-sub">BAŞARI BELGESİ · ZERTIFIKAT</div>
    <div class="cert-txt">Bu belge,</div><div class="cert-name">${esc(name)}</div>
    <div class="cert-txt">adlı öğrencinin DeutschFlow AI Almanca programında <b>${L.id} · ${esc(L.tr)}</b> (${esc(L.name)}) seviyesinin tüm ünitelerini ve seviye sonu sınavını başarıyla tamamladığını onaylar.</div>
    <div class="cert-bottom"><div><div class="cert-k">Tarih</div><div class="cert-v">${date}</div></div><div class="cert-badge">${L.id}<small>${sc ? '%' + sc.score : ''}</small></div><div style="text-align:center"><img alt="" width="84" height="84" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(mascot('happy', 84).replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ').replace(/ class="[^"]*"/g, ''))}"><div class="cert-sign">Flo</div><div class="cert-k">DeutschFlow Koçu</div></div></div></div></div>`;
  try {
    if (!window.html2pdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js');
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    await html2pdf().set({ margin: 0, filename: `DeutschFlow-${lv}-Sertifika.pdf`, image: { type: 'jpeg', quality: .95 }, html2canvas: { scale: 2, backgroundColor: '#ffffff', logging: false }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' } }).from(host.firstChild).save();
    closeModal(); toast('🎓 Sertifika indirildi'); confettiBurst(true);
  } catch (e) { closeModal(); toast('Sertifika oluşturulamadı: ' + (e.message || e), 'err'); }
  finally { host.remove(); }
}
const _learn = VIEWS.learn;
VIEWS.learn = () => { let h = _learn(); LEVELS.forEach(L => { if (D.boss[L.id]) h = h.replace(`<button class="btn btn-sm" style="background:rgba(255,255,255,.22);box-shadow:none" onclick="go('guides');setTimeout(()=>{const e=document.getElementById('g-${L.id}')`, `<button class="btn btn-sm" style="background:#fff;color:var(--lvd);box-shadow:none;margin-right:6px" onclick="certPdf('${L.id}')"><i class="fa-solid fa-certificate"></i> Sertifika</button><button class="btn btn-sm" style="background:rgba(255,255,255,.22);box-shadow:none" onclick="go('guides');setTimeout(()=>{const e=document.getElementById('g-${L.id}')`); }); return h; };
const _badges = VIEWS.badges;
VIEWS.badges = () => { const got = LEVELS.filter(L => D.boss[L.id]); return _badges() + `<div class="section-title" style="margin-top:22px"><i class="fa-solid fa-certificate" style="color:var(--c2)"></i> Sertifikalarım</div>${got.length ? `<div class="grid-4">${got.map(L => `<button class="glass badge press" style="${lvStyle(L.color)}" onclick="certPdf('${L.id}')"><div class="b-ic" style="background:var(--lv)"><i class="fa-solid fa-certificate"></i></div><b>${L.id} Sertifikası</b><div class="muted" style="font-size:13px;font-weight:700">PDF indir</div></button>`).join('')}</div>` : `<div class="glass card empty">${mascot('think', 80)}<div>Bir seviyenin sonundaki sınavı %80 ile geçince sertifikan burada olacak.</div></div>`}`; };

/* ---------- Çalışma takvimi (ısı haritası) ---------- */
function heatmapHtml() {
  const weeks = 26, end = new Date(); end.setHours(12, 0, 0, 0); const start = new Date(end.getTime() - ((weeks - 1) * 7 + ((end.getDay() + 6) % 7)) * DAY);
  let cells = '', active = 0, best = 0, run = 0;
  for (let w = 0; w < weeks; w++) { cells += '<div class="hm-col">'; for (let d = 0; d < 7; d++) { const dt = new Date(start.getTime() + (w * 7 + d) * DAY); if (dt > end) { cells += '<i class="hm-x"></i>'; continue; }
    const k = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0'), xp = (D.days[k] || {}).xp || 0, lv = xp === 0 ? 0 : xp < 20 ? 1 : xp < 50 ? 2 : xp < 100 ? 3 : 4;
    if (xp) { active++; run++; best = Math.max(best, run); } else run = 0;
    cells += `<i class="hm-${lv}" title="${dt.toLocaleDateString('tr-TR')} · ${xp} XP"></i>`; } cells += '</div>'; }
  return `<div class="glass card" style="margin-bottom:16px"><div class="between"><div class="section-title" style="margin:0"><i class="fa-solid fa-calendar-check" style="color:var(--acc)"></i> Çalışma takvimi (son 6 ay)</div><div class="row"><span class="chip">${active} aktif gün</span><span class="chip">🔥 en uzun: ${best} gün</span></div></div>
    <div class="hm-wrap"><div class="hm-days"><span>Pzt</span><span></span><span>Çar</span><span></span><span>Cum</span><span></span><span>Paz</span></div><div class="hm">${cells}</div></div>
    <div class="row" style="justify-content:flex-end;margin-top:8px;font-size:12px;font-weight:800" class="muted"><span class="muted">az</span><i class="hm-0 hm-key"></i><i class="hm-1 hm-key"></i><i class="hm-2 hm-key"></i><i class="hm-3 hm-key"></i><i class="hm-4 hm-key"></i><span class="muted">çok</span></div></div>`;
}
const _report = VIEWS.report;
VIEWS.report = () => heatmapHtml() + _report();
AFTER.report = () => { const w = document.querySelector('.hm-wrap'); if (w) w.scrollLeft = w.scrollWidth; };

/* ---------- Öğrenme yolu: kıvrımlı patika + süslemeler ---------- */
const PATH_DECO = { A1: ['🌱', '🏡', '🥨'], A2: ['🌳', '🚲', '☕'], B1: ['🏢', '🎓', '🚆'], B2: ['🌍', '🎨', '📈'], C1: ['📜', '🏛️', '✒️'], C2: ['👑', '🎭', '📚'] };
function drawPaths() {
  document.querySelectorAll('.path').forEach((path, li) => {
    path.querySelectorAll('.path-svg,.path-deco').forEach(e => e.remove());
    const nodes = [...path.querySelectorAll('.node')]; if (nodes.length < 2) return;
    const pr = path.getBoundingClientRect(), pts = nodes.map(n => { const r = n.getBoundingClientRect(); return { x: r.left + r.width / 2 - pr.left, y: r.top + r.height / 2 - pr.top, done: n.classList.contains('done') }; });
    let segs = '';
    for (let i = 0; i < pts.length - 1; i++) { const a = pts[i], b = pts[i + 1], my = (a.y + b.y) / 2, d = `M${a.x} ${a.y} C${a.x} ${my} ${b.x} ${my} ${b.x} ${b.y}`;
      segs += `<path d="${d}" stroke="var(--stroke)" stroke-width="16" fill="none" stroke-linecap="round"/><path d="${d}" stroke="${a.done && b.done ? 'var(--lv)' : 'var(--muted)'}" stroke-width="${a.done && b.done ? 8 : 4}" stroke-dasharray="${a.done && b.done ? '0' : '2 12'}" fill="none" stroke-linecap="round" opacity="${a.done && b.done ? .9 : .5}"/>`; }
    path.insertAdjacentHTML('afterbegin', `<svg class="path-svg" width="${pr.width}" height="${pr.height}" aria-hidden="true">${segs}</svg>`);
    const deco = PATH_DECO[LEVELS[li] && LEVELS[li].id] || [];
    pts.forEach((p, i) => { if (i % 2 === 1 && deco.length) { const side = p.x > pr.width / 2 ? -1 : 1; path.insertAdjacentHTML('beforeend', `<div class="path-deco" style="left:${p.x + side * 130 - 22}px;top:${p.y - 24}px">${deco[Math.floor(i / 2) % deco.length]}</div>`); } });
  });
}
const _afterLearn = AFTER.learn; AFTER.learn = () => { if (_afterLearn) _afterLearn(); requestAnimationFrame(drawPaths); setTimeout(drawPaths, 500); };
addEventListener('resize', () => { if (PAGE === 'learn') drawPaths(); });

    <span class="stat-pill" title="XP"><i class="fa-solid fa-bolt" style="color:var(--c1)"></i>${D.xp}</span>
    <span class="stat-pill" title="Seviye"><i class="fa-solid fa-star" style="color:var(--b1)"></i><span class="tb-x">Seviye&nbsp;</span>${li.lvl}</span>
    <button class="icon-btn tb-x" title="Ekrana çiz" onclick="openDraw()"><i class="fa-solid fa-pen"></i></button>

    <button class="icon-btn tb-x" title="Profil değiştir" onclick="logout()" style="background:${p.color};color:#fff;font-weight:900">${esc(p.name.charAt(0).toUpperCase())}</button>
    <button class="icon-btn tb-more" title="Menü" onclick="tbMenu(event)" aria-label="Menü"><i class="fa-solid fa-ellipsis"></i></button>
  </div>`;
};
function tbMenu(ev) {
  ev.stopPropagation(); let m = $('#tbMenu'); if (m) { m.remove(); return; }
  const p = PROFILES.find(x => x.id === PID) || { name: '?' }, dark = document.documentElement.classList.contains('dark');
  m = document.createElement('div'); m.id = 'tbMenu'; m.className = 'glass';
  m.innerHTML = [['fa-robot', 'AI Öğretmen', 'toggleTutor()'], ['fa-pen', 'Ekrana çiz', 'openDraw()'], [dark ? 'fa-sun' : 'fa-moon', dark ? 'Açık tema' : 'Koyu tema', 'toggleTheme()'], ['fa-shield-halved', `Seri kalkanı: ${D.shields}/3`, ''], ['fa-gear', 'Ayarlar', "go('settings')"], ['fa-right-from-bracket', `Profil değiştir (${esc(p.name)})`, 'logout()']]
    .map(([ic, t, fn]) => `<button class="nav-item" ${fn ? `onclick="document.getElementById('tbMenu').remove();${fn}"` : 'disabled style="cursor:default"'}><i class="fa-solid ${ic}"></i>${t}</button>`).join('');

}
